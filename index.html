      if (a === 'file') Paul.downloadFile(p);
      if (a === 'print') app.navigate(`/paul/p/${p.id}/print`);
      if (a === 'delete' && await confirm({ title: 'Delete program?', text: `"${p.name}" will be deleted from this browser. Links and files you already shared keep working.`, ok: 'Delete', danger: true })) {
        await S.del('paul', p.id); list.splice(list.indexOf(p), 1); draw(); toast('Deleted.');
      }
    }));
    return () => offs.forEach((f) => f());
  };

  Paul.duplicate = async (p, name) => {
    const c = M.reId(p, 'program');
    c.name = name || `${p.name} (copy)`.slice(0, 120);
    return savePaul(c);
  };

  Paul.createDialog = (list, { copyFrom = null } = {}) => sheet({ title: 'New program' }, (body, close) => {
    const sorted = [...list].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
    body.innerHTML = String(html`
      <div class="seg" role="group" aria-label="Start from">
        <button type="button" class="seg-btn" data-from="scratch" aria-pressed="true">Blank</button>
        <button type="button" class="seg-btn" data-from="dup" aria-pressed="false" ${list.length ? '' : raw('disabled')}>Copy a saved program</button>
      </div>
      ${list.length ? html`<div class="copy-list" data-copy-list hidden role="radiogroup" aria-label="Program to copy">${sorted.map((p) => html`<button type="button" class="choice-btn" role="radio" aria-checked="false" data-src="${p.id}">${p.name}<small>${p.athlete ? `${p.athlete} · ` : ''}${P.util.plural(p.weeks.length, 'week')}</small></button>`)}</div>` : ''}
      <div class="field"><label for="np-name">Program name</label><input id="np-name" type="text" maxlength="120" placeholder="e.g. Strength block 1" autofocus></div>
      <div class="field"><label for="np-ath">Athlete (optional)</label><input id="np-ath" type="text" maxlength="80" placeholder="e.g. Marco"></div>
      <div class="ed-grid">
        <div class="field"><label for="np-start">Start date</label><input id="np-start" type="date" value="${nextMonday()}"></div>
        <div class="field"><label for="np-weeks">Duration (weeks)</label><input id="np-weeks" type="number" inputmode="numeric" min="1" max="104" value="12"></div>
      </div>
      <div class="field"><label for="np-notes">General instructions (optional)</label><textarea id="np-notes" rows="2" maxlength="4000" placeholder="Warm up, rest times, how to report pain…"></textarea></div>
      <p class="field-error" data-err hidden></p>
      <button class="btn btn-block btn-lg" data-go>Create program</button>`);
    let from = 'scratch', srcId = null, autoName = '';
    const $ = (q) => body.querySelector(q);
    const setFrom = (f) => {
      from = f;
      body.querySelectorAll('[data-from]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.from === f)));
      const l = $('[data-copy-list]'); if (l) l.hidden = f !== 'dup';
    };
    const pick = (id) => {
      const src = list.find((x) => x.id === id);
      if (!src) return;
      srcId = id;
      body.querySelectorAll('[data-src]').forEach((x) => x.setAttribute('aria-checked', String(x.dataset.src === id)));
      // fill what makes sense; the athlete stays blank (a copy is usually for someone else)
      const name = $('#np-name');
      if (!name.value.trim() || name.value === autoName) { autoName = `${src.name} (copy)`; name.value = autoName; }
      $('#np-weeks').value = src.durationWeeks || src.weeks.length;
      if (!$('#np-notes').value.trim()) $('#np-notes').value = src.notes || '';
    };
    body.querySelectorAll('[data-from]').forEach((b) => (b.onclick = () => setFrom(b.dataset.from)));
    body.querySelectorAll('[data-src]').forEach((b) => (b.onclick = () => pick(b.dataset.src)));
    if (copyFrom) { setFrom('dup'); pick(copyFrom); }
    body.querySelector('[data-go]').onclick = async () => {
      const err = (m) => { const e = body.querySelector('[data-err]'); e.textContent = m; e.hidden = false; };
      const name = body.querySelector('#np-name').value.trim();
      const start = body.querySelector('#np-start').value;
      const weeks = Number(body.querySelector('#np-weeks').value);
      if (!name) return err('Give the program a name.');
      if (from === 'dup' && !srcId) return err('Choose the program to copy.');
      if (!validIso(start)) return err('Choose a valid start date.');
      if (!Number.isInteger(weeks) || weeks < 1 || weeks > 104) return err('Duration must be 1–104 weeks.');
      let p;
      if (from === 'dup') {
        const src = list.find((x) => x.id === srcId);
        if (!src) return err('Choose the program to copy.');
        p = M.reId(src, 'program');
      } else p = M.newProgram();
      Object.assign(p, { name, athlete: body.querySelector('#np-ath').value.trim(), startDate: start, durationWeeks: weeks });
      const notes = body.querySelector('#np-notes').value.trim();
      if (notes || from === 'scratch') p.notes = notes;
      await savePaul(p);
      close(p);
    };
  });

  // ---------------------------------------------------------------- editor
  Paul.editor = async (root, app, params, query) => {
    const prog = await S.get('paul', params.id);
    if (!prog) { root.innerHTML = String(html`<div class="page no-nav">${UI.topBar({ title: 'Not found', back: '/paul/library' })}<div class="card"><p>This program isn't saved in this browser.</p><a class="btn" href="#/paul/library">Your programs</a></div></div>`); return; }
    let wi = Math.min(prog.weeks.length - 1, Math.max(0, Number(query.get('w')) || 0));
    const openDetails = new Set();
    let saveTimer = null;
    let index = new Map();

    const reindex = () => {
      index = new Map();
      prog.weeks.forEach((w, i) => {
        index.set(w.id, { kind: 'week', obj: w, list: prog.weeks, i });
        w.days.forEach((d, j) => {
          index.set(d.id, { kind: 'day', obj: d, list: w.days, i: j, week: w, wi: i });
          d.exercises.forEach((e, k) => index.set(e.id, { kind: 'ex', obj: e, list: d.exercises, i: k, day: d, week: w, wi: i }));
        });
      });
    };
    const setStatus = (t, dirty) => { const s = root.querySelector('[data-save-state]'); if (s) { s.textContent = t; s.classList.toggle('dirty', Boolean(dirty)); } };
    const save = () => {
      setStatus('Saving…', true);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => { try { await savePaul(prog); setStatus('Saved on this device'); } catch { setStatus('Not saved!', true); } }, 350);
    };
    const touch = (ex) => { if (ex?.gen && !ex.edited) { ex.edited = true; const b = root.querySelector(`[data-badge="${ex.id}"]`); if (b) { b.textContent = 'edited'; b.className = 'chip chip-edit'; } } };

    const exRow = (ex, d) => {
      const g = M.gridOf(ex);
      const open = openDetails.has(ex.id);
      return html`<div class="grid-row${ex.edited ? ' is-edited' : ex.gen ? ' is-gen' : ''}" data-ex="${ex.id}">
        <div class="g-ex"><select data-f="exerciseId" data-id="${ex.id}" aria-label="Exercise">${raw(exOptions(ex.exerciseId))}</select>
          ${ex.gen ? html`<span class="chip ${ex.edited ? 'chip-edit' : 'chip-gen'}" data-badge="${ex.id}">${ex.edited ? 'edited' : 'generated'}</span>` : ''}</div>
        <label class="g-cell"><span class="g-lab">Sets</span><input type="number" inputmode="numeric" min="1" max="30" value="${g.sets}" data-f="sets" data-id="${ex.id}" aria-label="Sets"></label>
        <label class="g-cell"><span class="g-lab">Reps</span><input type="${g.mixedReps ? 'text' : 'number'}" inputmode="numeric" min="1" max="100" value="${g.mixedReps ? 'mixed' : g.reps}" ${g.mixedReps ? raw('readonly data-mixed') : ''} data-f="reps" data-id="${ex.id}" aria-label="Reps"></label>
        <label class="g-cell"><span class="g-lab">kg</span><input type="${g.mixedKg || (g.bw && !g.kg) ? 'text' : 'number'}" inputmode="decimal" min="0" max="1000" step="0.5" value="${g.mixedKg ? 'mixed' : g.bw && !g.kg ? 'BW' : fmtKg(g.kg)}" ${g.mixedKg || (g.bw && !g.kg) ? raw('readonly data-mixed') : ''} data-f="kg" data-id="${ex.id}" aria-label="Weight in kg"></label>
        <button class="icon-btn sq g-menu" data-exmenu="${ex.id}" aria-label="Actions for ${exName(ex.exerciseId)}">${raw(I.more)}</button>
        <button class="g-more" data-toggle="${ex.id}" aria-expanded="${open}">${open ? '▾' : '▸'} ${detailSummary(ex)}</button>
        ${open ? detailsHtml(ex) : ''}
      </div>`;
    };
    const detailSummary = (ex) => {
      const bits = [];
      if (ex.rest) bits.push(`rest ${restText(ex.rest)}`);
      if (ex.sets.some((s) => s.rpe)) bits.push(`RPE ${ex.sets.find((s) => s.rpe).rpe}`);
      if (ex.sets.some((s) => s.rir !== null && s.rir !== undefined)) bits.push(`${ex.sets.find((s) => s.rir !== null && s.rir !== undefined).rir} RIR`);
      if (ex.tempo) bits.push(`tempo ${ex.tempo}`);
      if (ex.notes) bits.push('note');
      const g = M.gridOf(ex);
      if (g.mixedReps || g.mixedKg) bits.unshift(M.summarize(ex.sets));
      return bits.length ? bits.join(' · ') : 'Rest, RPE, tempo, notes, per-set';
    };
    const detailsHtml = (ex) => html`<div class="g-details" data-details="${ex.id}">
      <div class="ed-grid">
        <label>Rest<select data-f="rest" data-id="${ex.id}">${[0, 60, 90, 120, 150, 180, 240, 300].map((r) => html`<option value="${r}" ${(ex.rest ?? 0) === r ? raw('selected') : ''}>${restText(r) || 'none'}</option>`)}</select></label>
        <label>Tempo<input type="text" maxlength="20" placeholder="e.g. 3-1-1" value="${ex.tempo || ''}" data-f="tempo" data-id="${ex.id}"></label>
      </div>
      <label class="field" style="display:block;margin-top:8px">Instructions for the athlete<textarea rows="2" maxlength="2000" placeholder="Shown before Paulino's generic tips" data-f="notes" data-id="${ex.id}">${ex.notes || ''}</textarea></label>
      <p class="small muted" style="margin:10px 0 0"><b>BW</b> = bodyweight. <b>RPE</b> = how hard the set feels, 1–10 (10 = nothing left). <b>RIR</b> = reps left in reserve.</p>
      <div class="set-edit set-edit-head"><span>#</span><span>Reps</span><span>kg</span><span>BW</span><span>RPE</span><span>RIR</span><span></span></div>
      ${ex.sets.map((s, i) => html`<div class="set-edit">
        <span class="n">${i + 1}</span>
        <input type="number" inputmode="numeric" min="1" max="100" value="${s.reps}" data-set="${ex.id}" data-i="${i}" data-sf="reps" aria-label="Set ${i + 1} reps">
        <input type="number" inputmode="decimal" min="0" step="0.5" value="${s.kg ?? ''}" placeholder="${s.bw ? 'BW' : ''}" data-set="${ex.id}" data-i="${i}" data-sf="kg" aria-label="Set ${i + 1} kg">
        <input type="checkbox" ${s.bw ? raw('checked') : ''} data-set="${ex.id}" data-i="${i}" data-sf="bw" aria-label="Set ${i + 1} bodyweight">
        <input type="number" inputmode="decimal" min="1" max="10" step="0.5" value="${s.rpe ?? ''}" data-set="${ex.id}" data-i="${i}" data-sf="rpe" aria-label="Set ${i + 1} RPE">
        <input type="number" inputmode="numeric" min="0" max="10" value="${s.rir ?? ''}" data-set="${ex.id}" data-i="${i}" data-sf="rir" aria-label="Set ${i + 1} RIR">
        <button class="icon-btn sq tiny" data-delset="${ex.id}" data-i="${i}" aria-label="Delete set ${i + 1}" ${ex.sets.length === 1 ? raw('disabled') : ''}>✕</button></div>`)}
      <button class="btn btn-sm btn-ghost" data-addset="${ex.id}" style="margin-top:8px">+ Set</button>
    </div>`;

    const dayCard = (d, di, w) => html`<section class="card day-card" data-day="${d.id}">
      <div class="day-head">
        <input class="day-name" type="text" maxlength="60" value="${d.name}" data-f="name" data-id="${d.id}" aria-label="Day name">
        <button class="icon-btn sq" data-daymenu="${d.id}" aria-label="Actions for ${d.name}">${raw(I.more)}</button>
      </div>
      <div class="row small" style="margin:6px 0 10px">
        <select class="sel-sm" data-f="weekday" data-id="${d.id}" aria-label="Weekday">${WEEKDAYS_LONG.map((n, i) => html`<option value="${i}" ${i === d.weekday ? raw('selected') : ''}>${n}</option>`)}</select>
        <span class="muted">${fmtDate(M.dayDate(prog, wi, d))}</span>
      </div>
      ${d.exercises.length ? html`<div class="grid-head"><span>Exercise</span><span>Sets</span><span>Reps</span><span>kg</span><span></span></div>` : ''}
      ${d.exercises.map((ex) => exRow(ex, d))}
      ${d.exercises.length ? '' : html`<p class="muted small">No exercises yet.</p>`}
      <button class="btn btn-sm" data-addex="${d.id}" style="margin-top:10px">${raw(I.plus)} Add exercise</button>
      <details class="day-notes" ${d.notes ? raw('open') : ''}><summary>Notes for this day</summary><textarea rows="2" maxlength="2000" data-f="notes" data-id="${d.id}" placeholder="e.g. Superset bench + row">${d.notes || ''}</textarea></details>
    </section>`;

    function draw() {
      reindex();
      const w = prog.weeks[wi];
      const y = window.scrollY;
      root.innerHTML = String(html`<div class="page no-nav editor">
        <div class="editor-bar">
          <button class="icon-btn" data-action="back" data-fallback="/paul/library" aria-label="Back to programs">←</button>
          <div class="grow"><b class="ellipsis">${prog.name || 'Untitled'}</b><span class="save-state" data-save-state>Saved on this device</span></div>
          <button class="btn btn-sm" data-share>${raw(I.share)} Share</button>
        </div>
        <details class="card" style="margin-top:14px" ${!prog.name ? raw('open') : ''}><summary class="summary-h"><b>Program details</b> <span class="muted small">${prog.athlete ? `${prog.athlete} · ` : ''}starts ${fmtDate(prog.startDate, { weekday: false, year: true })}</span></summary>
          <div class="field" style="margin-top:12px"><label for="pd-name">Program name</label><input id="pd-name" class="input-big" type="text" maxlength="120" value="${prog.name}" data-f="name" data-id="program"></div>
          <div class="field"><label for="pd-ath">Athlete (optional)</label><input id="pd-ath" type="text" maxlength="80" value="${prog.athlete}" data-f="athlete" data-id="program"></div>
          <div class="ed-grid"><div class="field"><label for="pd-start">Start date</label><input id="pd-start" type="date" value="${prog.startDate}" data-f="startDate" data-id="program"></div>
            <div class="field"><label for="pd-dur">Planned weeks</label><input id="pd-dur" type="number" inputmode="numeric" min="1" max="104" value="${prog.durationWeeks}" data-f="durationWeeks" data-id="program"></div></div>
          <div class="field" style="margin:0"><label for="pd-notes">General instructions</label><textarea id="pd-notes" rows="3" maxlength="4000" data-f="notes" data-id="program">${prog.notes}</textarea></div>
        </details>

        <button class="btn btn-block btn-lg btn-magic" data-progress style="margin-top:16px">${raw(I.magic)} Repeat / Progress</button>
        <p class="small muted center" style="margin:6px 0 0">Build one week, then generate the others: repeat, add weight, reps or sets, deloads.</p>

        <div class="week-nav" role="group" aria-label="Weeks">
          <button class="icon-btn" data-week="-1" aria-label="Previous week" ${wi === 0 ? raw('disabled') : ''}>‹</button>
          <select data-weeksel aria-label="Choose week">${prog.weeks.map((x, i) => html`<option value="${i}" ${i === wi ? raw('selected') : ''}>${M.weekLabel(prog, i)}${x.gen ? (x.gen.deload ? ' · deload' : ' · generated') : ''}</option>`)}</select>
          <button class="icon-btn" data-week="1" aria-label="Next week" ${wi === prog.weeks.length - 1 ? raw('disabled') : ''}>›</button>
          <button class="icon-btn" data-weekmenu aria-label="Week actions">${raw(I.more)}</button>
        </div>
        <p class="center small muted" style="margin:4px 0 12px">${M.weekDates(prog, wi)} · ${prog.weeks.length} of ${prog.durationWeeks} planned weeks
          ${w.gen ? html`<br><span class="chip ${w.gen.deload ? 'chip-warn' : 'chip-gen'}">${w.gen.deload ? 'Deload week' : 'Generated'} from week ${w.gen.from}</span>` : ''}</p>

        ${w.days.map((d, di) => dayCard(d, di, w))}
        <button class="btn btn-block btn-ghost" data-addday ${w.days.length >= 7 ? raw('disabled') : ''}>${raw(I.plus)} Add training day</button>
      </div>`);
      window.scrollTo(0, y);
    }

    const findEx = (id) => index.get(id)?.obj;
    const offs = [];

    // simple fields: commit on input (no re-render: a re-render on blur would eat the next tap)
    offs.push(on(root, 'input', '[data-f]', (e, el) => {
      const f = el.dataset.f;
      if (el.tagName === 'SELECT') return;
      if (el.dataset.id === 'program') {
        if (f === 'durationWeeks') { const n = Number(el.value); if (Number.isInteger(n) && n >= 1 && n <= 104) prog.durationWeeks = n; else { el.classList.add('invalid'); return; } }
        else if (f === 'startDate') { if (!validIso(el.value)) return; prog.startDate = el.value; }
        else prog[f] = el.value;
        el.classList.remove('invalid');
        return save();
      }
      const ent = index.get(el.dataset.id);
      if (!ent) return;
      if (ent.kind === 'day') { ent.obj[f] = el.value; return save(); }
      const ex = ent.obj;
      if (el.hasAttribute('data-mixed')) return;
      if (f === 'tempo' || f === 'notes') { ex[f] = el.value; touch(ex); return save(); }
      const v = num(el.value);
      const ok = f === 'sets' ? Number.isInteger(v) && v >= 1 && v <= 30 : f === 'reps' ? Number.isInteger(v) && v >= 1 && v <= 100 : v !== null && v >= 0 && v <= 1000;
      el.classList.toggle('invalid', !ok);
      if (!ok) return;
      M.setGrid(ex, f, v);
      touch(ex);
      save();
      if (f === 'sets' && openDetails.has(ex.id)) redrawDetails(ex);
    }));
    offs.push(on(root, 'change', '[data-f]', (e, el) => {
      const f = el.dataset.f;
      if (el.classList.contains('invalid')) {
        toast(f === 'sets' ? 'Sets: 1–30' : f === 'reps' ? 'Reps: a whole number from 1 to 100' : f === 'kg' ? 'Weight: 0–1000 kg' : 'Check this value', { kind: 'error' });
        return;
      }
      if (el.tagName !== 'SELECT') { if (el.dataset.id === 'program' && f === 'startDate') draw(); return; }
      const ent = index.get(el.dataset.id);
      if (f === 'weekday') { ent.obj.weekday = Number(el.value); save(); draw(); return; }
      if (f === 'exerciseId') {
        const ex = ent.obj;
        ex.exerciseId = el.value;
        if (el.value === 'pull-up') ex.sets.forEach((s) => { if (!s.kg) { s.bw = true; s.kg = null; } });
        else ex.sets.forEach((s) => { if (s.bw && !s.kg) { s.bw = false; s.kg = 20; } });
        touch(ex); save(); draw(); return;
      }
      if (f === 'rest') { const ex = ent.obj; ex.rest = Number(el.value) || null; touch(ex); save(); const t = root.querySelector(`[data-toggle="${ex.id}"]`); if (t) t.textContent = `▾ ${detailSummary(ex)}`; }
    }));
    // mixed cells: tap to set all sets to one value
    offs.push(on(root, 'click', 'input[data-mixed]', async (e, el) => {
      const ex = findEx(el.dataset.id);
      const f = el.dataset.f;
      const v = await prompt({ title: f === 'reps' ? 'Same reps for every set?' : 'Same weight for every set?', label: f === 'reps' ? 'Reps' : 'Weight (kg)', value: '', ok: 'Apply to all sets', maxlength: 6 });
      const n = num(v);
      if (n === null || (f === 'reps' ? !(Number.isInteger(n) && n >= 1 && n <= 100) : !(n >= 0 && n <= 1000))) { if (v) toast('That value is not valid.', { kind: 'error' }); return; }
      M.setGrid(ex, f, n);
      if (f === 'kg') ex.sets.forEach((s) => { if (!n) s.bw = s.bw && true; });
      touch(ex); save(); draw();
    }));
    // per-set edits
    offs.push(on(root, 'change', '[data-set]', (e, el) => {
      const ex = findEx(el.dataset.set);
      const s = ex.sets[Number(el.dataset.i)];
      const f = el.dataset.sf;
      if (f === 'bw') { s.bw = el.checked; if (!el.checked && (s.kg === null || s.kg === undefined)) s.kg = 0; }
      else {
        const v = num(el.value);
        const rules = { reps: [1, 100, true], kg: [0, 1000, false], rpe: [1, 10, false], rir: [0, 10, true] }[f];
        if (v === null && (f === 'rpe' || f === 'rir' || (f === 'kg' && s.bw))) s[f] = null;
        else if (v === null || v < rules[0] || v > rules[1] || (rules[2] && !Number.isInteger(v))) { el.classList.add('invalid'); toast(`Set ${Number(el.dataset.i) + 1}: ${f.toUpperCase()} must be ${rules[0]}–${rules[1]}`, { kind: 'error' }); return; }
        else s[f] = v;
      }
      touch(ex); save(); draw();
    }));
    offs.push(on(root, 'click', '[data-addset]', (e, el) => { const ex = findEx(el.dataset.addset); if (ex.sets.length < 30) ex.sets.push(clone(ex.sets[ex.sets.length - 1])); touch(ex); save(); draw(); }));
    offs.push(on(root, 'click', '[data-delset]', (e, el) => { const ex = findEx(el.dataset.delset); if (ex.sets.length > 1) ex.sets.splice(Number(el.dataset.i), 1); touch(ex); save(); draw(); }));
    offs.push(on(root, 'click', '[data-toggle]', (e, el) => { const id = el.dataset.toggle; if (openDetails.has(id)) openDetails.delete(id); else openDetails.add(id); draw(); }));
    const redrawDetails = (ex) => { const d = root.querySelector(`[data-details="${ex.id}"]`); if (d) d.outerHTML = String(detailsHtml(ex)); };

    // structure
    offs.push(on(root, 'click', '[data-addex]', async (e, el) => {
      const d = index.get(el.dataset.addex).obj;
      const id = await pickExercise();
      if (!id) return;
      const prev = [...prog.weeks.flatMap((w) => w.days.flatMap((x) => x.exercises))].reverse().find((x) => x.exerciseId === id);
      const ex = prev ? { ...M.reId(prev, 'exercise'), gen: false, edited: false, src: undefined } : M.newExercise(id);
      delete ex.src;
      d.exercises.push(ex);
      save(); draw();
    }));
    offs.push(on(root, 'click', '[data-addday]', () => {
      const w = prog.weeks[wi];
      const used = new Set(w.days.map((d) => d.weekday));
      const wd = [0, 2, 4, 1, 3, 5, 6].find((x) => !used.has(x)) ?? 0;
      w.days.push(M.newDay(`Day ${w.days.length + 1}`, wd));
      w.days.sort((a, b) => a.weekday - b.weekday);
      save(); draw();
    }));
    offs.push(on(root, 'click', '[data-week]', (e, el) => { wi = Math.max(0, Math.min(prog.weeks.length - 1, wi + Number(el.dataset.week))); app.replaceQuery({ w: wi }); draw(); window.scrollTo(0, 0); }));
    offs.push(on(root, 'change', '[data-weeksel]', (e, el) => { wi = Number(el.value); app.replaceQuery({ w: wi }); draw(); }));
    offs.push(on(root, 'click', '[data-share]', () => Paul.shareDialog(prog, app)));
    offs.push(on(root, 'click', '[data-progress]', async () => {
      const r = await Paul.progressWizard(prog, wi);
      if (!r) return;
      prog.weeks = r.program.weeks;
      prog.durationWeeks = Math.max(prog.durationWeeks, prog.weeks.length);
      await savePaul(prog);
      wi = Math.min(wi + 1, prog.weeks.length - 1);
      app.replaceQuery({ w: wi });
      draw();
      toast(`Done: ${P.util.plural(r.report.generated, 'week')} generated.${r.report.keptEdits ? ` ${r.report.keptEdits} manual edits kept.` : ''}`, { kind: 'ok', ms: 4200 });
    }));
    offs.push(on(root, 'click', '[data-weekmenu]', async () => {
      const w = prog.weeks[wi];
      const a = await sheet({ title: M.weekLabel(prog, wi) }, (body, close) => {
        body.innerHTML = String(html`<div class="choices">
          <button class="choice-btn" data-a="rename">Rename week</button>
          <button class="choice-btn" data-a="dup">${raw(I.dup)} Duplicate week<small>Insert an identical copy right after it</small></button>
          <button class="choice-btn" data-a="add">${raw(I.plus)} Add empty week after</button>
          <button class="choice-btn" data-a="addend">${raw(I.plus)} Add week at the end</button>
          <button class="choice-btn choice-danger" data-a="del" ${prog.weeks.length === 1 ? raw('disabled') : ''}>${raw(I.trash)} Delete week</button></div>`);
        body.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => close(b.dataset.a)));
      });
      if (a === 'rename') { const n = await prompt({ title: 'Rename week', label: 'Week name', value: w.label || M.weekLabel(prog, wi), maxlength: 60 }); if (n !== undefined && n !== null) w.label = n === `Week ${wi + 1}` ? '' : n; }
      if (a === 'dup') { const c = M.reId(w, 'week'); delete c.gen; c.label = ''; c.days.forEach((d) => { delete d.src; d.exercises.forEach((x) => { x.gen = false; x.edited = false; delete x.src; }); }); prog.weeks.splice(wi + 1, 0, c); wi++; }
      if (a === 'add') { prog.weeks.splice(wi + 1, 0, M.newWeek([])); wi++; }
      if (a === 'addend') { prog.weeks.push(M.newWeek([])); wi = prog.weeks.length - 1; }
      if (a === 'del' && await confirm({ title: 'Delete week?', text: `${M.weekLabel(prog, wi)} and its ${w.days.length} days will be removed.`, ok: 'Delete', danger: true })) { prog.weeks.splice(wi, 1); wi = Math.max(0, wi - 1); }
      if (prog.weeks.length > prog.durationWeeks) prog.durationWeeks = prog.weeks.length;
      if (a) { app.replaceQuery({ w: wi }); save(); draw(); }
    }));
    offs.push(on(root, 'click', '[data-daymenu]', async (e, el) => {
      const ent = index.get(el.dataset.daymenu);
      const d = ent.obj;
      const a = await sheet({ title: d.name }, (body, close) => {
        body.innerHTML = String(html`<div class="choices">
          <button class="choice-btn" data-a="dup">${raw(I.dup)} Duplicate day</button>
          <button class="choice-btn" data-a="copy">Copy day to another week…</button>
          <button class="choice-btn" data-a="up" ${ent.i === 0 ? raw('disabled') : ''}>${raw(I.up)} Move up</button>
          <button class="choice-btn" data-a="down" ${ent.i === ent.list.length - 1 ? raw('disabled') : ''}>${raw(I.down)} Move down</button>
          <button class="choice-btn choice-danger" data-a="del">${raw(I.trash)} Remove day</button></div>`);
        body.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => close(b.dataset.a)));
      });
      if (a === 'dup') { if (ent.list.length >= 7) return toast('Maximum 7 days per week.', { kind: 'error' }); const c = M.reId(d, 'day'); c.name = `${d.name} (copy)`.slice(0, 60); delete c.src; ent.list.splice(ent.i + 1, 0, c); }
      if (a === 'copy') {
        const target = await pickWeek(prog, wi, 'Copy day to which week?');
        if (target === null || target === undefined) return;
        if (prog.weeks[target].days.length >= 7) return toast('That week already has 7 days.', { kind: 'error' });
        const c = M.reId(d, 'day'); delete c.src; c.exercises.forEach((x) => { x.gen = false; x.edited = false; delete x.src; });
        prog.weeks[target].days.push(c);
        toast(`Copied to ${M.weekLabel(prog, target)}.`, { kind: 'ok' });
      }
      if (a === 'up' || a === 'down') { const j = ent.i + (a === 'up' ? -1 : 1); [ent.list[ent.i], ent.list[j]] = [ent.list[j], ent.list[ent.i]]; }
      if (a === 'del' && await confirm({ title: 'Remove day?', text: `${d.name} and its ${d.exercises.length} exercises will be removed from ${M.weekLabel(prog, wi)}.`, ok: 'Remove', danger: true })) ent.list.splice(ent.i, 1);
      if (a) { save(); draw(); }
    }));
    offs.push(on(root, 'click', '[data-exmenu]', async (e, el) => {
      const ent = index.get(el.dataset.exmenu);
      const ex = ent.obj;
      const a = await sheet({ title: exName(ex.exerciseId) }, (body, close) => {
        body.innerHTML = String(html`<p class="small muted" style="margin-top:0">${M.summarize(ex.sets)}</p><div class="choices">
          <button class="choice-btn" data-a="up" ${ent.i === 0 ? raw('disabled') : ''}>${raw(I.up)} Move up</button>
          <button class="choice-btn" data-a="down" ${ent.i === ent.list.length - 1 ? raw('disabled') : ''}>${raw(I.down)} Move down</button>
          <button class="choice-btn" data-a="dup">${raw(I.dup)} Duplicate</button>
          <button class="choice-btn" data-a="move">Move to another day…</button>
          <button class="choice-btn" data-a="copy">Copy to another day…</button>
          <button class="choice-btn" data-a="details">Advanced options & per-set</button>
          ${ex.edited ? html`<button class="choice-btn" data-a="unedit">Mark as generated again<small>Keeps the values; next Repeat / Progress may overwrite it</small></button>` : ''}
          <button class="choice-btn choice-danger" data-a="del">${raw(I.trash)} Delete</button></div>`);
        body.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => close(b.dataset.a)));
      });
      if (a === 'up' || a === 'down') { const j = ent.i + (a === 'up' ? -1 : 1); [ent.list[ent.i], ent.list[j]] = [ent.list[j], ent.list[ent.i]]; }
      if (a === 'dup') { const c = M.reId(ex, 'exercise'); c.gen = false; c.edited = false; delete c.src; ent.list.splice(ent.i + 1, 0, c); }
      if (a === 'move' || a === 'copy') {
        const t = await pickDay(prog, wi, ent.day.id, a === 'move' ? 'Move to which day?' : 'Copy to which day?');
        if (!t) return;
        const target = index.get(t).obj;
        if (a === 'move') { ent.list.splice(ent.i, 1); target.exercises.push(ex); }
        else { const c = M.reId(ex, 'exercise'); c.gen = false; c.edited = false; delete c.src; target.exercises.push(c); }
        toast(a === 'move' ? 'Moved.' : 'Copied.', { kind: 'ok' });
      }
      if (a === 'details') openDetails.add(ex.id);
      if (a === 'unedit') ex.edited = false;
      if (a === 'del') ent.list.splice(ent.i, 1);
      if (a) { save(); draw(); }
    }));

    draw();
    return () => { offs.forEach((f) => f()); if (saveTimer) { clearTimeout(saveTimer); savePaul(prog); } };
  };

  const restText = (s) => (s ? (s % 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s / 60} min`) : '');
  Paul.restText = restText;

  function pickExercise() {
    return sheet({ title: 'Add exercise' }, (body, close) => {
      body.innerHTML = String(html`${Object.entries(CATEGORIES).map(([cat, label]) => {
        const list = EXERCISES.filter((e) => e.category === cat);
        return list.length ? html`<h3 class="pick-h">${label}</h3><div class="choices pick-grid">${list.map((e) => html`<button class="choice-btn" data-pick="${e.id}">${e.name}</button>`)}</div>` : '';
      })}<p class="small muted" style="margin-top:14px">Missing one? <a href="#/paul/exercises/new" data-close-sheet>Add an exercise</a>.</p>`);
      body.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => close(b.dataset.pick)));
      body.querySelector('[data-close-sheet]')?.addEventListener('click', () => close(null));
    });
  }
  function pickWeek(prog, current, title) {
    return sheet({ title }, (body, close) => {
      body.innerHTML = String(html`<div class="choices">${prog.weeks.map((w, i) => html`<button class="choice-btn" data-w="${i}" ${i === current ? raw('disabled') : ''}>${M.weekLabel(prog, i)}<small>${M.weekDates(prog, i)}</small></button>`)}</div>`);
      body.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => close(Number(b.dataset.w))));
    });
  }
  function pickDay(prog, wi, exclude, title) {
    return sheet({ title }, (body, close) => {
      body.innerHTML = String(html`${prog.weeks.map((w, i) => html`<h3 class="pick-h">${M.weekLabel(prog, i)}${i === wi ? ' (this week)' : ''}</h3><div class="choices">
        ${w.days.map((d) => html`<button class="choice-btn" data-d="${d.id}" ${d.id === exclude ? raw('disabled') : ''}>${d.name}<small>${WEEKDAYS_LONG[d.weekday]}</small></button>`)}
        ${w.days.length ? '' : html`<p class="small muted">No days</p>`}</div>`)}`);
      body.querySelectorAll('[data-d]').forEach((b) => (b.onclick = () => close(b.dataset.d)));
    });
  }

  // ------------------------------------------------------ Repeat / Progress
  Paul.progressWizard = (prog, currentWeek) => sheet({ title: 'Repeat / Progress', wide: true, label: 'Repeat and progress' }, (body, close) => {
    const st = {
      from: currentWeek,
      count: Math.max(1, (prog.durationWeeks || 12) - currentWeek - 1),
      replace: true,
      keepEdited: true,
      rules: [],
    };
    if (st.count < 1) st.count = 1;
    let timer = null;

    const templateEx = () => prog.weeks[st.from].days.flatMap((d) => d.exercises.map((e) => ({ e, d })));
    const lifts = () => [...new Set(templateEx().map((x) => x.e.exerciseId))];
    const amountUnit = (op) => ({ weight: 'kg', percent: '%', reps: 'reps', sets: 'sets' }[op] || '');
    const limitUnit = (op) => ({ weight: 'kg', percent: 'kg', reps: 'reps', sets: 'sets', deload: 'kg' }[op] || '');

    const ruleCard = (r, i) => html`<div class="rule" data-rule="${r.id}">
      <div class="rule-head"><b>Rule ${i + 1}</b><button class="icon-btn sq tiny" data-delrule="${r.id}" aria-label="Remove rule ${i + 1}">✕</button></div>
      <div class="ed-grid">
        <label>What<select data-r="op">${Object.entries(R.OPS).map(([k, l]) => html`<option value="${k}" ${k === r.op ? raw('selected') : ''}>${l}</option>`)}</select></label>
        ${['weight', 'percent', 'reps', 'sets'].includes(r.op) ? html`<label>Amount (${amountUnit(r.op)})<input type="number" inputmode="decimal" step="${r.op === 'reps' || r.op === 'sets' ? 1 : 0.25}" value="${r.amount}" data-r="amount" aria-describedby="hint-${r.id}"></label>` : ''}
        ${r.op === 'deload' ? html`<label>Lighter by (%)<input type="number" inputmode="decimal" min="0" max="99" value="${r.deloadPct}" data-r="deloadPct"></label>` : ''}
      </div>
      ${r.op !== 'repeat' ? html`<label class="every">${r.op === 'deload' ? 'Every' : 'Apply every'}
        <select data-r="every">${[1, 2, 3, 4, 5, 6, 8].map((n) => html`<option value="${n}" ${Number(r.every) === n ? raw('selected') : ''}>${n === 1 ? 'week' : `${n} weeks`}</option>`)}<option value="custom" ${![1, 2, 3, 4, 5, 6, 8].includes(Number(r.every)) ? raw('selected') : ''}>N weeks…</option></select>
        ${![1, 2, 3, 4, 5, 6, 8].includes(Number(r.every)) ? html`<input type="number" inputmode="numeric" min="1" max="52" value="${r.every}" data-r="every" aria-label="Every N weeks" style="width:80px">` : ''}</label>
        <p class="small muted" id="hint-${r.id}" style="margin:4px 0 0">${r.op === 'deload' ? `Weeks ${[1, 2, 3].map((k) => k * r.every).filter((n) => n <= st.from + 1 + st.count).join(', ') || '–'}${st.from + 1 + st.count > 3 * r.every ? '…' : ''} (counting the template as week 1). Four weeks is a block, not a calendar month.`
          : `Changes from week ${st.from + 1 + Number(r.every)} on, then every ${Number(r.every) === 1 ? 'week' : `${r.every} weeks`} (template = week ${st.from + 1}).`}</p>` : ''}
      ${r.op === 'deload' ? html`<div class="ed-grid" style="margin-top:8px"><label>Fewer sets<input type="number" inputmode="numeric" min="0" max="10" value="${r.deloadSets || 0}" data-r="deloadSets"></label>
        <label class="check" style="align-self:end"><input type="checkbox" data-r="reset" ${r.reset ? raw('checked') : ''}> Start the weight increases again after it</label></div>` : ''}
      ${r.op !== 'repeat' ? html`<fieldset class="scope"><legend class="label">Applies to</legend>
        <select data-r="scopeType" aria-label="Applies to">${[['all', 'All exercises'], ['lifts', 'Selected exercises'], ['days', 'Selected days'], ['items', 'Single entries']].map(([k, l]) => html`<option value="${k}" ${(r.scope?.type || 'all') === k ? raw('selected') : ''}>${l}</option>`)}</select>
        ${r.scope?.type === 'lifts' ? html`<div class="chips">${lifts().map((id) => html`<label class="chip-check"><input type="checkbox" data-scope="${id}" ${r.scope.ids.includes(id) ? raw('checked') : ''}> ${exName(id)}</label>`)}</div>` : ''}
        ${r.scope?.type === 'days' ? html`<div class="chips">${prog.weeks[st.from].days.map((d) => html`<label class="chip-check"><input type="checkbox" data-scope="${d.id}" ${r.scope.ids.includes(d.id) ? raw('checked') : ''}> ${d.name}</label>`)}</div>` : ''}
        ${r.scope?.type === 'items' ? html`<div class="chips">${templateEx().map(({ e, d }) => html`<label class="chip-check"><input type="checkbox" data-scope="${e.id}" ${r.scope.ids.includes(e.id) ? raw('checked') : ''}> ${exName(e.exerciseId)} · ${d.name}</label>`)}</div>` : ''}
      </fieldset>
      <details class="limits"><summary>Limits & rounding</summary><div class="ed-grid">
        ${r.op !== 'deload' ? html`<label>Min (${limitUnit(r.op)})<input type="number" inputmode="decimal" min="0" value="${r.min}" data-r="min"></label><label>Max (${limitUnit(r.op)})<input type="number" inputmode="decimal" min="0" value="${r.max}" data-r="max"></label>` : ''}
        ${['weight', 'percent', 'deload'].includes(r.op) ? html`<label>Round loads to<select data-r="round">${[[0, 'no rounding'], [0.5, '0.5 kg'], [1, '1 kg'], [1.25, '1.25 kg'], [2.5, '2.5 kg'], [5, '5 kg']].map(([v, l]) => html`<option value="${v}" ${Number(r.round) === v ? raw('selected') : ''}>${l}</option>`)}</select></label>` : ''}
      </div></details>` : ''}
    </div>`;

    function draw() {
      const editedCount = prog.weeks.slice(st.from + 1, st.from + 1 + (st.replace ? st.count : 0)).flatMap((w) => w.days.flatMap((d) => d.exercises)).filter((e) => e.edited).length;
      const existingAfter = st.replace ? Math.min(st.count, prog.weeks.length - st.from - 1) : 0;
      body.innerHTML = String(html`
        <div class="ed-grid">
          <label>Template week<select data-s="from">${prog.weeks.map((w, i) => html`<option value="${i}" ${i === st.from ? raw('selected') : ''}>${M.weekLabel(prog, i)} (${w.days.reduce((a, d) => a + d.exercises.length, 0)} exercises)</option>`)}</select></label>
          <label>Weeks to generate<input type="number" inputmode="numeric" min="1" max="${103 - st.from}" value="${st.count}" data-s="count"></label>
        </div>
        <div class="seg" role="group" aria-label="Where to put the weeks" style="margin-top:10px">
          <button type="button" data-s="replace" data-v="1" aria-pressed="${st.replace}">Overwrite following weeks</button>
          <button type="button" data-s="replace" data-v="0" aria-pressed="${!st.replace}">Insert, keep existing</button>
        </div>
        <p class="small muted" style="margin:6px 0 0">${st.replace ? `Weeks ${st.from + 2}–${st.from + 1 + st.count} ${existingAfter ? `(${existingAfter} existing) ` : ''}will be replaced.` : `New weeks go right after ${M.weekLabel(prog, st.from)}; later weeks move down.`} Result: ${st.replace ? Math.max(prog.weeks.length, st.from + 1 + st.count) : prog.weeks.length + st.count} weeks.</p>
        ${st.replace && editedCount ? html`<label class="check"><input type="checkbox" data-s="keepEdited" ${st.keepEdited ? raw('checked') : ''}> Keep my ${editedCount} manual ${editedCount === 1 ? 'edit' : 'edits'} in those weeks</label>` : ''}
        <h3 style="margin:16px 0 8px">Rules</h3>
        ${st.rules.length ? st.rules.map(ruleCard) : html`<p class="muted small">No rules: the week is repeated unchanged.</p>`}
        <div class="presets"><span class="small muted">Add:</span>
          <button class="btn btn-sm btn-ghost" data-preset="weight">+2.5 kg / week</button>
          <button class="btn btn-sm btn-ghost" data-preset="reps">+1 rep / 2 weeks</button>
          <button class="btn btn-sm btn-ghost" data-preset="sets">+1 set / 4 weeks</button>
          <button class="btn btn-sm btn-ghost" data-preset="percent">+2% / 2 weeks</button>
          <button class="btn btn-sm btn-ghost" data-preset="deload">Deload every 4th week</button>
          <button class="btn btn-sm btn-ghost" data-preset="blank">Custom rule</button>
        </div>
        <div data-errors></div>
        <h3 style="margin:18px 0 8px">Preview</h3>
        <div class="preview-wrap" data-preview></div>
        <div class="btn-row sticky-actions"><button class="btn btn-lg" data-apply>Apply</button><button class="btn btn-ghost" data-cancel>Cancel</button></div>`);
      updatePreview();
    }

    function updatePreview() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const errs = R.validate(st.rules, { from: st.from, count: st.count, weeks: prog.weeks.length });
        const box = body.querySelector('[data-errors]');
        box.innerHTML = errs.length ? String(html`<div class="notice notice-danger"><ul class="tight">${errs.map((e) => html`<li>${e}</li>`)}</ul></div>`) : '';
        body.querySelector('[data-apply]').disabled = errs.length > 0 || !templateEx().length;
        const pv = body.querySelector('[data-preview]');
        if (!templateEx().length) { pv.innerHTML = '<p class="notice">The template week has no exercises yet.</p>'; return; }
        if (errs.length) { pv.innerHTML = '<p class="muted small">Fix the rules to see the preview.</p>'; return; }
        const t = R.preview(prog, { ...st });
        pv.innerHTML = String(html`<table class="preview" data-preview-table><thead><tr><th>Week</th>${t.columns.map((c) => html`<th>${c.label}<br><span class="muted">${c.day}</span></th>`)}</tr></thead>
          <tbody>${t.rows.map((r) => html`<tr class="${r.template ? 'tpl' : ''}${r.deload ? ' deload' : ''}"><th>${r.week}${r.template ? ' (template)' : ''}${r.deload ? ' · deload' : ''}</th>${r.cells.map((c) => html`<td class="${c.edited ? 'kept' : ''}">${c.text}${c.edited ? ' ✎' : ''}</td>`)}</tr>`)}</tbody></table>
          ${st.rules.length ? html`<ul class="small rule-list">${st.rules.map((r) => html`<li>${R.describe(r, prog, st.from)}</li>`)}</ul>` : ''}`);
      }, 120);
    }

    const ruleOf = (el) => st.rules.find((r) => r.id === el.closest('[data-rule]').dataset.rule);
    body.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.s === 'from') { st.from = Number(el.value); st.rules.forEach((r) => { if (r.scope.type === 'days' || r.scope.type === 'items') r.scope = { type: 'all' }; }); return draw(); }
      if (el.dataset.s === 'count') { const n = Number(el.value); st.count = Number.isInteger(n) ? n : 0; return draw(); }
      if (el.dataset.s === 'keepEdited') { st.keepEdited = el.checked; return updatePreview(); }
      if (el.dataset.r) {
        const r = ruleOf(el);
        const f = el.dataset.r;
        if (f === 'op') { const nr = R.newRule(el.value, { id: r.id, scope: r.scope }); Object.keys(r).forEach((k) => delete r[k]); Object.assign(r, nr); return draw(); }
        if (f === 'every') { if (el.value === 'custom') { r.every = 7; return draw(); } r.every = Number(el.value); return draw(); }
        if (f === 'scopeType') { r.scope = { type: el.value, ids: el.value === 'lifts' ? lifts().slice(0, 1) : [] }; return draw(); }
        if (f === 'reset') r.reset = el.checked;
        else if (f === 'round') r.round = Number(el.value);
        else r[f] = el.value === '' ? '' : Number(el.value);
        return updatePreview();
      }
      if (el.dataset.scope) {
        const r = ruleOf(el);
        r.scope.ids = el.checked ? [...new Set([...r.scope.ids, el.dataset.scope])] : r.scope.ids.filter((x) => x !== el.dataset.scope);
        return updatePreview();
      }
    });
    body.addEventListener('input', (e) => {
      const el = e.target;
      if (el.dataset.r && el.tagName === 'INPUT' && el.type === 'number') { const r = ruleOf(el); r[el.dataset.r] = el.value === '' ? '' : Number(el.value); updatePreview(); }
      if (el.dataset.s === 'count') { const n = Number(el.value); st.count = Number.isInteger(n) ? n : 0; updatePreview(); }
    });
    body.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.s === 'replace') { st.replace = b.dataset.v === '1'; return draw(); }
      if (b.dataset.delrule) { st.rules = st.rules.filter((r) => r.id !== b.dataset.delrule); return draw(); }
      if (b.dataset.preset) {
        const p = b.dataset.preset;
        st.rules.push(p === 'weight' ? R.newRule('weight', { amount: 2.5, every: 1 }) : p === 'reps' ? R.newRule('reps', { amount: 1, every: 2 })
          : p === 'sets' ? R.newRule('sets', { amount: 1, every: 4, max: 8 }) : p === 'percent' ? R.newRule('percent', { amount: 2, every: 2 })
          : p === 'deload' ? R.newRule('deload', { every: 4, deloadPct: 10 }) : R.newRule('weight', { amount: 2.5 }));
        return draw();
      }
      if (b.hasAttribute('data-cancel')) return close(null);
      if (b.hasAttribute('data-apply')) {
        const errs = R.validate(st.rules, { from: st.from, count: st.count, weeks: prog.weeks.length });
        if (errs.length) return;
        const res = R.apply(prog, { ...st });
        if (st.replace && res.report.replaced) {
          const ok = await confirm({ title: 'Overwrite weeks?', text: `${res.report.replaced} existing ${res.report.replaced === 1 ? 'week' : 'weeks'} after ${M.weekLabel(prog, st.from)} will be replaced${res.report.keptEdits ? ` (${res.report.keptEdits} manual edits kept)` : ''}.`, ok: 'Overwrite' });
          if (!ok) return;
        }
        close(res);
      }
    });
    draw();
  });

  // ---------------------------------------------------------------- share
  Paul.downloadFile = (p) => {
    const errs = M.validate(p);
    if (errs.length) { toast(`Fix first: ${errs[0]}`, { kind: 'error', ms: 5000 }); return false; }
    const f = P.share.toFile(p);
    download(f.name, f.text, 'application/json');
    toast(`Downloaded ${f.name}`, { kind: 'ok' });
    return true;
  };

  Paul.shareDialog = (p, app) => sheet({ title: 'Share program', wide: true }, async (body, close) => {
    const errs = M.validate(p);
    if (errs.length) {
      body.innerHTML = String(html`<div class="notice notice-danger"><p style="margin:0 0 6px"><b>Fix these before sharing:</b></p><ul class="tight">${errs.slice(0, 8).map((e) => html`<li>${e}</li>`)}</ul></div>`);
      return;
    }
    body.innerHTML = '<p>Preparing link…</p>';
    const link = await P.share.makeLink(p);
    const lvl = { ok: ['chip-ok', 'Short link: works everywhere'], warn: ['chip-warn', 'Long link: fine in browsers and most apps'], long: ['chip-danger', 'Very long link: some apps will cut it. Send the file instead.'] }[link.level];
    const own = P.data.customFor(p);
    body.innerHTML = String(html`
      <p class="small">Sharing creates a <b>snapshot</b>. If you edit the program later, send a new link or file; old ones keep showing the old version.</p>
      <h3>Link</h3>
      <div class="link-box"><input type="text" readonly value="${link.url}" aria-label="Share link" data-link><button class="btn btn-sm" data-copy>${raw(I.copy)} Copy</button></div>
      <p class="small" style="margin:6px 0 0"><span class="chip ${lvl[0]}">${link.length.toLocaleString()} characters</span> ${lvl[1]}</p>
      ${own.length ? html`<p class="small" data-own-ex>Includes your own ${own.length === 1 ? 'exercise' : 'exercises'}: <b>${own.map((e) => e.name).join(', ')}</b>, with ${own.length === 1 ? 'its' : 'their'} lesson.</p>` : ''}
      ${link.photosLeftOut ? html`<p class="notice small" data-photos-left-out><b>The lesson photos don't fit in a link.</b> The link has the text only. Send the file to include the photos.</p>` : ''}
      ${navigator.share ? html`<button class="btn btn-ghost" data-native style="margin-top:10px">${raw(I.share)} Send via…</button>` : ''}
      <h3 style="margin-top:18px">File</h3>
      <p class="small muted" style="margin-top:0">A <b>.paulino</b> file has the whole program${own.length ? ', your exercises and their photos' : ''}. The athlete opens Paulino and taps <i>Import</i>.</p>
      <button class="btn" data-file>${raw(I.file)} Download .paulino file</button>
      <h3 style="margin-top:18px">Print / PDF</h3>
      <button class="btn btn-ghost" data-print>${raw(I.print)} Printable version</button>
      <h3 style="margin-top:18px">Try it</h3>
      <button class="btn btn-ghost" data-try>Open as athlete on this device</button>`);
    body.querySelector('[data-link]').onfocus = (e) => e.target.select();
    body.querySelector('[data-copy]').onclick = async () => toast((await copy(link.url)) ? 'Link copied!' : 'Copy failed: select the text and copy it.', { kind: 'ok' });
    body.querySelector('[data-native]')?.addEventListener('click', async () => { try { await navigator.share({ title: p.name, text: `${p.name}: your program from Paul`, url: link.url }); } catch { /* cancelled */ } });
    body.querySelector('[data-file]').onclick = () => Paul.downloadFile(p);
    body.querySelector('[data-print]').onclick = () => { close(); app.navigate(`/paul/p/${p.id}/print`); };
    body.querySelector('[data-try]').onclick = () => { close(); location.hash = `#program=${link.url.split('#program=')[1]}`; };
  });

  // ---------------------------------------------------------------- print
  Paul.printView = (root, app, prog, back) => {
    const week = (w, wi) => html`<section class="print-week"><h2>${M.weekLabel(prog, wi)} <span class="muted small">${M.weekDates(prog, wi)}${w.gen?.deload ? ' · deload' : ''}</span></h2>
      ${w.days.map((d) => html`<div class="print-day"><h3>${d.name} <span class="muted small">${fmtDate(M.dayDate(prog, wi, d))}</span></h3>
        ${d.notes ? html`<p class="small">${d.notes}</p>` : ''}
        <table class="print-table"><thead><tr><th>Exercise</th><th>Planned</th><th>Rest</th><th>Notes</th><th class="tick">Done</th></tr></thead>
        <tbody>${d.exercises.map((e) => html`<tr><td><b>${exName(e.exerciseId)}</b></td><td>${M.summarize(e.sets)}${e.tempo ? ` · tempo ${e.tempo}` : ''}</td><td>${restText(e.rest)}</td><td>${e.notes}</td><td class="tick">☐</td></tr>`)}</tbody></table></div>`)}
      ${w.days.length ? '' : html`<p class="muted">No training days.</p>`}</section>`;
    root.innerHTML = String(html`<div class="page no-nav print-page">
      <div class="print-toolbar no-print">${UI.topBar({ title: 'Printable version', back })}
        <p class="small muted">Use <b>Print</b>, then choose <b>Save as PDF</b> to make a PDF.</p>
        <button class="btn btn-lg btn-block" data-print-now>${raw(I.print)} Print / Save as PDF</button></div>
      <article class="print-doc">
        <header class="print-header"><div>${UI.logo()}</div><div class="grow"><h1>${prog.name}</h1>
          <p>${prog.athlete ? html`<b>${prog.athlete}</b> · ` : ''}${P.util.plural(prog.weeks.length, 'week')} · from ${fmtDate(prog.startDate, { year: true })}</p></div>
          <div class="print-face" aria-hidden="true">${raw(P.art.paulino('motivated', { size: 'sm' }))}</div></header>
        ${prog.notes ? html`<p class="print-notes">${prog.notes}</p>` : ''}
        ${prog.weeks.map(week)}
        <footer class="print-foot small">Made with Paulino · ${P.data.SAFETY.disclaimer}</footer>
      </article></div>`);
    root.querySelector('[data-print-now]').onclick = () => window.print();
  };


  // ---------------------------------------------------------------- Paul's exercises
  const usedIn = async (exId) => (await S.all('paul')).filter((p) => p.weeks.some((w) => w.days.some((d) => d.exercises.some((e) => e.exerciseId === exId))));
  const blankStep = () => ({ id: uid('s').slice(0, 10), title: '', body: '', photos: [], cue: '', warning: '' });

  Paul.exercises = async (root) => {
    const mine = P.data.customExercises().sort((a, b) => a.name.localeCompare(b.name));
    const builtIn = EXERCISES.filter((e) => !e.custom);
    const photos = (e) => e.steps.reduce((a, st) => a + st.photos.length, 0);
    root.innerHTML = String(html`<div class="page stack">
      ${UI.topBar({ title: 'Exercises' })}
      <a class="btn btn-lg btn-block" href="#/paul/exercises/new">${raw(I.plus)} Add an exercise</a>
      <section><h2>Your exercises</h2>
        ${mine.length ? html`<div class="stack-sm">${mine.map((e) => html`<a class="card list-card plain" href="#/paul/exercises/${e.id}" data-custom-ex="${e.id}">
          <span class="grow"><h3>${e.name}</h3><p class="small">${CATEGORIES[e.category]} · ${P.util.plural(e.steps.length, 'step')} · ${P.util.plural(photos(e), 'photo')}</p></span>
          <span class="chip">Edit</span></a>`)}</div>`
        : html`<p class="muted">None yet. Add one: it shows up in the program editor and gets its own Academy lesson.</p>`}
      </section>
      <section><h2>Built in</h2>
        <ul class="plain-list">${builtIn.map((e) => html`<li class="row-between"><span>${e.name}</span>${P.academy.forExercise(e.id) ? html`<a class="small" href="#/academy/${P.academy.forExercise(e.id).id}">Lesson</a>` : html`<span class="small muted">no lesson</span>`}</li>`)}</ul>
      </section>
    </div>`);
  };

  Paul.exerciseEditor = async (root, app, params) => {
    const isNew = params.id === 'new';
    const stored = isNew ? null : (await S.get('exercises', params.id)) || P.data.exById(params.id);
    if (!isNew && !stored?.custom) { app.navigate('/paul/exercises', { replace: true }); return; }
    const ex = isNew ? { id: uid('cx_'), name: '', category: 'other', description: '', instructions: '', notes: '', steps: [blankStep(), blankStep(), blankStep()] } : clone(stored);
    let dirty = false;
    const mark = () => { dirty = true; const s = root.querySelector('[data-ex-state]'); if (s) { s.textContent = 'Not saved yet'; s.classList.add('dirty'); } };
    app.setGuard(() => (dirty ? 'Your changes to this exercise are not saved.' : null));

    const stepCard = (st, i) => html`<div class="card step-ed" data-si="${i}">
      <div class="row-between"><h3 style="margin:0">Step ${i + 1}</h3>
        <span class="tools"><button class="icon-btn sq" data-move="-1" data-i="${i}" aria-label="Move step ${i + 1} up" ${i === 0 ? raw('disabled') : ''}>${raw(I.up)}</button><button class="icon-btn sq" data-move="1" data-i="${i}" aria-label="Move step ${i + 1} down" ${i === ex.steps.length - 1 ? raw('disabled') : ''}>${raw(I.down)}</button><button class="icon-btn sq" data-delstep="${i}" aria-label="Delete step ${i + 1}">${raw(I.trash)}</button></span></div>
      <div class="field"><label for="st-t-${i}">Step title</label><input id="st-t-${i}" type="text" maxlength="80" value="${st.title}" data-sf="title" data-i="${i}" placeholder="e.g. Grip the bar"></div>
      <div class="field"><label for="st-b-${i}">What to do</label><textarea id="st-b-${i}" rows="3" maxlength="1500" data-sf="body" data-i="${i}">${st.body}</textarea></div>
      <div class="field"><span class="label">Photos</span>
        <div class="photo-edit">${st.photos.length ? st.photos.map((src, k) => html`<figure class="ph-thumb"><img src="${src}" alt="Step ${i + 1}, photo ${k + 1}">
            <div class="btn-row"><button class="btn btn-sm btn-ghost" data-replace="${k}" data-i="${i}">Replace</button><button class="btn btn-sm btn-ghost" data-rmphoto="${k}" data-i="${i}" aria-label="Remove photo ${k + 1} of step ${i + 1}">Remove</button></div></figure>`)
          : html`<div class="ph-empty">No photo yet. Without one, athletes only see the text for this step.</div>`}</div>
        ${st.photos.length < 4 ? html`<button class="btn btn-ghost" data-addphoto="${i}">${raw(I.plus)} Add a photo for this step</button>` : ''}</div>
      <div class="field"><label for="st-c-${i}">Paulino's cue (optional)</label><input id="st-c-${i}" type="text" maxlength="120" value="${st.cue}" data-sf="cue" data-i="${i}" placeholder="e.g. Push the floor away!"></div>
      <div class="field"><label for="st-w-${i}">Watch out for (optional)</label><input id="st-w-${i}" type="text" maxlength="300" value="${st.warning}" data-sf="warning" data-i="${i}" placeholder="a common mistake"></div>
    </div>`;

    const draw = () => {
      const y = scrollY;
      root.innerHTML = String(html`<div class="page stack ex-editor">
        ${UI.topBar({ title: isNew ? 'New exercise' : ex.name || 'Exercise', back: '/paul/exercises', right: `<span class="save-state${dirty ? ' dirty' : ''}" data-ex-state>${dirty ? 'Not saved yet' : isNew ? 'New' : 'Saved'}</span>` })}
        <div class="card">
          <div class="field"><label for="ex-name">Exercise name</label><input id="ex-name" type="text" maxlength="60" value="${ex.name}" data-f="name" placeholder="e.g. Romanian deadlift"></div>
          <div class="field"><label for="ex-cat">Category (optional)</label><select id="ex-cat" data-f="category">${Object.entries(CATEGORIES).map(([k, l]) => html`<option value="${k}" ${k === ex.category ? raw('selected') : ''}>${l}</option>`)}</select></div>
          <div class="field"><label for="ex-desc">Short description</label><input id="ex-desc" type="text" maxlength="400" value="${ex.description}" data-f="description" placeholder="One sentence: what is it?"></div>
          <div class="field"><label for="ex-ins">How to do it</label><textarea id="ex-ins" rows="4" maxlength="3000" data-f="instructions">${ex.instructions}</textarea></div>
          <div class="field"><label for="ex-notes">Coaching notes (optional)</label><textarea id="ex-notes" rows="2" maxlength="1500" data-f="notes">${ex.notes}</textarea></div>
        </div>
        <div class="row-between"><h2 style="margin:0">Exercise steps</h2>
          <label class="inline-label">Number of steps <input type="number" min="1" max="20" inputmode="numeric" value="${ex.steps.length}" data-count style="width:4.5em"></label></div>
        ${ex.steps.map(stepCard)}
        <button class="btn btn-block btn-ghost" data-addstep ${ex.steps.length >= 20 ? raw('disabled') : ''}>${raw(I.plus)} Add a step</button>
        <div class="btn-row form-actions"><button class="btn btn-lg" data-save-ex>Save exercise</button><button class="btn btn-ghost" data-preview>Preview lesson</button></div>
        ${isNew ? '' : html`<p><button class="link-btn choice-danger" data-del-ex>Delete this exercise</button></p>`}
      </div>`);
      window.scrollTo(0, y);
    };
    draw();

    const offs = [];
    offs.push(on(root, 'input', '[data-f]', (e, el) => { ex[el.dataset.f] = el.value; mark(); }));
    offs.push(on(root, 'change', 'select[data-f]', (e, el) => { ex[el.dataset.f] = el.value; mark(); }));
    offs.push(on(root, 'input', '[data-sf]', (e, el) => { ex.steps[Number(el.dataset.i)][el.dataset.sf] = el.value; mark(); }));
    const hasContent = (st) => st.title || st.body || st.photos.length || st.cue || st.warning;
    offs.push(on(root, 'change', '[data-count]', async (e, el) => {
      const n = Math.max(1, Math.min(20, Math.round(Number(el.value)) || 1));
      if (n === ex.steps.length) return;
      if (n < ex.steps.length) {
        const cut = ex.steps.slice(n);
        if (cut.some(hasContent) && !(await confirm({ title: 'Remove steps?', text: `Steps ${n + 1}–${ex.steps.length} will be deleted, with their text and photos.`, ok: 'Remove', danger: true }))) { el.value = ex.steps.length; return; }
        ex.steps = ex.steps.slice(0, n);
      } else while (ex.steps.length < n) ex.steps.push(blankStep());
      mark(); setTimeout(draw);   // not inside the blur that fired "change"
    }));
    offs.push(on(root, 'click', '[data-addstep]', () => { if (ex.steps.length < 20) { ex.steps.push(blankStep()); mark(); draw(); root.querySelector(`#st-t-${ex.steps.length - 1}`)?.focus(); } }));
    offs.push(on(root, 'click', '[data-delstep]', async (e, b) => {
      const i = Number(b.dataset.delstep);
      if (ex.steps.length <= 1) { toast('An exercise needs at least one step.'); return; }
      if (hasContent(ex.steps[i]) && !(await confirm({ title: `Delete step ${i + 1}?`, text: 'Its text and photos will be removed.', ok: 'Delete', danger: true }))) return;
      ex.steps.splice(i, 1); mark(); draw();
    }));
    offs.push(on(root, 'click', '[data-move]', (e, b) => {
      const i = Number(b.dataset.i), j = i + Number(b.dataset.move);
      if (j < 0 || j >= ex.steps.length) return;
      [ex.steps[i], ex.steps[j]] = [ex.steps[j], ex.steps[i]]; mark(); draw();
    }));
    const addPhoto = async (i, k = null) => {
      const src = await P.util.pickImage();
      if (!src) return;
      if (k === null) ex.steps[i].photos.push(src); else ex.steps[i].photos[k] = src;
      mark(); draw();
    };
    offs.push(on(root, 'click', '[data-addphoto]', (e, b) => addPhoto(Number(b.dataset.addphoto))));
    offs.push(on(root, 'click', '[data-replace]', (e, b) => addPhoto(Number(b.dataset.i), Number(b.dataset.replace))));
    offs.push(on(root, 'click', '[data-rmphoto]', (e, b) => { ex.steps[Number(b.dataset.i)].photos.splice(Number(b.dataset.rmphoto), 1); mark(); draw(); }));
    offs.push(on(root, 'click', '[data-preview]', () => P.academy.preview(ex)));
    offs.push(on(root, 'click', '[data-save-ex]', async () => {
      if (!ex.name.trim()) { toast('Give the exercise a name.', { kind: 'error' }); root.querySelector('#ex-name').focus(); return; }
      const clash = EXERCISES.find((x) => x.id !== ex.id && x.name.toLowerCase() === ex.name.trim().toLowerCase());
      if (clash) { toast(`"${clash.name}" already exists.`, { kind: 'error' }); return; }
      const d = P.data.normalizeExercise({ ...ex, updatedAt: new Date().toISOString() });
      try { await S.put('exercises', d); } catch { toast("Couldn't save: this browser's storage may be full. Try smaller photos.", { kind: 'error', ms: 6000 }); return; }
      P.data.registerCustom([d]);
      dirty = false;
      toast('Exercise saved. It is in the program editor and the Academy.', { kind: 'ok' });
      if (isNew) app.navigate(`/paul/exercises/${d.id}`, { replace: true }); else { Object.assign(ex, clone(d)); draw(); }
    }));
    offs.push(on(root, 'click', '[data-del-ex]', async () => {
      const progs = await usedIn(ex.id);
      if (progs.length) { toast(`Used in ${progs.map((p) => p.name).join(', ')}. Take it out of ${progs.length === 1 ? 'that program' : 'those programs'} first.`, { kind: 'error', ms: 7000 }); return; }
      if (!(await confirm({ title: `Delete ${ex.name || 'this exercise'}?`, text: 'Its lesson disappears from the Academy on this device. Athletes who already received it keep their copy.', ok: 'Delete', danger: true }))) return;
      await S.del('exercises', ex.id);
      P.data.unregisterCustom(ex.id);
      dirty = false;
      toast('Exercise deleted.');
      app.navigate('/paul/exercises', { replace: true });
    }));
    return () => offs.forEach((f) => f());
  };

  P.paul = Paul;
})(window.Paulino);
</script>
<script>
/* ===== 11. athlete: import, program, workout, results, history ============== */
(function (P) {
  const { html, raw, esc, on, toast, sheet, confirm, fmtKg, fmtDate, relDay, num, clone, isoDate, download, pickFile, WEEKDAYS_LONG } = P.util;
  const M = P.model, S = P.store, UI = P.ui, St = P.stats;
  const { EXERCISES, CATEGORIES, exName, cuesFor, SAFETY } = P.data;
  const I = UI.ICONS;
  const A = {};

  const logKey = (pid, did) => `${pid}|${did}`;
  const modKey = (pid, eid) => `${pid}|${eid}`;
  A.current = async () => {
    const list = await S.all('athlete');
    if (!list.length) return null;
    const id = S.pref.get('athlete.current');
    return list.find((p) => p.id === id) || list.sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)))[0];
  };
  const setCurrent = (id) => S.pref.set('athlete.current', id);
  const allLogs = () => S.all('logs');

  /*
   * Athlete modification (store "mods"), kept apart from Paul's prescription:
   * { key, programId, dayId, exId, type, reason, original: {exerciseId, sets}, modified: {exerciseId, sets, removed},
   *   status: 'active'|'reverted', createdAt, updatedAt }
   */
  const modsFor = async (pid) => Object.fromEntries((await S.byProgram('mods', pid)).filter((m) => m.status === 'active').map((m) => [m.exId, m]));
  A.effective = (day, mods) => day.exercises.map((ex) => {
    const m = mods[ex.id];
    return m ? { ...ex, exerciseId: m.modified.removed ? ex.exerciseId : m.modified.exerciseId, sets: m.modified.removed ? ex.sets : m.modified.sets, removed: Boolean(m.modified.removed), mod: m, original: ex }
      : { ...ex, removed: false, mod: null, original: ex };
  });

  // ------------------------------------------------------------- import link / file
  A.receive = async (program, root, app, source) => {
    const existing = await S.get('athlete', program.id);
    const draw = (inner) => { root.innerHTML = String(html`<div class="page no-nav stack">${UI.topBar({ title: 'Program from Paul' })}${inner}</div>`); };
    const days = M.allDays(program);
    const summary = html`<div class="card tape"><h2>${program.name}</h2>
      <p>${program.athlete ? html`For <b>${program.athlete}</b> · ` : ''}${program.weeks.length} ${program.weeks.length === 1 ? 'week' : 'weeks'} · ${days.length} ${days.length === 1 ? 'workout' : 'workouts'} · starts ${fmtDate(program.startDate, { year: true })}</p>
      ${program.notes ? html`<p class="paul-note">${program.notes}</p>` : ''}</div>`;
    const save = async (keepProgress = true) => {
      await A.keepExercises(program);
      await S.put('athlete', { ...program, savedAt: new Date().toISOString(), source });
      if (!keepProgress) await S.delProgramData(program.id);
      setCurrent(program.id);
      app.navigate('/a', { replace: true });
      UI.react('motivated', "Program saved. Let's go!");
    };
    if (existing && existing.revision === program.revision) {
      setCurrent(program.id);
      draw(html`${summary}<div class="card">${UI.mascot({ mood: 'happy', text: 'You already have this one!', size: 'sm' })}<p style="margin-top:10px">This exact program is already saved on this device, with your progress.</p><a class="btn btn-block" href="#/a/p/${program.id}" data-replace>Open it</a></div>`);
      return;
    }
    if (existing) {
      draw(html`${summary}<div class="card">${UI.mascot({ mood: 'focused', text: 'Paul updated your program!', size: 'sm' })}
        <p style="margin-top:10px">You already have an older version of <b>${existing.name}</b>. Update it? Workouts you've logged stay where they match.</p>
        <div class="stack-sm"><button class="btn btn-block btn-lg" data-update>Update to the new version</button><button class="btn btn-block btn-ghost" data-keep>Keep my current version</button></div></div>`);
      root.querySelector('[data-update]').onclick = () => save(true);
      root.querySelector('[data-keep]').onclick = () => { setCurrent(existing.id); app.navigate('/a', { replace: true }); };
      return;
    }
    draw(html`${summary}<div class="card">${UI.mascot({ mood: 'motivated', text: 'A fresh program! Ready?', size: 'sm' })}
      <p style="margin-top:10px">Save it on this device to follow it and log your training. Nothing is sent to anyone.</p>
      <button class="btn btn-block btn-lg" data-save>Save & start training</button></div>
      <p class="center small"><button class="link-btn" data-paul>Coach? Copy it into Paul's programs instead</button></p>`);
    root.querySelector('[data-save]').onclick = () => save(true);
    root.querySelector('[data-paul]').onclick = async () => {
      await A.keepExercises(program);
      const c = M.reId(program, 'program');
      await S.put('paul', c);
      app.navigate(`/paul/p/${c.id}`, { replace: true });
    };
  };

  /** Store the custom exercises a received program brings along (never overwriting Paul's own originals). */
  A.keepExercises = async (program) => {
    for (const d of program.custom || []) {
      const mine = await S.get('exercises', d.id);
      if (mine && mine.origin !== 'shared') continue;
      const n = P.data.normalizeExercise(d);
      if (!n) continue;
      if (mine && mine.updatedAt > n.updatedAt) continue;
      // a link without photos must not wipe photos a file delivered earlier
      if (mine) n.steps.forEach((st) => { const old = mine.steps.find((o) => o.id === st.id); if (!st.photos.length && old?.photos.length) st.photos = old.photos; });
      await S.put('exercises', { ...n, origin: 'shared' });
      P.data.registerCustom([n]);
    }
  };

  A.importFile = async (app) => {
    const f = await pickFile();
    if (!f) return;
    try {
      const prog = P.share.fromFile(f.text);
      app.pendingImport = { program: prog, source: 'file' };
      app.navigate('/a/import');
    } catch (e) { toast(e.message, { kind: 'error', ms: 6000 }); }
  };

  A.badLink = (root, message) => {
    root.innerHTML = String(html`<div class="page no-nav stack">${UI.topBar({ title: "Link didn't open" })}
      <div class="card">${UI.mascot({ mood: 'concerned', text: 'Hmm, this link is broken.', size: 'sm' })}<p style="margin-top:10px">${message}</p>
      <a class="btn" href="#/">Go to start</a></div></div>`);
  };

  // ------------------------------------------------------------- home
  A.home = async (root, app) => {
    const prog = await A.current();
    const logs = await allLogs();
    const hero = html`<div class="home-top"><a class="btn btn-sm btn-ghost" href="#/settings">Settings</a></div>
      <section class="home-hero-wrap" aria-label="Paulino"><h1 class="home-title">PAULINO<span>!</span></h1>
        <div class="home-hero">${UI.mascot({ mood: 'motivated', context: 'home', size: 'cover', layout: 'cover' })}</div></section>`;
    if (!prog) {
      root.innerHTML = String(html`<div class="page stack athlete-home">${hero}
        <p class="home-tag">Your coach's programs, and his voice in your head.</p>
        <div class="card"><h2>Get your program</h2><p><b>Got a link from Paul?</b> Open it: the program loads by itself.</p>
          <p><b>Got a .paulino file?</b> Import it here.</p><button class="btn btn-block btn-lg" data-import>${raw(I.file)} Import a .paulino file</button></div>
        <a class="card door-card plain" href="#/academy"><h2>Lifting Academy</h2><p>Learn the lifts step by step. No program needed.</p></a>
      </div>`);
      root.querySelector('[data-import]').onclick = () => A.importFile(app);
      return;
    }
    const today = isoDate();
    const next = St.next(prog, logs, today);
    const pr = St.progress(prog, logs);
    const cw = St.currentWeek(prog, today);
    const { events } = St.records(logs);
    const mods = await modsFor(prog.id);
    let nextCard = html`<div class="card card-accent"><h2>Program complete!</h2><p>Every session is done. Time to ask Paul for the next one.</p></div>`;
    if (next) {
      const items = A.effective(next.day, mods).filter((x) => !x.removed);
      nextCard = html`<div class="card tape" data-next>
        <div class="row-between"><span class="chip chip-ink">${next.inProgress ? 'In progress' : 'Next workout'}</span><span class="chip">${next.date ? relDay(next.date, today) : ''}</span></div>
        <h2 style="margin-top:12px">${next.day.name}</h2>
        <p class="muted small">${M.weekLabel(prog, next.wi)} · ${fmtDate(next.date)}</p>
        <ul class="plain-list">${items.map((x) => html`<li class="row-between"><b>${exName(x.exerciseId)}</b><span class="mono small">${M.summarize(x.sets)}</span></li>`)}</ul>
        <a class="btn btn-block btn-lg" href="#/a/p/${prog.id}/d/${next.day.id}">${next.inProgress ? 'Continue workout' : "Let's train"}</a></div>`;
    }
    root.innerHTML = String(html`<div class="page stack athlete-home">
      ${hero}
      <h2 class="home-hi">Hey <span class="hero-name">${prog.athlete || 'champ'}</span>! <span class="muted small">${prog.name} · ${M.weekLabel(prog, cw)} of ${prog.weeks.length}</span></h2>
      ${next && next.date > today && !next.inProgress ? html`<div class="card">${UI.mascot({ mood: 'happy', context: 'rest_day', size: 'sm' })}</div>` : ''}
      ${nextCard}
      <div class="card"><div class="row-between"><b>Program progress</b><span class="mono">${pr.handled}/${pr.total} workouts</span></div>
        <div class="progress" style="margin-top:8px" role="progressbar" aria-label="Program progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pr.pct}"><span style="width:${pr.pct}%"></span></div>
        <div class="stats" style="margin-top:14px">
          <div class="stat"><div class="stat-label">${raw(I.check)} Done</div><div class="stat-value">${pr.done}</div></div>
          <div class="stat"><div class="stat-label">${raw(I.trophy)} PRs</div><div class="stat-value">${events.length}</div></div>
        </div></div>
      <p class="center"><a href="#/a/program">See the whole program →</a> · <a href="#/a/library">Saved programs</a></p>
      ${S.mode !== 'indexeddb' ? html`<p class="notice small">${S.mode === 'memory' ? "This browser isn't letting Paulino store data: your progress disappears when you close the tab." : 'Saved in this browser.'} Export a backup in Programs.</p>` : ''}
    </div>`);
  };

  // ------------------------------------------------------------- program overview
  A.program = async (root, app, params) => {
    const prog = params.id ? await S.get('athlete', params.id) : await A.current();
    if (!prog) { app.navigate('/a', { replace: true }); return; }
    const logs = (await allLogs()).filter((l) => l.programId === prog.id);
    const byDay = new Map(logs.map((l) => [l.dayId, l]));
    const mods = await modsFor(prog.id);
    const today = isoDate();
    const cw = St.currentWeek(prog, today);
    const STATUS = { done: ['status-done', raw(I.check), 'Done'], skipped: ['status-skipped', '', 'Skipped'], in_progress: ['status-progress', '…', 'In progress'] };
    root.innerHTML = String(html`<div class="page">
      ${UI.topBar({ title: prog.name, sub: `${prog.athlete ? `${prog.athlete} · ` : ''}${P.util.plural(prog.weeks.length, 'week')}`, right: `<a class="btn btn-sm btn-ghost" href="#/a/p/${prog.id}/print">${I.print}<span class="sr-only">Print</span></a>` })}
      ${prog.notes ? html`<details class="card" style="margin-bottom:16px"><summary class="summary-h"><b>Paul's instructions</b></summary><p class="paul-note" style="margin-top:10px">${prog.notes}</p></details>` : ''}
      ${prog.weeks.map((w, wi) => {
        const done = w.days.filter((d) => ['done', 'skipped'].includes(byDay.get(d.id)?.status)).length;
        const pct = w.days.length ? Math.round((done / w.days.length) * 100) : 0;
        return html`<details class="block" ${wi === cw ? raw('open') : ''} data-week="${wi}">
          <summary><div class="block-head"><h3>${M.weekLabel(prog, wi)}</h3>${wi === cw ? html`<span class="chip chip-accent">Now</span>` : ''}${w.gen?.deload ? html`<span class="chip chip-warn">Deload</span>` : ''}<span class="chev" aria-hidden="true">${raw(I.down)}</span></div>
            <div class="row-between small"><span class="muted">${M.weekDates(prog, wi)}</span><span class="mono">${done}/${w.days.length}</span></div>
            <div class="progress progress-sm" role="progressbar" aria-label="${M.weekLabel(prog, wi)} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div></summary>
          <ul class="workout-list">${w.days.map((d) => {
            const date = M.dayDate(prog, wi, d);
            const st = STATUS[byDay.get(d.id)?.status];
            const items = A.effective(d, mods).filter((x) => !x.removed);
            const changed = items.some((x) => x.mod) || A.effective(d, mods).some((x) => x.removed);
            return html`<li><a class="workout-row" href="#/a/p/${prog.id}/d/${d.id}" data-day="${d.id}">
              <span class="wdate ${date === today ? 'today' : ''}"><b>${date ? Number(date.slice(8)) : '·'}</b><span>${P.util.WEEKDAYS[d.weekday]}</span></span>
              <span class="wbody"><h4>${d.name}</h4><p>${items.map((x) => `${exName(x.exerciseId)} ${M.gridOf(x).sets}×${M.gridOf(x).reps ?? '…'}`).join(' · ') || 'Rest'}</p>
                ${changed ? html`<span class="chip chip-dev">You changed this</span>` : ''}</span>
              <span class="status-dot ${st ? st[0] : ''}" aria-label="${st ? st[2] : date && date < today ? 'Not logged' : 'Upcoming'}" title="${st ? st[2] : ''}">${st ? st[1] : ''}</span></a></li>`;
          })}${w.days.length ? '' : html`<li class="muted small" style="padding:12px 16px">Rest week</li>`}</ul></details>`;
      })}
    </div>`);
  };

  // ------------------------------------------------------------- workout (view + log)
  A.workout = async (root, app, params) => {
    const prog = await S.get('athlete', params.id);
    const found = prog && M.findDay(prog, params.dayId);
    if (!found) { root.innerHTML = String(html`<div class="page no-nav">${UI.topBar({ title: 'Workout', back: '/a/program' })}<div class="card"><p>This workout isn't in your program.</p></div></div>`); return; }
    setCurrent(prog.id);
    const { day, wi, date } = found;
    const key = logKey(prog.id, day.id);
    let log = await S.get('logs', key);
    let mods = await modsFor(prog.id);
    let items = A.effective(day, mods);
    let timer = null;
    let saveT = null;

    const buildEntries = (prevEntries = []) => items.filter((x) => !x.removed).map((x) => {
      const prev = prevEntries.find((e) => e.exId === x.id && e.exerciseId === x.exerciseId);
      return {
        exId: x.id, exerciseId: x.exerciseId, target: clone(x.sets),
        sets: x.sets.map((s, i) => prev?.sets[i] ? { ...prev.sets[i] } : { reps: s.reps, kg: s.kg ?? 0, done: false, rpe: null, note: '' }),
      };
    });
    const ensureLog = () => {
      if (log && log.status !== 'skipped') return log;
      log = { key, programId: prog.id, dayId: day.id, weekIndex: wi, plannedDate: date, status: 'in_progress', skipReason: null, pain: false, notes: '', startedAt: new Date().toISOString(), completedAt: null, entries: buildEntries(log?.entries) };
      persist(true);
      return log;
    };
    const persist = (now = false) => {
      log.updatedAt = new Date().toISOString();
      clearTimeout(saveT);
      const go = () => S.put('logs', log).catch(() => {});
      if (now) go(); else saveT = setTimeout(go, 250);
    };
    const entryFor = (x) => log?.entries.find((e) => e.exId === x.id) || null;

    function setRow(x, s, i, entry) {
      const a = entry?.sets[i] || { reps: s.reps, kg: s.kg ?? 0, done: false };
      const heavy = s.kg !== null && s.kg !== undefined && Number(a.kg) > Number(s.kg) + 0.001;
      return html`<div class="set-row ${a.done ? 'done' : ''}" data-set="${x.id}:${i}">
        <span class="set-n">${i + 1}</span>
        <input type="number" inputmode="numeric" min="0" max="200" value="${a.reps ?? ''}" data-f="reps" aria-label="${exName(x.exerciseId)} set ${i + 1} reps done">
        <input type="number" inputmode="decimal" min="0" max="1000" step="0.5" value="${a.kg ?? ''}" data-f="kg" aria-label="${exName(x.exerciseId)} set ${i + 1} kg${s.bw ? ' added' : ''}">
        <button type="button" class="done-btn" data-done aria-pressed="${Boolean(a.done)}" aria-label="Mark ${exName(x.exerciseId)} set ${i + 1} ${a.done ? 'not done' : 'done'}">${raw(I.check)}</button>
        <span class="target">Paul: ${s.reps} × ${M.loadText(s)}${s.rpe ? ` @ RPE ${s.rpe}` : ''}</span>
        ${heavy ? html`<span class="inline-warn" data-heavy>Heavier than Paul's plan. No ego lifting, champ.</span>` : ''}
      </div>`;
    }

    function exCard(x, n) {
      const tip = UI.pick(`cue.${x.exerciseId}`, cuesFor(x.exerciseId, x.notes));
      const entry = entryFor(x);
      const g = M.gridOf(x);
      return html`<article class="card ex-card ${x.mod ? 'deviated' : ''} ${x.removed ? 'removed' : ''}" data-item="${x.id}">
        <span class="ex-num">${n}</span>
        <div class="ex-head"><h3>${exName(x.exerciseId)}</h3>${x.mod ? html`<span class="chip chip-dev">${x.removed ? 'Removed by you' : 'Changed by you'}</span>` : ''}</div>
        ${x.removed ? html`<p class="orig">${M.summarize(x.original.sets)}</p>` : html`<p class="ex-presc">${M.summarize(x.sets)}</p>`}
        ${x.mod && !x.removed ? html`<p class="small" style="margin:0">Paul's plan: <span class="orig">${exName(x.original.exerciseId)} ${M.summarize(x.original.sets)}</span></p>` : ''}
