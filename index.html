    {
      "id": "pull-up",
      "name": "Pull-up",
      "category": "accessory",
      "description": "Hang from a bar with an overhand grip and pull until your chin clears the bar. Bodyweight, or with added weight when Paul says so.",
      "tips": {
        "setup": [
          "Hands a bit wider than shoulders, full grip.",
          "Start from a dead hang with straight arms."
        ],
        "execution": [
          "Pull your elbows down towards your ribs.",
          "Chin over the bar, then lower all the way under control."
        ],
        "mistakes": [
          "Kipping or swinging for momentum.",
          "Half reps that never reach straight arms."
        ],
        "bracing": [
          "Squeeze glutes and abs so your legs stay still."
        ],
        "safety": [
          "Step down instead of dropping from the bar."
        ]
      }
    }
  ];
  const GENERAL_TIPS = [
    {
      "source": "paul",
      "text": "Warm up first: empty bar for 10, then a couple of lighter sets. No rest between warm-ups."
    },
    {
      "source": "paul",
      "text": "Perfect form first. Finish each set feeling you had one or two reps left."
    },
    {
      "source": "paul",
      "text": "We never train to failure. That is where injuries happen."
    },
    {
      "source": "paul",
      "text": "Rest 1:30 to 3:00 between sets, depending on how you feel."
    },
    {
      "source": "paul",
      "text": "Muscle soreness up to about 2–3/10 is usually fine. Sharp pain means stop."
    },
    {
      "source": "paul",
      "text": "Supersets work: bench + row, overhead press + deadlift."
    }
  ];
  const CATEGORIES = { squat: 'Squat', bench: 'Bench press', deadlift: 'Deadlift', accessory: 'Accessory', other: 'Other' };

  const STATES = ['motivated', 'focused', 'happy', 'celebrating', 'disappointed', 'concerned'];

  /*
   * Paulino's dialogue. A line is a string (weight 1) or { t, w, real }.
   *   real: true  → one of Paul's own catchphrases (supplied by Paul). These get a
   *                 high weight so they come up far more often than generic lines.
   *   other lines → written for the app in Paul's spirit; never presented as quotes.
   * Selection: weighted random, never the same line twice in a row (see ui.pick).
   */
  const R = (t, w = 5) => ({ t, w, real: true });
  const PAUL = {
    brace: R('BRACE! BRACE! BRACE!', 6),
    floor: R('Push the floor away!'),
    legday: R('Never skip leg day!'),
    goodBrace: R('A good brace is the most important!'),
    deeper: R('You can go deeper!'),
    protein: R('How many grams of protein did you have today?'),
  };
  const X = (t, w = 2) => ({ t, w });   // inspired by Paul, not a quote
  const LINES = {
    motivated: {
      home: [PAUL.brace, PAUL.floor, PAUL.legday, PAUL.goodBrace, PAUL.deeper, PAUL.protein],   // the home bubble only uses Paul's real lines
      athlete: [PAUL.brace, PAUL.legday, PAUL.protein, X('Did you eat your protein, champ?'), X('Today we lift. Tomorrow we brag.', 1)],
      rest_day: [PAUL.protein, X('Rest day! Muscles grow while you chill.', 1), X('Recovery is training too.', 1)],
      empty: [X('No program yet. Ask Paul for a link!'), X('Open the link or file Paul sent you.')],
      paul: [PAUL.brace, X('Who are we making stronger today?'), X('Build week 1. I do the boring part.'), PAUL.legday],
      workout: [PAUL.brace, PAUL.legday, PAUL.protein, X('Warm-up first: empty bar for 10!'), X('Perfect reps beat heavy reps.', 1)],
    },
    focused: {
      generic: [PAUL.goodBrace, PAUL.brace, X('DID YOU BRACE?!'), X('YOU CALL THAT A BRACE?!'), X('NO EGO LIFTING!'), X('Leave one or two reps in the tank.', 1)],
    },
    happy: {
      set: [X("THAT'S A PROPER REP!"), X('Clean rep!', 1)],
      restored: [X('PAUL WROTE THIS FOR A REASON!'), X('Thank you! Paul will be so proud.'), X('Back to the plan, champ!')],
      saved: [X('Saved! Paul, you legend.'), X('Program locked and loaded.')],
      academy: [PAUL.goodBrace, PAUL.deeper, PAUL.floor, X('Learn it with the empty bar first!')],
    },
    celebrating: {
      finish: [R('GOOD! NOW, HOW MANY GRAMS OF PROTEIN DID YOU HAVE TODAY?', 7), X("THAT'S MY ATHLETE!", 3), X("THAT'S A PROPER REP!"), PAUL.legday],
      pr: [X('NEW PR! NOW EAT YOUR PROTEIN!', 3), X('PERSONAL RECORD!'), X('The bar got lighter. Or you got stronger!', 1)],
    },
    disappointed: {
      sets: [X('WHAT?! YOU CHANGED MY PROGRAM?!', 5), X('PAUL WROTE THIS FOR A REASON!', 4), X('Fewer sets?! Paul is crying somewhere.', 1)],
      replace: [X('WHAT?! YOU CHANGED MY PROGRAM?!', 5), X('PAUL WROTE THIS FOR A REASON!', 4), X('A different exercise?! Paul picked that one!', 1)],
      deviate: [X('WHAT?! YOU CHANGED MY PROGRAM?!', 5), X('PAUL WROTE THIS FOR A REASON!', 4), X('NOOO! Paul spent hours planning this!', 1)],
      after: [X("I'm disappointed... but I still believe in you!"), X('Fine. But you still have to brace.'), X("OK... I'll be here, sulking.")],
    },
    concerned: {
      pain: ['Sharp pain? Stop that exercise now.', 'Your body comes first. Always.', 'No set is worth an injury.'],
      fatigue: ['Feeling run down? Smart to adjust.', 'Listen to your body today.', 'Easy days count. Truly.'],
      heavy: ["Heavier than Paul's plan. Is that wise?", 'NO EGO LIFTING!'],
      skip: ['Rest up and get well soon!', 'Skipping when sick is smart, not lazy.'],
      storage: ['Your data lives in this browser only. Back it up!'],
    },
  };

  /** Exercise-specific lines (workout tips and lessons), on top of the technique cues. */
  const EXERCISE_LINES = {
    squat: [PAUL.brace, PAUL.deeper, PAUL.floor, PAUL.legday],
    deadlift: [PAUL.floor, PAUL.goodBrace, X('KEEP IT CLOSE!')],
    'bench-press': [PAUL.goodBrace, X('CONTROL THAT BAR!'), X('DID YOU BRACE?!')],
    'overhead-press': [PAUL.goodBrace, X('Squeeze everything!'), X('DID YOU BRACE?!')],
    'barbell-row': [PAUL.goodBrace, X('Flat back, champ!')],
    'pull-up': [X('Chin over the bar!'), PAUL.protein],
  };

  const SAFETY = {
    painStop: 'If you feel strong or sharp pain, stop the exercise straight away and don’t do any more reps or sets of it. Rest for 48 hours and see how you feel.',
    painContact: 'Tell Paul what happened. If pain is severe, gets worse, or comes with swelling, numbness or tingling, get it checked by a doctor or physiotherapist.',
    soreness: 'General muscle soreness up to about 2–3 out of 10 is usually not a problem.',
    disclaimer: "Paulino's tips are general coaching cues. They don't replace Paul's feedback or a medical opinion.",
  };

  const exById = (id) => EXERCISES.find((e) => e.id === id) || null;
  const exName = (id) => exById(id)?.name || id;

  /*
   * Paul's own exercises ("custom"), stored in the "exercises" store and merged
   * into EXERCISES, so the program editor, workouts and the Academy treat them
   * like the built-in ones. Shape:
   *   { id: 'cx_…', custom: true, name, category, description, instructions, notes,
   *     steps: [{ id, title, body, photos: [data:image/…], cue, warning }], updatedAt }
   * Shared programs carry the definitions they use (program.custom), photos included
   * in .paulino files, so the athlete never depends on Paul's browser.
   */
  const CUSTOM_ID = /^cx_[a-z0-9]{4,24}$/;
  const PHOTO_RE = /^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+/=]+$/;
  const MAX_PHOTO = 900_000;
  const str = (v, n) => String(v ?? '').slice(0, n);
  function normalizeExercise(d) {
    if (!d || !CUSTOM_ID.test(String(d.id))) return null;
    const name = str(d.name, 60).trim();
    if (!name) return null;
    return {
      id: String(d.id), custom: true, name,
      category: CATEGORIES[d.category] ? d.category : 'other',
      description: str(d.description, 400), instructions: str(d.instructions, 3000), notes: str(d.notes, 1500),
      steps: (Array.isArray(d.steps) ? d.steps : []).slice(0, 20).map((st, i) => ({
        id: str(st?.id || `s${i + 1}`, 30), title: str(st?.title, 80), body: str(st?.body, 1500),
        photos: (Array.isArray(st?.photos) ? st.photos : []).filter((x) => typeof x === 'string' && x.length < MAX_PHOTO && PHOTO_RE.test(x)).slice(0, 4),
        cue: str(st?.cue, 120), warning: str(st?.warning, 300),
      })),
      updatedAt: str(d.updatedAt || new Date().toISOString(), 40),
    };
  }
  /** Add / update custom exercises in the live list. Returns the normalized ones. */
  function registerCustom(defs, { onlyMissing = false } = {}) {
    const out = [];
    for (const raw of defs || []) {
      const d = normalizeExercise(raw);
      if (!d) continue;
      const i = EXERCISES.findIndex((e) => e.id === d.id);
      if (i >= 0 && !EXERCISES[i].custom) continue;          // never replace a built-in
      if (i >= 0 && onlyMissing) continue;
      if (i >= 0) EXERCISES[i] = d; else EXERCISES.push(d);
      out.push(d);
    }
    return out;
  }
  function unregisterCustom(id) { const i = EXERCISES.findIndex((e) => e.id === id && e.custom); if (i >= 0) EXERCISES.splice(i, 1); }
  const customExercises = () => EXERCISES.filter((e) => e.custom);
  /** Definitions of the custom exercises a program uses (live version first, then the copy in the program). */
  function customFor(program, { photos = true } = {}) {
    const ids = new Set();
    for (const w of program.weeks || []) for (const d of w.days || []) for (const e of d.exercises || []) if (CUSTOM_ID.test(e.exerciseId)) ids.add(e.exerciseId);
    const inProgram = new Map((program.custom || []).map((c) => [c.id, c]));
    return [...ids].map((id) => exById(id) || inProgram.get(id)).filter(Boolean)
      .map((d) => normalizeExercise(photos ? d : { ...d, steps: (d.steps || []).map((st) => ({ ...st, photos: [] })) })).filter(Boolean);
  }

  /** Lines for an exercise: Paul's own note (strongest), his catchphrases for that lift, then technique cues. */
  function cuesFor(exerciseId, paulNote = '') {
    const e = exById(exerciseId);
    const out = [];
    if (paulNote) out.push({ t: `Paul says: ${paulNote}`, w: 8 });
    out.push(...(EXERCISE_LINES[exerciseId] || []));
    if (!e) return out;
    if (e.custom) {
      if (e.notes) out.push({ t: `Paul says: ${e.notes.split(/\n+/)[0].slice(0, 140)}`, w: 4 });
      for (const st of e.steps) { if (st.cue) out.push({ t: st.cue, w: 2 }); if (st.warning) out.push({ t: `Watch out: ${st.warning}`, w: 1 }); }
      if (out.length < 2) out.push(PAUL.brace, PAUL.goodBrace);
      return out;
    }
    for (const k of ['setup', 'execution', 'bracing', 'mistakes', 'safety']) {
      for (const t of e.tips?.[k] || []) out.push({ t: k === 'mistakes' ? `Avoid: ${t.charAt(0).toLowerCase()}${t.slice(1)}` : t, w: 1 });
    }
    return out;
  }

  P.data = { EXERCISES, GENERAL_TIPS, CATEGORIES, STATES, LINES, PAUL, EXERCISE_LINES, SAFETY, exById, exName, cuesFor,
    CUSTOM_ID, normalizeExercise, registerCustom, unregisterCustom, customExercises, customFor };
})(window.Paulino);
