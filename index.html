<script>
/* ===== 3. model =========================================================== */
(function (P) {
  const { uid, addDays, weekStart, isoDate, validIso, fmtKg, clone } = P.util;
  const { exById } = P.data;

  /*
   * Program (canonical format, also the body of .paulino files):
   * {
   *   format: 'paulino-program', v: 1,
   *   id, revision, name, athlete, startDate (YYYY-MM-DD), durationWeeks, notes,
   *   createdAt, updatedAt,
   *   weeks: [{ id, label, gen?: {from, deload}, days: [{
   *     id, name, weekday (0 = Monday … 6 = Sunday), notes, src?,
   *     exercises: [{ id, exerciseId, sets: [{ reps, kg, bw, rpe, rir }],
   *                   rest (seconds|null), tempo, notes,
   *                   gen (made by Repeat/Progress), edited (manual override), src (template exercise id) }]
   *   }] }]
   * }
   * kg = null with bw = true means bodyweight; bw = true with kg = n means bodyweight + n kg.
   */
  const FORMAT = 'paulino-program';
  const VERSION = 1;
  const M = { FORMAT, VERSION };

  M.newSet = (reps = 5, kg = null, bw = false) => ({ reps, kg, bw: Boolean(bw), rpe: null, rir: null });
  M.newExercise = (exerciseId, { sets = 4, reps = 5, kg = null } = {}) => {
    const bw = exerciseId === 'pull-up' && (kg === null || kg === undefined);
    return { id: uid(), exerciseId, sets: Array.from({ length: sets }, () => M.newSet(reps, bw ? null : kg ?? 20, bw)), rest: 120, tempo: '', notes: '', gen: false, edited: false };
  };
  M.newDay = (name = 'Day 1', weekday = 0) => ({ id: uid(), name, weekday, notes: '', exercises: [] });
  M.newWeek = (days = []) => ({ id: uid(), label: '', days });

  M.newProgram = ({ name = '', athlete = '', startDate = isoDate(), durationWeeks = 12, notes = '' } = {}) => {
    const now = new Date().toISOString();
    return {
      format: FORMAT, v: VERSION, id: uid('p'), revision: '', name, athlete, startDate, durationWeeks, notes,
      createdAt: now, updatedAt: now,
      weeks: [M.newWeek([M.newDay('Day 1', 0)])],
    };
  };

  /** Copy with fresh ids (duplicate program / week / day). */
  M.reId = (obj, kind) => {
    const c = clone(obj);
    if (kind === 'program') { c.id = uid('p'); c.revision = ''; c.createdAt = c.updatedAt = new Date().toISOString(); c.weeks = c.weeks.map((w) => M.reId(w, 'week')); }
    if (kind === 'week') { c.id = uid(); c.days = c.days.map((d) => M.reId(d, 'day')); }
    if (kind === 'day') { c.id = uid(); c.exercises = c.exercises.map((e) => M.reId(e, 'exercise')); }
    if (kind === 'exercise') { c.id = uid(); }
    return c;
  };

  M.dayDate = (program, weekIndex, day) => {
    if (!validIso(program.startDate)) return null;
    return addDays(weekStart(program.startDate), weekIndex * 7 + (Number(day.weekday) || 0));
  };
  M.weekLabel = (program, wi) => program.weeks[wi]?.label || `Week ${wi + 1}`;
  M.weekDates = (program, wi) => {
    if (!validIso(program.startDate)) return '';
    const s = addDays(weekStart(program.startDate), wi * 7);
    return `${P.util.fmtDate(s, { weekday: false })} – ${P.util.fmtDate(addDays(s, 6), { weekday: false })}`;
  };
  M.allDays = (program) => program.weeks.flatMap((w, wi) => w.days.map((d, di) => ({ week: w, wi, day: d, di, date: M.dayDate(program, wi, d) })));
  M.findDay = (program, dayId) => M.allDays(program).find((x) => x.day.id === dayId) || null;

  // ---- set summaries ----
  M.loadText = (s) => (s.bw ? (s.kg ? `BW + ${fmtKg(s.kg)} kg` : 'BW') : s.kg === null || s.kg === undefined ? '–' : `${fmtKg(s.kg)} kg`);
  M.summarize = (sets) => {
    const g = [];
    for (const s of sets || []) {
      const key = `${s.reps}|${M.loadText(s)}|${s.rpe ?? ''}|${s.rir ?? ''}`;
      const last = g[g.length - 1];
      if (last && last.key === key) last.n++;
      else g.push({ key, n: 1, s });
    }
    return g.map(({ n, s }) => `${n} × ${s.reps} @ ${M.loadText(s)}${s.rpe ? ` RPE ${fmtKg(s.rpe)}` : ''}${s.rir !== null && s.rir !== undefined && s.rir !== '' ? ` ${s.rir} RIR` : ''}`).join(' · ');
  };
  /** Grid values for an exercise: { sets, reps|null (mixed), kg|null (mixed/BW), bw, mixed } */
  M.gridOf = (ex) => {
    const s = ex.sets;
    const reps = s.every((x) => x.reps === s[0].reps) ? s[0].reps : null;
    const sameKg = s.every((x) => (x.kg ?? null) === (s[0].kg ?? null) && Boolean(x.bw) === Boolean(s[0].bw));
    return { sets: s.length, reps, kg: sameKg ? s[0].kg : null, bw: sameKg && Boolean(s[0].bw), mixedReps: reps === null, mixedKg: !sameKg };
  };
  /** Apply a grid edit (sets / reps / kg) to every set. */
  M.setGrid = (ex, field, value) => {
    if (field === 'sets') {
      const n = Math.max(1, Math.min(30, Math.round(value)));
      while (ex.sets.length < n) ex.sets.push(clone(ex.sets[ex.sets.length - 1] || M.newSet()));
      ex.sets.length = n;
    } else if (field === 'reps') ex.sets.forEach((s) => { s.reps = Math.max(1, Math.min(100, Math.round(value))); });
    else if (field === 'kg') ex.sets.forEach((s) => { s.kg = value; });
  };

  // ---- content hash (revision): same content → same revision ----
  M.revisionOf = (program) => {
    const body = JSON.stringify([program.name, program.athlete, program.startDate, program.notes, program.weeks, ...(program.custom?.length ? [program.custom.map((c) => [c.id, c.updatedAt])] : [])]);
    let h = 0x811c9dc5;
    for (let i = 0; i < body.length; i++) { h ^= body.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(36);
  };

  // ---- validation ----
  const isInt = (n) => typeof n === 'number' && Number.isInteger(n);
  const isNum = (n) => typeof n === 'number' && Number.isFinite(n);
  M.validateSets = (sets, where) => {
    const errs = [];
    if (!Array.isArray(sets) || sets.length < 1) return [`${where}: add at least one set`];
    if (sets.length > 30) errs.push(`${where}: maximum 30 sets`);
    sets.forEach((s, i) => {
      const n = `${where}, set ${i + 1}`;
      if (!isInt(s?.reps) || s.reps < 1 || s.reps > 100) errs.push(`${n}: reps must be a whole number from 1 to 100`);
      if (s?.kg !== null && s?.kg !== undefined && (!isNum(s.kg) || s.kg < 0 || s.kg > 1000)) errs.push(`${n}: weight must be between 0 and 1000 kg`);
      if (!s?.bw && (s?.kg === null || s?.kg === undefined)) errs.push(`${n}: enter a weight (or mark it bodyweight)`);
      if (s?.rpe !== null && s?.rpe !== undefined && s.rpe !== '' && (!isNum(s.rpe) || s.rpe < 1 || s.rpe > 10)) errs.push(`${n}: RPE must be 1–10`);
      if (s?.rir !== null && s?.rir !== undefined && s.rir !== '' && (!isNum(s.rir) || s.rir < 0 || s.rir > 10)) errs.push(`${n}: RIR must be 0–10`);
    });
    return errs;
  };

  /** @returns string[] human-readable errors (empty = valid) */
  M.validate = (p) => {
    const errs = [];
    if (!p || typeof p !== 'object') return ['Not a program'];
    if (!String(p.name || '').trim()) errs.push('Give the program a name');
    if (String(p.name || '').length > 120) errs.push('Program name is too long (max 120)');
    if (String(p.athlete || '').length > 80) errs.push('Athlete name is too long (max 80)');
    if (!validIso(p.startDate)) errs.push('Choose a valid start date');
    if (p.durationWeeks !== undefined && (!isInt(p.durationWeeks) || p.durationWeeks < 1 || p.durationWeeks > 104)) errs.push('Duration must be 1–104 weeks');
    if (!Array.isArray(p.weeks) || !p.weeks.length) { errs.push('The program needs at least one week'); return errs; }
    if (p.weeks.length > 104) errs.push('Maximum 104 weeks');
    const ids = new Set();
    const custom = new Map((Array.isArray(p.custom) ? p.custom : []).map((c) => [c?.id, c]));
    const uniq = (id, what) => { if (typeof id !== 'string' || !id) errs.push(`${what}: missing id`); else if (ids.has(id)) errs.push(`${what}: duplicate id`); ids.add(id); };
    p.weeks.forEach((w, wi) => {
      const wl = M.weekLabel(p, wi);
      uniq(w.id, wl);
      if (!Array.isArray(w.days)) { errs.push(`${wl}: days missing`); return; }
      if (w.days.length > 7) errs.push(`${wl}: maximum 7 training days`);
      w.days.forEach((d, di) => {
        const dl = `${wl} › ${d.name || `Day ${di + 1}`}`;
        uniq(d.id, dl);
        if (!String(d.name || '').trim()) errs.push(`${wl}: day ${di + 1} needs a name`);
        if (!isInt(d.weekday) || d.weekday < 0 || d.weekday > 6) errs.push(`${dl}: choose a weekday`);
        if (!Array.isArray(d.exercises)) { errs.push(`${dl}: exercises missing`); return; }
        if (d.exercises.length > 20) errs.push(`${dl}: maximum 20 exercises`);
        d.exercises.forEach((e, ei) => {
          const known = exById(e.exerciseId) || custom.get(e.exerciseId);
          const el = `${dl} › ${known?.name || `exercise ${ei + 1}`}`;
          uniq(e.id, el);
          if (!known) errs.push(`${dl}: "${e.exerciseId}" is not in the exercise list`);
          errs.push(...M.validateSets(e.sets, el));
          if (e.rest !== null && e.rest !== undefined && (!isInt(e.rest) || e.rest < 0 || e.rest > 1800)) errs.push(`${el}: rest must be 0–30 minutes`);
        });
      });
    });
    return errs;
  };

  /** Fill defaults / drop unknown fields from an imported or decoded program. */
  M.normalize = (p) => ({
    format: FORMAT, v: VERSION,
    id: String(p.id || uid('p')), revision: String(p.revision || ''),
    name: String(p.name ?? '').slice(0, 120), athlete: String(p.athlete ?? '').slice(0, 80),
    startDate: String(p.startDate || ''), durationWeeks: Number.isInteger(p.durationWeeks) ? p.durationWeeks : (p.weeks?.length || 1),
    notes: String(p.notes ?? '').slice(0, 4000),
    createdAt: p.createdAt || new Date().toISOString(), updatedAt: p.updatedAt || new Date().toISOString(),
    ...(Array.isArray(p.custom) && p.custom.length ? { custom: p.custom.map(P.data.normalizeExercise).filter(Boolean).slice(0, 50) } : {}),
    weeks: (Array.isArray(p.weeks) ? p.weeks : []).map((w) => ({
      id: String(w.id || uid()), label: String(w.label ?? '').slice(0, 60), ...(w.gen ? { gen: { from: Number(w.gen.from) || 1, deload: Boolean(w.gen.deload) } } : {}),
      days: (Array.isArray(w.days) ? w.days : []).map((d) => ({
        id: String(d.id || uid()), name: String(d.name ?? '').slice(0, 60), weekday: Number(d.weekday), notes: String(d.notes ?? '').slice(0, 2000), ...(d.src ? { src: String(d.src) } : {}),
        exercises: (Array.isArray(d.exercises) ? d.exercises : []).map((e) => ({
          id: String(e.id || uid()), exerciseId: String(e.exerciseId || ''),
          sets: (Array.isArray(e.sets) ? e.sets : []).map((s) => ({
            reps: Number(s.reps), kg: s.kg === null || s.kg === undefined || s.kg === '' ? null : Number(s.kg), bw: Boolean(s.bw),
            rpe: s.rpe === null || s.rpe === undefined || s.rpe === '' ? null : Number(s.rpe), rir: s.rir === null || s.rir === undefined || s.rir === '' ? null : Number(s.rir),
          })),
          rest: e.rest === null || e.rest === undefined || e.rest === '' ? null : Number(e.rest), tempo: String(e.tempo ?? '').slice(0, 20), notes: String(e.notes ?? '').slice(0, 2000),
          gen: Boolean(e.gen), edited: Boolean(e.edited), ...(e.src ? { src: String(e.src) } : {}),
        })),
      })),
    })),
  });

  P.model = M;
})(window.Paulino);
</script>
<script>
/* ===== 4. rules: Repeat / Progress engine ================================== */
(function (P) {
  const { uid, clone, roundTo, fmtKg } = P.util;
  const M = P.model;
  const { exName } = P.data;

  /*
   * Deterministic rule engine. Takes one template week and produces N following
   * weeks as ordinary, fully editable weeks.
   *
   * Rule: { id, op, amount, every, scope, min, max, round, deloadPct, deloadSets, reset }
   *   op        'repeat'  copy unchanged (no other fields needed)
   *             'weight'  add `amount` kg (negative = decrease)
   *             'percent' change load by `amount` % (compounding)
   *             'reps'    add `amount` reps (negative = decrease)
   *             'sets'    add `amount` sets (negative = decrease)
   *             'deload'  every `every`-th week: load − deloadPct % (and − deloadSets sets),
   *                       for that week only; with `reset`, progression restarts after it.
   *   every     apply every N weeks (1 = every week, 4 = every fourth week …)
   *   scope     { type: 'all' } | { type: 'lifts', ids: [exerciseId…] }
   *             | { type: 'days', ids: [template day id…] } | { type: 'items', ids: [template exercise id…] }
   *   min/max   optional limits (kg for weight/percent, reps for reps, sets for sets)
   *   round     load rounding step in kg (default 2.5; 0 = no rounding)
   *
   * Week k (k = 1…N, the template is k = 0). A rule with `every = n` has been
   * applied floor(k / n) times by week k — so "+1 rep every 2 weeks" changes
   * weeks 3, 5, 7 … (week numbers counted from the template as week 1).
   * A deload rule with every = 4 marks weeks 4, 8, 12 … (counted the same way).
   * Rules are applied in list order; loads are only rounded when a load rule
   * touched them. Results never go below 0 kg, 1 rep or 1 set.
   */
  const OPS = {
    repeat: 'Repeat unchanged',
    weight: '± Weight (kg)',
    percent: '± Weight (%)',
    reps: '± Reps',
    sets: '± Sets',
    deload: 'Deload week',
  };

  const matches = (rule, ex, day) => {
    const s = rule.scope || { type: 'all' };
    if (s.type === 'all') return true;
    const ids = s.ids || [];
    if (s.type === 'lifts') return ids.includes(ex.exerciseId);
    if (s.type === 'days') return ids.includes(day.id);
    if (s.type === 'items') return ids.includes(ex.id);
    return false;
  };

  const every = (r) => Math.max(1, Math.round(Number(r.every) || 1));
  const isDeloadWeek = (rule, k) => (k + 1) % every(rule) === 0;

  /** Effective week index for cumulative rules, honouring deload resets. */
  function effectiveK(k, rules) {
    let kEff = k;
    for (const r of rules) if (r.op === 'deload' && r.reset) kEff = Math.min(kEff, k % every(r));
    return kEff;
  }

  /** Transform one template exercise for week k. Returns { sets, changed, deload } */
  function transform(ex, day, k, rules) {
    const applicable = rules.filter((r) => r.op !== 'repeat' && matches(r, ex, day));
    const kEff = effectiveK(k, applicable);
    let sets = clone(ex.sets);
    let loadTouched = false;
    let roundStep = 2.5;
    let deload = false;
    let n = sets.length;

    for (const r of applicable) {
      if (r.op === 'deload') continue;
      const times = Math.floor(kEff / every(r));
      const amt = Number(r.amount) || 0;
      if (r.op === 'weight' || r.op === 'percent') {
        if (r.round !== undefined && r.round !== null && r.round !== '') roundStep = Number(r.round);
        if (!times || !amt) continue;
        loadTouched = true;
        sets.forEach((s) => {
          if (s.kg === null || s.kg === undefined) return;
          let v = r.op === 'weight' ? s.kg + amt * times : s.kg * (1 + amt / 100) ** times;
          if (isNum(r.max)) v = Math.min(v, Number(r.max));
          if (isNum(r.min)) v = Math.max(v, Number(r.min));
          s.kg = v;
        });
      } else if (r.op === 'reps') {
        if (!times || !amt) continue;
        sets.forEach((s) => {
          let v = s.reps + amt * times;
          if (isNum(r.max)) v = Math.min(v, Number(r.max));
          if (isNum(r.min)) v = Math.max(v, Number(r.min));
          s.reps = v;
        });
      } else if (r.op === 'sets') {
        if (!times || !amt) continue;
        let v = n + amt * times;
        if (isNum(r.max)) v = Math.min(v, Number(r.max));
        if (isNum(r.min)) v = Math.max(v, Number(r.min));
        n = v;
      }
    }
    for (const r of applicable) {
      if (r.op !== 'deload' || !isDeloadWeek(r, k)) continue;
      deload = true;
      const pct = Number(r.deloadPct) || 0;
      if (pct) {
        loadTouched = true;
        if (r.round !== undefined && r.round !== null && r.round !== '') roundStep = Number(r.round);
        sets.forEach((s) => { if (s.kg !== null && s.kg !== undefined) s.kg = s.kg * (1 - pct / 100); });
      }
      if (Number(r.deloadSets)) n -= Number(r.deloadSets);
    }
    // sets count: copy the last set to grow, drop from the end to shrink
    n = Math.max(1, Math.min(30, Math.round(n)));
    while (sets.length < n) sets.push(clone(sets[sets.length - 1]));
    sets.length = n;
    sets.forEach((s) => {
      s.reps = Math.max(1, Math.min(100, Math.round(s.reps)));
      if (s.kg !== null && s.kg !== undefined) {
        if (loadTouched && roundStep > 0) s.kg = roundTo(s.kg, roundStep);
        s.kg = Math.max(0, Math.min(1000, Number(s.kg.toFixed(3))));
      }
    });
    const changed = JSON.stringify(sets) !== JSON.stringify(ex.sets);
    return { sets, changed, deload };
  }
  const isNum = (v) => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));

  /**
   * @param program
   * @param opts.from        template week index (0-based)
   * @param opts.count       number of weeks to generate
   * @param opts.replace     true: overwrite the weeks after the template; false: insert after it
   * @param opts.rules       rule list (see above); [] or a 'repeat' rule = copy unchanged
   * @param opts.keepEdited  keep manually edited exercises in weeks being overwritten
   * @returns { program, report: { generated, replaced, keptEdits, deloadWeeks } }
   */
  function apply(program, { from = 0, count = 1, replace = true, rules = [], keepEdited = true } = {}) {
    const p = clone(program);
    const template = p.weeks[from];
    if (!template) throw new Error('Template week not found');
    count = Math.max(1, Math.min(104 - from - 1, Math.round(count)));
    const old = replace ? p.weeks.slice(from + 1, from + 1 + count) : [];
    const report = { generated: count, replaced: old.length, keptEdits: 0, deloadWeeks: [] };
    const fresh = [];
    for (let k = 1; k <= count; k++) {
      const prev = old[k - 1];
      let anyDeload = false;
      const days = template.days.map((d) => {
        const prevDay = prev?.days.find((x) => x.src === d.id || x.id === d.id);
        return {
          id: prevDay?.id || uid(), name: d.name, weekday: d.weekday, notes: d.notes, src: d.id,
          exercises: d.exercises.map((ex) => {
            const prevEx = prevDay?.exercises.find((x) => x.src === ex.id);
            if (keepEdited && prevEx?.edited) { report.keptEdits++; return prevEx; }
            const t = transform(ex, d, k, rules);
            if (t.deload) anyDeload = true;
            return { ...clone(ex), id: prevEx?.id || uid(), sets: t.sets, gen: true, edited: false, src: ex.id };
          }),
        };
      });
      if (anyDeload) report.deloadWeeks.push(from + 1 + k);
      fresh.push({ id: prev?.id || uid(), label: '', gen: { from: from + 1, deload: anyDeload }, days });
    }
    if (replace) p.weeks.splice(from + 1, old.length, ...fresh);
    else p.weeks.splice(from + 1, 0, ...fresh);
    p.updatedAt = new Date().toISOString();
    return { program: p, report };
  }

  /** Preview table: one column per template exercise, one row per week (template first). */
  function preview(program, opts) {
    const { program: out, report } = apply(program, opts);
    const from = opts.from || 0;
    const template = program.weeks[from];
    const columns = template.days.flatMap((d) => d.exercises.map((e) => ({ id: e.id, label: exName(e.exerciseId), day: d.name })));
    const rows = [];
    for (let i = from; i <= from + report.generated; i++) {
      const w = out.weeks[i];
      const cells = columns.map((c) => {
        const ex = w.days.flatMap((d) => d.exercises).find((e) => e.id === c.id || e.src === c.id);
        return ex ? { text: compact(ex.sets), edited: ex.edited } : { text: '–' };
      });
      rows.push({ week: i + 1, template: i === from, deload: Boolean(w.gen?.deload), cells });
    }
    return { columns, rows, report };
  }

  /** "4×5 · 100" style, short enough for a preview cell. */
  function compact(sets) {
    const g = M.gridOf({ sets });
    const load = g.mixedKg ? sets.map((s) => (s.bw && !s.kg ? 'BW' : fmtKg(s.kg))).join('/') : g.bw ? (g.kg ? `BW+${fmtKg(g.kg)}` : 'BW') : `${fmtKg(g.kg)} kg`;
    const reps = g.mixedReps ? sets.map((s) => s.reps).join('/') : g.reps;
    return `${g.sets}×${reps} · ${load}`;
  }

  /** Human description of a rule, e.g. "Back squat: +2.5 kg every week". */
  function describe(rule, program, from = 0) {
    const ev = every(rule) === 1 ? 'every week' : `every ${every(rule)} weeks`;
    const amt = Number(rule.amount) || 0;
    const sign = amt > 0 ? '+' : '';
    const what = {
      repeat: 'Repeat unchanged',
      weight: `${sign}${fmtKg(amt)} kg ${ev}`,
      percent: `${sign}${fmtKg(amt)}% load ${ev}`,
      reps: `${sign}${amt} rep${Math.abs(amt) === 1 ? '' : 's'} ${ev}`,
      sets: `${sign}${amt} set${Math.abs(amt) === 1 ? '' : 's'} ${ev}`,
      deload: `Deload every ${ordinal(every(rule))} week: −${fmtKg(rule.deloadPct || 0)}% load${Number(rule.deloadSets) ? `, −${rule.deloadSets} set${rule.deloadSets > 1 ? 's' : ''}` : ''}${rule.reset ? ', then restart' : ''}`,
    }[rule.op] || rule.op;
    return `${scopeText(rule.scope, program, from)}: ${what}`;
  }
  const ordinal = (n) => (n === 1 ? '' : n === 2 ? '2nd' : n === 3 ? '3rd' : `${n}th`);
  function scopeText(scope, program, from = 0) {
    if (!scope || scope.type === 'all') return 'All exercises';
    if (scope.type === 'lifts') return scope.ids.map(exName).join(', ') || 'No exercises';
    const t = program?.weeks[from];
    if (scope.type === 'days') return scope.ids.map((id) => t?.days.find((d) => d.id === id)?.name || 'day').join(', ') || 'No days';
    if (scope.type === 'items') return `${scope.ids.length} selected`;
    return '';
  }

  /** Validate a rule set; returns error strings. */
  function validate(rules, { from = 0, count = 1, weeks = 1 } = {}) {
    const errs = [];
    if (!Number.isInteger(count) || count < 1 || count > 104) errs.push('Number of weeks must be 1–104');
    if (from < 0 || from >= weeks) errs.push('Choose a template week');
    if (from + count + 1 > 104) errs.push('A program can have at most 104 weeks');
    for (const r of rules) {
      const label = OPS[r.op] || 'Rule';
      if (!OPS[r.op]) { errs.push('Unknown rule type'); continue; }
      if (!Number.isInteger(Number(r.every)) || Number(r.every) < 1 || Number(r.every) > 52) errs.push(`${label}: frequency must be every 1–52 weeks`);
      if (['weight', 'percent', 'reps', 'sets'].includes(r.op) && (!isNum(r.amount) || Number(r.amount) === 0)) errs.push(`${label}: enter an amount other than 0`);
      if (r.op === 'percent' && isNum(r.amount) && (Number(r.amount) <= -100 || Number(r.amount) > 100)) errs.push(`${label}: percentage must be between −99 and 100`);
      if (['reps', 'sets'].includes(r.op) && isNum(r.amount) && !Number.isInteger(Number(r.amount))) errs.push(`${label}: use whole numbers`);
      if (r.op === 'deload' && (!isNum(r.deloadPct) || Number(r.deloadPct) < 0 || Number(r.deloadPct) >= 100)) errs.push('Deload: reduction must be 0–99%');
      if (r.op === 'deload' && Number(r.every) < 2) errs.push('Deload: choose every 2nd week or more');
      if (isNum(r.min) && isNum(r.max) && Number(r.min) > Number(r.max)) errs.push(`${label}: minimum is above maximum`);
      if ((isNum(r.min) && Number(r.min) < 0) || (isNum(r.max) && Number(r.max) < 0)) errs.push(`${label}: limits can't be negative`);
      if (r.round !== undefined && r.round !== '' && r.round !== null && (!isNum(r.round) || Number(r.round) < 0)) errs.push(`${label}: rounding step can't be negative`);
      if (r.scope && r.scope.type !== 'all' && !(r.scope.ids || []).length) errs.push(`${label}: choose what it applies to`);
    }
    return errs;
  }

  const newRule = (op = 'weight', patch = {}) => ({ id: uid(), op, amount: op === 'weight' ? 2.5 : op === 'percent' ? 2 : 1, every: op === 'deload' ? 4 : 1, scope: { type: 'all' }, min: '', max: '', round: 2.5, deloadPct: 10, deloadSets: 0, reset: false, ...patch });

  P.rules = { OPS, apply, preview, describe, validate, newRule, transform, compact, scopeText };
})(window.Paulino);
</script>
<script>
/* ===== 5. share: links & .paulino files ==================================== */
(function (P) {
  const M = P.model;

  /*
   * Link format:  <app url>#program=<scheme>.<data>
   *   scheme 'z1' = compact JSON v1, deflate-raw compressed, base64url
   *   scheme 'j1' = compact JSON v1, uncompressed base64url (browsers without CompressionStream)
   * Compact JSON v1 (positional arrays to keep links short):
   *   [1, id, name, athlete, startDate, durationWeeks, notes, weeks]
   *   week     = [id, label, days, deload(0/1)]
   *   day      = [id, name, weekday, notes, exercises]
   *   exercise = [id, exerciseId, setGroups, rest, tempo, notes]
   *   setGroup = [count, reps, kg|null, bw(0/1), rpe|null, rir|null]  (consecutive identical sets)
   *   [8] custom = Paul's own exercises used by the program (definitions + steps;
   *       photos only when they keep the link a sensible size, see makeLink)
   * The link carries the whole program, so it works in any browser, independently
   * of Paul's storage. It is a snapshot: later edits need a new link.
   */
  const LINK_OK = 2000;     // safe everywhere (SMS, chat apps, email)
  const LINK_WARN = 8000;   // most browsers fine, some apps cut long links → suggest the file
  const FILE_EXT = '.paulino';

  const groupSets = (sets) => {
    const out = [];
    for (const s of sets) {
      const row = [1, s.reps, s.kg ?? null, s.bw ? 1 : 0, s.rpe ?? null, s.rir ?? null];
      const last = out[out.length - 1];
      if (last && last.slice(1).every((v, i) => v === row[i + 1])) last[0]++;
      else out.push(row);
    }
    // drop trailing nulls/zeros to save bytes
    return out.map((r) => { while (r.length > 3 && (r[r.length - 1] === null || (r.length === 4 && r[3] === 0))) r.pop(); return r; });
  };
  const ungroupSets = (groups) => (groups || []).flatMap((g) => Array.from({ length: Math.min(30, Number(g[0]) || 0) }, () => ({
    reps: g[1], kg: g[2] ?? null, bw: Boolean(g[3]), rpe: g[4] ?? null, rir: g[5] ?? null,
  })));

  function toCompact(p) {
    return [1, p.id, p.name, p.athlete || '', p.startDate, p.durationWeeks || p.weeks.length, p.notes || '',
      p.weeks.map((w) => [w.id, w.label || '', w.days.map((d) => [d.id, d.name, d.weekday, d.notes || '',
        d.exercises.map((e) => [e.id, e.exerciseId, groupSets(e.sets), e.rest ?? null, e.tempo || '', e.notes || ''])]), w.gen?.deload ? 1 : 0]),
      ...(p.custom?.length ? [p.custom] : [])];
  }
  function fromCompact(c) {
    if (!Array.isArray(c) || c[0] !== 1) throw new Error('unsupported_version');
    const [, id, name, athlete, startDate, durationWeeks, notes, weeks, custom] = c;
    return M.normalize({
      id, name, athlete, startDate, durationWeeks, notes, custom,
      weeks: (weeks || []).map(([wid, label, days, deload]) => ({
        id: wid, label, ...(deload ? { gen: { from: 1, deload: true } } : {}), days: (days || []).map(([did, dname, weekday, dnotes, exs]) => ({
          id: did, name: dname, weekday, notes: dnotes,
          exercises: (exs || []).map(([eid, exerciseId, groups, rest, tempo, enotes]) => ({ id: eid, exerciseId, sets: ungroupSets(groups), rest, tempo, notes: enotes })),
        })),
      })),
    });
  }

  // ---- base64url & compression ----
  const b64url = (bytes) => {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const unb64url = (s) => {
    if (!/^[A-Za-z0-9_-]*$/.test(s)) throw new Error('bad_encoding');
    const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
    return Uint8Array.from(bin, (c) => c.charCodeAt(0));
  };
  const canCompress = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
  async function pipe(bytes, stream) {
    const out = new Response(new Blob([bytes]).stream().pipeThrough(stream));
    return new Uint8Array(await out.arrayBuffer());
  }

  /** program → "z1.xxxxx" */
  async function encode(program) {
    const json = new TextEncoder().encode(JSON.stringify(toCompact(program)));
    if (canCompress()) {
      try { return `z1.${b64url(await pipe(json, new CompressionStream('deflate-raw')))}`; } catch { /* fall back */ }
    }
    return `j1.${b64url(json)}`;
  }

  /** "z1.xxxxx" → validated program. Throws Error with a readable message. */
  async function decode(token) {
    const m = String(token || '').match(/^([a-z]\d+)\.(.+)$/);
    if (!m) throw new Error("This link is incomplete. Ask Paul to send it again.");
    const [, scheme, data] = m;
    if (data.length > 2_000_000) throw new Error('This link is too large.');
    let bytes;
    try { bytes = unb64url(data); } catch { throw new Error('This link is damaged (it may have been cut off). Ask Paul for the file instead.'); }
    if (scheme === 'z1') {
      if (!canCompress()) throw new Error('This browser is too old to open compressed links. Ask Paul for the .paulino file.');
      try { bytes = await pipe(bytes, new DecompressionStream('deflate-raw')); } catch { throw new Error('This link is damaged (it may have been cut off). Ask Paul for the file instead.'); }
    } else if (scheme !== 'j1') throw new Error('This link was made by a newer version of Paulino. Reload the page and try again.');
    let compact;
    try { compact = JSON.parse(new TextDecoder().decode(bytes)); } catch { throw new Error('This link is damaged. Ask Paul to send it again.'); }
    let program;
    try { program = fromCompact(compact); } catch (e) { throw new Error(e.message === 'unsupported_version' ? 'This link was made by a newer version of Paulino.' : 'This link is not a Paulino program.'); }
    const errs = M.validate(program);
    if (errs.length) throw new Error(`This program has problems: ${errs.slice(0, 3).join('; ')}`);
    program.revision = M.revisionOf(program);
    return program;
  }

  async function makeLink(program) {
    const base = location.href.split('#')[0];
    let snap = snapshot(program);
    let url = `${base}#program=${await encode(snap)}`;
    // Photos of Paul's own exercises make links huge: leave them out, the file keeps them.
    let photosLeftOut = false;
    if (url.length > LINK_WARN && snap.custom?.some((c) => c.steps.some((st) => st.photos.length))) {
      snap = snapshot(program, { photos: false });
      url = `${base}#program=${await encode(snap)}`;
      photosLeftOut = true;
    }
    return { url, length: url.length, level: url.length <= LINK_OK ? 'ok' : url.length <= LINK_WARN ? 'warn' : 'long', compressed: url.includes('#program=z'), photosLeftOut };
  }

  /** The version that gets shared: clean, with Paul's exercises it uses, and a content-based revision. */
  function snapshot(program, { photos = true } = {}) {
    const p = M.normalize(P.util.clone(program));
    const custom = P.data.customFor(p, { photos });
    if (custom.length) p.custom = custom; else delete p.custom;
    p.revision = M.revisionOf(p);
    return p;
  }

  // ---- .paulino files (pretty, versioned JSON) ----
  function toFile(program) {
    const p = snapshot(program);
    const body = { ...p, format: M.FORMAT, v: M.VERSION, exportedAt: new Date().toISOString(), app: 'Paulino' };
    const name = `${P.util.slug(p.athlete ? `${p.athlete} ${p.name}` : p.name)}${FILE_EXT}`;
    return { name, text: JSON.stringify(body, null, 2) };
  }

  function fromFile(text) {
    let data;
    try { data = JSON.parse(text); } catch { throw new Error("This file isn't a Paulino program (it's not valid JSON)."); }
    if (data?.format === 'paulino-backup') throw new Error('This is a Paulino backup, not a program. Use "Restore backup" in Settings.');
    if (data?.format !== M.FORMAT) throw new Error("This file isn't a Paulino program.");
    if (!Number.isInteger(data.v) || data.v > M.VERSION) throw new Error('This file was made by a newer version of Paulino. Reload the page and try again.');
    const program = M.normalize(data);
    const errs = M.validate(program);
    if (errs.length) throw new Error(`This program has problems: ${errs.slice(0, 3).join('; ')}`);
    program.revision = M.revisionOf(program);
    return program;
  }

  P.share = { encode, decode, makeLink, snapshot, toFile, fromFile, toCompact, fromCompact, LINK_OK, LINK_WARN, FILE_EXT, canCompress };
})(window.Paulino);
</script>
<script>
/* ===== 6. store: IndexedDB with fallbacks =================================== */
(function (P) {
  /*
   * Object stores (IndexedDB database "paulino", version 1):
   *   paul     Paul's programs                       key: id
   *   athlete  programs the athlete received         key: id   (original prescription, never edited)
   *   logs     one per trained / skipped day          key: `${programId}|${dayId}`
   *   mods     athlete's local changes to exercises  key: `${programId}|${exerciseInstanceId}`
   * Prescriptions, results and modifications are kept separate.
   * Small preferences (palette, timer) live in localStorage.
   * If IndexedDB is unavailable (some private modes), data goes to
   * localStorage; if that fails too, to memory for this tab only.
   */
  const STORES = ['paul', 'athlete', 'logs', 'mods', 'media', 'exercises'];
  const KEYS = { paul: 'id', athlete: 'id', logs: 'key', mods: 'key', media: 'id', exercises: 'id' };
  let mode = 'memory';
  let db = null;
  const memory = Object.fromEntries(STORES.map((s) => [s, new Map()]));

  const lsOk = (() => { try { localStorage.setItem('paulino:probe', '1'); localStorage.removeItem('paulino:probe'); return true; } catch { return false; } })();

  function openIdb() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
      let req;
      try { req = indexedDB.open('paulino', 3); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        for (const s of STORES) if (!d.objectStoreNames.contains(s)) {
          const os = d.createObjectStore(s, { keyPath: KEYS[s] });
          if (s === 'logs' || s === 'mods') os.createIndex('programId', 'programId');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('blocked'));
      setTimeout(() => reject(new Error('timeout')), 4000);
    });
  }

  const lsKey = (s) => `paulino:db:${s}`;
  const lsRead = (s) => { try { return JSON.parse(localStorage.getItem(lsKey(s)) || '{}'); } catch { return {}; } };
  const lsWrite = (s, obj) => localStorage.setItem(lsKey(s), JSON.stringify(obj));

  const tx = (s, kind, fn) => new Promise((resolve, reject) => {
    const t = db.transaction(s, kind);
    const os = t.objectStore(s);
    let result;
    Promise.resolve(fn(os)).then((r) => { result = r; });
    t.oncomplete = () => resolve(result instanceof IDBRequest ? result.result : result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('aborted'));
  });

  const S = {
    get mode() { return mode; },
    async init() {
      try { db = await openIdb(); mode = 'indexeddb'; }
      catch { mode = lsOk ? 'localstorage' : 'memory'; }
      try { await navigator.storage?.persist?.(); } catch { /* optional */ }
      return mode;
    },
    async all(s) {
      if (mode === 'indexeddb') return tx(s, 'readonly', (os) => os.getAll());
      if (mode === 'localstorage') return Object.values(lsRead(s));
      return [...memory[s].values()];
    },
    async get(s, key) {
      if (mode === 'indexeddb') return (await tx(s, 'readonly', (os) => os.get(key))) ?? null;
      if (mode === 'localstorage') return lsRead(s)[key] ?? null;
      return memory[s].get(key) ?? null;
    },
    async put(s, obj) {
      const v = JSON.parse(JSON.stringify(obj));
      try {
        if (mode === 'indexeddb') await tx(s, 'readwrite', (os) => os.put(v));
        else if (mode === 'localstorage') { const all = lsRead(s); all[v[KEYS[s]]] = v; lsWrite(s, all); }
        else memory[s].set(v[KEYS[s]], v);
      } catch (e) {
        P.util.toast(/quota/i.test(e?.name || e?.message) ? 'Storage is full: could not save. Export a backup and delete old programs.' : 'Could not save on this device.', { kind: 'error', ms: 6000 });
        throw e;
      }
      return v;
    },
    async del(s, key) {
      if (mode === 'indexeddb') return tx(s, 'readwrite', (os) => os.delete(key));
      if (mode === 'localstorage') { const all = lsRead(s); delete all[key]; lsWrite(s, all); return; }
      memory[s].delete(key);
    },
    async byProgram(s, programId) {
      return (await S.all(s)).filter((x) => x.programId === programId);
    },
    async delProgramData(programId) {
      for (const s of ['logs', 'mods']) for (const x of await S.byProgram(s, programId)) await S.del(s, x.key);
    },

    /** Backup of everything on this device (both roles). */
    async exportBackup() {
      const out = { format: 'paulino-backup', v: 1, exportedAt: new Date().toISOString() };
      for (const s of STORES) if (s !== 'media') out[s] = await S.all(s);   // the private illustration pack is never exported
      return JSON.stringify(out, null, 1);
    },
    /** Merge a backup in. Existing records with the same key are replaced. Returns counts. */
    async importBackup(text) {
      let data;
      try { data = JSON.parse(text); } catch { throw new Error("That file isn't a Paulino backup."); }
      if (data?.format !== 'paulino-backup') throw new Error(data?.format === P.model.FORMAT ? 'That is a program file. Use "Import program" instead.' : "That file isn't a Paulino backup.");
      if (data.v > 1) throw new Error('This backup was made by a newer version of Paulino.');
      const counts = {};
      for (const s of STORES.filter((x) => x !== 'media')) {
        counts[s] = 0;
        for (const rec of Array.isArray(data[s]) ? data[s] : []) {
          if (!rec || typeof rec !== 'object' || !rec[KEYS[s]]) continue;
          if ((s === 'paul' || s === 'athlete') && P.model.validate(P.model.normalize(rec)).length) continue;
          await S.put(s, s === 'paul' || s === 'athlete' ? { ...P.model.normalize(rec), ...(rec.savedAt ? { savedAt: rec.savedAt } : {}) } : rec);
          counts[s]++;
        }
      }
      return counts;
    },
  };

  // ---- small preferences ----
  S.pref = {
    get(k, fallback = null) { try { const v = localStorage.getItem(`paulino:${k}`); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(`paulino:${k}`, JSON.stringify(v)); } catch { /* ignore */ } },
  };

  P.store = S;
})(window.Paulino);
</script>
<script>
/* ===== 7. stats =========================================================== */
(function (P) {
  const { isoDate, daysBetween } = P.util;
  const M = P.model;

  /*
   * Workout log (store "logs"):
   * { key, programId, dayId, weekIndex, plannedDate, status: 'in_progress'|'done'|'skipped',
   *   skipReason, pain, notes, startedAt, completedAt, updatedAt,
   *   entries: [{ exId, exerciseId, target: [sets as prescribed when trained], sets: [{ reps, kg, done, rpe, note }] }] }
   */
  const St = {};
  const doneLogs = (logs) => logs.filter((l) => l.status === 'done').sort((a, b) => String(a.completedAt).localeCompare(String(b.completedAt)));
  const logDate = (l) => (l.completedAt ? isoDate(new Date(l.completedAt)) : l.plannedDate);
  St.logDate = logDate;

  /** Estimated 1RM (Epley), only for 1–10 reps. Always shown as an estimate. */
  St.e1rm = (kg, reps) => (kg > 0 && reps >= 1 && reps <= 10 ? (reps === 1 ? kg : Number((kg * (1 + reps / 30)).toFixed(1))) : null);

  St.volume = (log) => (log.entries || []).reduce((a, e) => a + e.sets.reduce((b, s) => b + (s.done ? (Number(s.kg) || 0) * (Number(s.reps) || 0) : 0), 0), 0);
  St.setsDone = (log) => (log.entries || []).reduce((a, e) => a + e.sets.filter((s) => s.done).length, 0);
  St.setsTotal = (log) => (log.entries || []).reduce((a, e) => a + e.sets.length, 0);

  /** PR events over all logs (all programs). The first time an exercise is logged is the baseline. */
  St.records = (logs) => {
    const best = {};
    const events = [];
    for (const l of doneLogs(logs)) {
      const per = {};
      for (const e of l.entries || []) for (const s of e.sets) {
        if (!s.done || !(s.reps >= 1)) continue;
        const kg = Number(s.kg) || 0;
        const x = (per[e.exerciseId] ||= { kg: 0, reps: 0, e1rm: 0, bwReps: 0 });
        if (kg > x.kg || (kg === x.kg && s.reps > x.reps)) { x.kg = kg; x.reps = s.reps; }
        x.e1rm = Math.max(x.e1rm, St.e1rm(kg, s.reps) || 0);
        if (!kg) x.bwReps = Math.max(x.bwReps, s.reps);
      }
      for (const [id, x] of Object.entries(per)) {
        const b = best[id];
        if (b) {
          if (x.kg > b.kg) events.push({ logKey: l.key, date: logDate(l), exerciseId: id, kind: 'weight', kg: x.kg, reps: x.reps });
          else if (x.e1rm > b.e1rm) events.push({ logKey: l.key, date: logDate(l), exerciseId: id, kind: 'e1rm', kg: x.kg, reps: x.reps, value: x.e1rm });
          else if (!x.kg && x.bwReps > b.bwReps) events.push({ logKey: l.key, date: logDate(l), exerciseId: id, kind: 'reps', reps: x.bwReps });
        }
        best[id] = { kg: Math.max(b?.kg || 0, x.kg), e1rm: Math.max(b?.e1rm || 0, x.e1rm), bwReps: Math.max(b?.bwReps || 0, x.bwReps), reps: x.kg >= (b?.kg || 0) ? x.reps : b.reps };
      }
    }
    return { events, best };
  };

  /** Per-session points for one exercise: heaviest completed set, reps, estimated 1RM. */
  St.history = (logs, exerciseId) => doneLogs(logs).map((l) => {
    const sets = (l.entries || []).filter((e) => e.exerciseId === exerciseId).flatMap((e) => e.sets).filter((s) => s.done && s.reps >= 1);
    if (!sets.length) return null;
    let top = -1, reps = 0, e1 = 0;
    for (const s of sets) {
      const kg = Number(s.kg) || 0;
      if (kg > top || (kg === top && s.reps > reps)) { top = kg; reps = s.reps; }
      e1 = Math.max(e1, St.e1rm(kg, s.reps) || 0);
    }
    return { date: logDate(l), logKey: l.key, programId: l.programId, top, reps, e1rm: e1 || null, sets: sets.length, repsList: sets.map((s) => s.reps) };
  }).filter(Boolean);

  St.progress = (program, logs) => {
    const days = M.allDays(program);
    const handled = logs.filter((l) => l.programId === program.id && (l.status === 'done' || l.status === 'skipped')).length;
    return { total: days.length, done: logs.filter((l) => l.programId === program.id && l.status === 'done').length, handled, pct: days.length ? Math.round((handled / days.length) * 100) : 0 };
  };

  /** Next day to train: in progress → recently missed (≤3 days) → next upcoming → first open. */
  St.next = (program, logs, today = isoDate()) => {
    const byDay = new Map(logs.filter((l) => l.programId === program.id).map((l) => [l.dayId, l]));
    const days = M.allDays(program);
    const prog = days.find((x) => byDay.get(x.day.id)?.status === 'in_progress');
    if (prog) return { ...prog, inProgress: true };
    const open = days.filter((x) => !byDay.has(x.day.id));
    const recent = open.filter((x) => x.date && x.date < today && daysBetween(x.date, today) <= 3).pop();
    return recent || open.find((x) => !x.date || x.date >= today) || open[0] || null;
  };

  St.currentWeek = (program, today = isoDate()) => {
    const n = daysBetween(P.util.weekStart(program.startDate), today);
    if (n === null) return 0;
    return Math.max(0, Math.min(program.weeks.length - 1, Math.floor(n / 7)));
  };

  P.stats = St;
})(window.Paulino);
</script>
<script>
/* ===== 8. art: assets + photographic collage ============================== */
(function (P) {
  /*
   * Paulino is a photomontage, not a drawing: real cut-outs of Paul's photos
   * (assets/paulino/*.webp, hand-cut by tools/build_cutouts.py) layered with
   * flat paper scraps, halftone and hand-drawn SVG marks.
   *
   * Asset ids → files come from assets/asset-manifest.json (loaded at start-up);
   * BUILTIN is the fallback when it can't be fetched (e.g. file://).
   * A missing or broken image never breaks a screen: the composition falls back
   * to a paper "P" placeholder (.cl-missing).
   */
  const BUILTIN = {
    paul_head_smiling: 'assets/paulino/paul_head_smiling.webp',
    paul_head_direct: 'assets/paulino/paul_head_direct.webp',
    paul_head_calm: 'assets/paulino/paul_head_calm.webp',
    paul_figure_outdoor: 'assets/paulino/paul_figure_outdoor.webp',
    paul_body_outdoor: 'assets/paulino/paul_body_outdoor.webp',
    paul_flex_beach: 'assets/paulino/paul_flex_beach.webp',
    paul_flex_beach_body: 'assets/paulino/paul_flex_beach_body.webp',
    paul_flex_gym: 'assets/paulino/paul_flex_gym.webp',
    paul_head_stare: 'assets/paulino/paul_head_stare.webp',
    paul_head_talking: 'assets/paulino/paul_head_talking.webp',
  };
  const files = { ...BUILTIN };
  const meta = {};

  async function loadManifest() {
    try {
      const res = await fetch('assets/asset-manifest.json', { cache: 'no-cache' });
      if (!res.ok) return;
      const m = await res.json();
      for (const img of m.images || []) if (img.id && img.file) { files[img.id] = img.file; meta[img.id] = img; }
      for (const [id, slot] of Object.entries(m.lesson_photo_slots || {})) if (slot?.file) { files[id] = slot.file; meta[id] = slot; }
    } catch { /* offline / file:// → built-in list */ }
    await loadPack();
  }

  /*
   * Private illustration pack (book figures). Copyrighted, so it is never part of
   * the website: Paul loads the .json file on his own device, it is stored in
   * this browser's IndexedDB ("media" store) and only fills empty lesson slots.
   */
  const PACK_FORMAT = 'paulino-image-pack';
  async function loadPack() {
    try {
      for (const rec of await P.store.all('media')) {
        if (!files[rec.id]) { files[rec.id] = rec.data; meta[rec.id] = { caption: rec.caption, source: rec.source, private: true }; }
      }
    } catch { /* no media store */ }
  }
  async function importPack(text) {
    let pack;
    try { pack = JSON.parse(text); } catch { throw new Error("That file isn't an illustration pack."); }
    if (pack?.format !== PACK_FORMAT || pack.v !== 1 || typeof pack.images !== 'object') throw new Error("That file isn't a Paulino illustration pack.");
    let n = 0;
    for (const [id, img] of Object.entries(pack.images)) {
      if (!/^lesson_[a-z0-9_]+$/.test(id) || !/^data:image\/(webp|png|jpeg);base64,/.test(img?.data || '')) continue;
      await P.store.put('media', { id, data: img.data, caption: String(img.caption || ''), source: String(img.source || pack.book || ''), rights: String(img.rights || pack.rights || '') });
      n++;
    }
    for (const k of Object.keys(files)) if (meta[k]?.private) { delete files[k]; delete meta[k]; }
    await loadPack();
    return n;
  }
  async function clearPack() {
    for (const rec of await P.store.all('media')) await P.store.del('media', rec.id);
    for (const k of Object.keys(files)) if (meta[k]?.private) { delete files[k]; delete meta[k]; }
  }
  const packCount = () => Object.values(meta).filter((m) => m.private).length;
  const src = (id) => files[id] || null;
  const has = (id) => Boolean(files[id]);

  const MOODS = ['motivated', 'focused', 'happy', 'celebrating', 'disappointed', 'concerned'];

  /*
   * Composition recipes. Positions are % of a square stage.
   *   head / body: asset id, box (left, top, width), rotation
   *   paper: flat torn scraps (palette tokens), marks: SVG annotation set
   */
  const RECIPES = {
    // Paul's own double-biceps body with his big grinning head on top: the hero montage.
    motivated:    { body: 'paul_flex_beach_body', bodyBox: [2, 27, 96], head: 'paul_head_smiling', headBox: [28, 0, 44], rot: -3, bw: true, paper: ['accent', 'pop-1'], marks: 'burst', label: "Paulino flexing, with Paul's big grin" },
    focused:      { head: 'paul_head_direct', headBox: [22, 8, 58], rot: 2, bw: true, paper: ['pop-2', 'accent'], marks: 'focus', label: 'Paulino, focused' },
    happy:        { head: 'paul_head_smiling', headBox: [20, 6, 60], rot: 3, bw: false, paper: ['pop-1', 'accent'], marks: 'spark', label: 'Paulino, happy' },
    celebrating:  { head: 'paul_flex_gym', headBox: [0, 20, 100], rot: -3, bw: false, paper: ['accent', 'pop-2'], marks: 'confetti', label: 'Paulino flexing and grinning' },
    disappointed: { head: 'paul_head_stare', headBox: [21, 10, 58], rot: -9, bw: true, paper: ['grey', 'pop-3'], marks: 'sigh', label: 'Paulino, unimpressed' },
    concerned:    { head: 'paul_head_talking', headBox: [26, 6, 50], rot: 5, bw: true, paper: ['pop-4', 'paper'], marks: 'worry', label: 'Paulino, asking a question' },
  };

  // Torn paper outlines (deterministic, hand-tuned point lists → CSS polygon).
  const TORN = [
    'polygon(3% 12%, 18% 6%, 31% 9%, 47% 2%, 63% 7%, 79% 3%, 96% 10%, 92% 28%, 98% 47%, 93% 66%, 97% 86%, 80% 95%, 61% 91%, 44% 98%, 26% 92%, 9% 96%, 4% 78%, 0% 58%, 5% 39%, 1% 24%)',
    'polygon(8% 4%, 29% 0%, 52% 6%, 74% 1%, 95% 7%, 100% 30%, 94% 52%, 99% 74%, 90% 97%, 66% 93%, 47% 100%, 22% 95%, 3% 99%, 6% 74%, 0% 50%, 5% 27%)',
    'polygon(50% 0%, 61% 14%, 79% 6%, 80% 24%, 98% 26%, 88% 42%, 100% 56%, 84% 64%, 90% 82%, 70% 80%, 62% 98%, 50% 84%, 36% 100%, 30% 80%, 9% 86%, 15% 66%, 0% 55%, 13% 42%, 2% 26%, 21% 24%, 20% 5%, 39% 14%)',
  ];

  const MARKS = {
    burst: '<path d="M80 10 l4 14 M92 18 l-8 10 M98 34 l-13 3" /><path d="M6 64 q6 -8 12 0 t12 0" />',
    focus: '<circle cx="50" cy="40" r="34" stroke-dasharray="5 4" /><path d="M50 2 v8 M50 70 v8 M12 40 h-8 M88 40 h8" />',
    spark: '<path d="M86 12 l3 8 8 1 -6 5 2 8 -7 -4 -7 4 2 -8 -6 -5 8 -1 z" fill="var(--accent)" /><path d="M10 20 l8 6 M6 34 l10 1" />',
    confetti: '<path d="M14 10 l4 9 M84 6 l-3 10 M92 30 l-9 3 M6 40 l9 2" /><path d="M78 16 l3 7 7 1 -5 4 2 7 -7 -4 -6 4 2 -7 -6 -4 7 -1 z" fill="var(--pop-1)" /><path d="M18 22 l2 5 5 0 -4 3 1 5 -4 -3 -4 3 1 -5 -4 -3 5 0 z" fill="var(--accent)" />',
    sigh: '<path d="M74 22 q5 7 0 11 q-5 -4 0 -11 z" fill="#9fc6e8" /><path d="M8 18 q6 -6 12 0 t12 0 M14 30 q5 -5 10 0" />',
    worry: '<path d="M78 18 q5 7 0 11 q-5 -4 0 -11 z" fill="#9fc6e8" /><path d="M10 12 l6 10 M22 8 l2 11" />',
  };
  const NOTE = { motivated: 'GO!', celebrating: 'YES!', disappointed: 'sigh…', concerned: '?!', focused: '', happy: '' };

  /**
   * Template C / D: Paulino reaction or compact composition.
   * @param mood    one of MOODS
   * @param size    'xs' (face only, inline) | 'sm' | 'md' | 'lg' | 'hero'
   */
  const XS_FACE = { motivated: 'paul_head_smiling', focused: 'paul_head_direct', happy: 'paul_head_smiling', celebrating: 'paul_head_smiling', disappointed: 'paul_head_stare', concerned: 'paul_head_talking' };
  function paulino(mood = 'motivated', { size = 'md', decor = true } = {}) {
    const r = RECIPES[mood] || RECIPES.motivated;
    const img = (id, box, cls, rot = 0) => has(id)
      ? `<img class="${cls}" src="${src(id)}" alt="" draggable="false" loading="lazy" decoding="async" style="left:${box[0]}%;top:${box[1]}%;width:${box[2]}%;--rot:${rot}deg" onerror="this.closest('.cl').classList.add('cl-missing')">`
      : '';
    if (size === 'xs') {
      return `<span class="cl cl-xs cl-${mood}${r.bw ? ' cl-bw' : ''}" role="img" aria-label="${r.label}"><span class="cl-paper" style="background:var(--${r.paper[0]});clip-path:${TORN[2]}"></span>${img(XS_FACE[mood] || 'paul_head_smiling', [6, 6, 88], 'cl-head', r.rot / 2)}<span class="cl-fallback" aria-hidden="true">P</span></span>`;
    }
    return `<span class="cl cl-${size} cl-${mood}${r.bw ? ' cl-bw' : ''}${r.body ? ' cl-tall' : ''}" role="img" aria-label="${r.label}">
      ${decor ? `<span class="cl-paper" style="background:var(--${r.paper[0]});clip-path:${TORN[0]}"></span>
      <span class="cl-paper cl-paper-2" style="background:var(--${r.paper[1]});clip-path:${TORN[1]}"></span>
      <span class="cl-ht" aria-hidden="true"></span>` : ''}
      ${r.body ? img(r.body, r.bodyBox, 'cl-body', 0) : ''}
      ${r.body ? '<span class="cl-neck" aria-hidden="true"></span>' : ''}
      ${img(r.head, r.headBox, 'cl-head', r.rot)}
      ${decor ? `<svg class="cl-marks" viewBox="0 0 100 100" aria-hidden="true">${MARKS[r.marks] || ''}</svg>${NOTE[mood] ? `<span class="cl-note">${NOTE[mood]}</span>` : ''}` : ''}
      <span class="cl-fallback" aria-hidden="true">P</span>
    </span>`;
  }

  /**
   * Photo slot: the real photo for this lesson step (public manifest or Paul's
   * private pack), with its caption and source; otherwise a PHOTO NEEDED slot.
   * Annotations are drawn in the photo's own pixel space (meta.w x meta.h), so
   * they stay on the right spot at any size.
   */
  function photo(id, { need = '', alt = '', annotations = [] } = {}) {
    if (has(id)) {
      const m = meta[id] || {};
      const credit = m.private ? `Private reference: ${m.source || 'book figure'}. Not for sharing.` : m.credit || '';
      return `<figure class="photo-slot has-photo${m.private ? ' is-private' : ''}" data-photo="${P.util.esc(id)}"><div class="photo-frame"><img src="${src(id)}" alt="${P.util.esc(alt)}" loading="lazy" decoding="async" onerror="this.closest('figure').classList.add('photo-broken')">${m.w && m.h ? annotate(annotations, m.w, m.h) : ''}</div>
        ${m.caption || credit ? `<figcaption>${m.caption ? `<span>${P.util.esc(m.caption)}</span>` : ''}${credit ? `<small>${P.util.esc(credit)}</small>` : ''}</figcaption>` : ''}</figure>`;
    }
    return `<figure class="photo-slot needs-photo" data-photo-needed="${P.util.esc(id)}">
      <span class="tape-strip" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>
      <figcaption><b>PHOTO NEEDED</b><span>${P.util.esc(need)}</span><small>Only a real photo of this exact position will go here.</small></figcaption></figure>`;
  }

  /** SVG annotations; coordinates in % of the photo, drawn in its pixel space. */
  function annotate(list, w = 100, h = 100) {
    if (!list?.length) return '';
    const X = (v) => (v * w) / 100, Y = (v) => (v * h) / 100;
    const fs = Math.round(w / 17);
    const t = (x, y, label, anchor = 'start') => `<text x="${X(x)}" y="${Y(y)}" text-anchor="${anchor}" style="font-size:${fs}px">${P.util.esc(label)}</text>`;
    const parts = list.map((a) => {
      if (a.type === 'arrow') return `<line x1="${X(a.from[0])}" y1="${Y(a.from[1])}" x2="${X(a.to[0])}" y2="${Y(a.to[1])}" marker-end="url(#ann-head)"/>${a.label ? t(a.from[0], a.from[1] + 4, a.label, a.anchor) : ''}`;
      if (a.type === 'path') return `<polyline points="${a.points.map((pt) => `${X(pt[0])},${Y(pt[1])}`).join(' ')}" stroke-dasharray="${fs / 2} ${fs / 3}"/>${a.points.map((pt) => `<circle cx="${X(pt[0])}" cy="${Y(pt[1])}" r="${fs / 4}" class="dot"/>`).join('')}${a.label ? t(a.at?.[0] ?? a.points[0][0], a.at?.[1] ?? a.points[0][1], a.label, a.anchor) : ''}`;
      if (a.type === 'circle') return `<circle cx="${X(a.at[0])}" cy="${Y(a.at[1])}" r="${X(a.r || 6)}"/>${a.label ? t(a.at[0] + (a.r || 6) + 1, a.at[1], a.label, a.anchor) : ''}`;
      if (a.type === 'label') return t(a.at[0], a.at[1], a.label, a.anchor);
      return '';
    }).join('');
    return `<svg class="annot" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="--sw:${Math.max(2, w / 110)}px"><defs><marker id="ann-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>${parts}</svg>`;
  }

  /** Paul's own photos for one step of a custom lesson (data URIs, stored with the exercise). */
  function photoSet(list, alt = '') {
    const ok = (list || []).filter((x) => /^data:image\/(webp|jpeg|png);base64,/.test(x));
    if (!ok.length) return '';
    return `<figure class="photo-slot has-photo photo-set${ok.length > 1 ? ' photo-multi' : ''}" data-photo-set="${ok.length}"><div class="photo-grid">${ok.map((x, i) => `<img src="${x}" alt="${P.util.esc(alt)}${ok.length > 1 ? ` (${i + 1} of ${ok.length})` : ''}" decoding="async">`).join('')}</div><figcaption><small>Photo by Paul</small></figcaption></figure>`;
  }

  P.art = { MOODS, RECIPES, paulino, photo, photoSet, annotate, src, has, loadManifest, importPack, clearPack, packCount, files, meta };
})(window.Paulino);
</script>
<script>
/* ===== 9. ui ============================================================== */
(function (P) {
  const { html, raw, esc, on, fmtKg, fmtDate } = P.util;
  const { LINES } = P.data;
  const UI = {};

  // ---- palettes ----
  UI.PALETTES = [
    { id: 'legday', name: 'NEVER SKIP LEG DAY', bg: '#F5EFE3', accent: '#F4B942', ink: '#141414' },
    { id: 'brace', name: 'BRACE! BRACE! BRACE!', bg: '#F5F0E6', accent: '#F47B20', ink: '#171717' },
    { id: 'protein', name: 'PROTEIN PANIC', bg: '#FAF1E4', accent: '#EF6497', ink: '#1F1F23' },
    { id: 'floor', name: 'PUSH THE FLOOR', bg: '#F3EDDC', accent: '#169E96', ink: '#1D3F8F' },
    { id: 'deeper', name: 'GO DEEPER!', bg: '#EDE2CC', accent: '#C8342A', ink: '#141414' },
  ];
  const OLD_PALETTES = { original: 'legday', pink: 'protein', teal: 'floor', blue: 'floor' };   // names before v2.1
  UI.applyPalette = (id = P.store.pref.get('palette', 'legday')) => {
    const p = UI.PALETTES.find((x) => x.id === (OLD_PALETTES[id] || id)) || UI.PALETTES[0];
    document.documentElement.dataset.palette = p.id;
    document.querySelector('meta[name=theme-color]')?.setAttribute('content', p.bg);
  };
  UI.paletteCard = () => {
    const cur = document.documentElement.dataset.palette;
    return html`<div class="card"><h2>Colours</h2><div class="palettes" role="group" aria-label="Colour palette">
      ${UI.PALETTES.map((p) => html`<button type="button" class="pal" data-pal="${p.id}" aria-pressed="${p.id === cur}" style="background:${p.bg}"><span class="sw"><i style="background:${p.bg}"></i><i style="background:${p.accent}"></i><i style="background:${p.ink}"></i></span>${p.name}</button>`)}
    </div></div>`;
  };

  // ---- Paulino ----
  const registry = new Map();
  let counter = 0;
  UI.linesFor = (mood, ctx) => { const g = LINES[mood] || {}; return g[ctx] || Object.values(g).flat(); };
  /**
   * Weighted random line for `key`; never the same line twice in a row (and,
   * with enough lines, not one of the last two). Lines: string or { t, w }.
   */
  const recent = new Map();
  UI.pick = (key, lines) => {
    const items = (lines || []).map((l) => (typeof l === 'string' ? { t: l, w: 1 } : { t: l.t, w: l.w ?? 1 })).filter((l) => l.t);
    if (!items.length) return '';
    const last = recent.get(key) || [];
    const k = items.length > 3 ? 2 : items.length > 1 ? 1 : 0;
    const avoid = new Set(k ? last.slice(-k) : []);   // slice(-0) would be everything
    const pool = items.filter((l) => !avoid.has(l.t));
    const total = pool.reduce((a, l) => a + l.w, 0);
    let r = Math.random() * total;
    let pick = pool[pool.length - 1];
    for (const l of pool) { r -= l.w; if (r < 0) { pick = l; break; } }
    recent.set(key, [...last, pick.t].slice(-3));
    return pick.t;
  };
  const art = (mood, size = 'md') => P.art.paulino(mood, { size });
  /** Template D: small face cut-out on paper, for inline coaching. */
  UI.face = (mood) => P.art.paulino(mood, { size: 'xs' });
  /** Mascot + speech bubble. Tap either for another line. */
  /** bubble: 'cloud' (default) | 'burst' (shouting) | 'callout' (magazine caption). */
  UI.mascot = ({ mood = 'motivated', context = 'home', lines = null, text = null, size = 'md', layout = 'side', still = false, key = null, bubble = null } = {}) => {
    const id = `pl${++counter}`;
    const list = lines || UI.linesFor(mood, context);
    const k = key || `${mood}.${context}`;
    const first = text || UI.pick(k, list);
    registry.set(id, { lines: list, key: k });
    const shout = first.length < 34 && /[!?]$/.test(first);
    const variant = bubble || (size === 'lg' && (mood === 'celebrating' || mood === 'disappointed') ? 'burst' : 'cloud');
    return raw(`<div class="paulino paulino-${size} layout-${layout} mood-${mood} bubble-${variant}${still ? ' still' : ''}" data-paulino="${id}">
      <button type="button" class="paulino-figure" data-paulino-next aria-label="Paulino. Tap for another tip">${art(mood, size)}</button>
      <button type="button" class="bubble${shout ? ' shout' : ''}" data-paulino-next aria-live="polite"><span class="bubble-text">${esc(first)}</span></button></div>`);
  };
  UI.bindMascots = (root) => on(root, 'click', '[data-paulino-next]', (e, el) => {
    const box = el.closest('[data-paulino]');
    const entry = registry.get(box?.dataset.paulino);
    if (!entry) return;
    const line = UI.pick(entry.key, entry.lines);
    box.querySelector('.bubble-text').textContent = line;
    box.querySelector('.bubble').classList.toggle('shout', line.length < 34 && /[!?]$/.test(line));
    if (!box.classList.contains('still')) { box.classList.remove('bounce'); void box.offsetWidth; box.classList.add('bounce'); }
  });
  /** Floating reaction at the bottom of the screen. */
  UI.react = (mood, text, ms = 3600) => {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'reaction';
    el.setAttribute('role', 'status');
    el.innerHTML = String(UI.mascot({ mood, text, size: 'sm', still: true }));
    root.appendChild(el);
    const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
    el.addEventListener('click', close);
    setTimeout(close, ms);
  };

  // ---- layout ----
  UI.logo = (small = false) => raw(`<span class="logo${small ? ' logo-sm' : ''}" aria-label="Paulino"><span class="logo-tape"></span><span class="logo-word">PAULINO</span></span>`);
  UI.topBar = ({ title = '', sub = '', back = null, right = '' } = {}) => html`<header class="topbar">
    ${back ? html`<button class="icon-btn" data-action="back" data-fallback="${back}" aria-label="Back">←</button>` : html`<a class="topbar-logo" href="#/" aria-label="Paulino home">${UI.logo(true)}</a>`}
    <div class="topbar-title">${title ? html`<h1>${title}</h1>` : ''}${sub ? html`<p class="topbar-sub">${sub}</p>` : ''}</div>
    <div class="topbar-right">${raw(String(right))}</div></header>`;
  const svg = (d) => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  UI.ICONS = {
    home: svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
    program: svg('<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16M8 14h3M8 17h6"/>'),
    progress: svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
    library: svg('<path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l4 1-3 14-4-1z"/>'),
    academy: svg('<path d="M2 9l10-5 10 5-10 5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5M22 9v6"/>'),
    settings: svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7"/>'),
    share: svg('<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/>'),
    copy: svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>'),
    up: svg('<path d="M6 15l6-6 6 6"/>'),
    down: svg('<path d="M6 9l6 6 6-6"/>'),
    trash: svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    dup: svg('<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V4h12"/>'),
    more: svg('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
    bolt: svg('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'),
    trophy: svg('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>'),
    timer: svg('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>'),
    bell: svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>'),
    close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    file: svg('<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3"/>'),
    print: svg('<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/>'),
    edit: svg('<path d="M4 20h4L20 8l-4-4L4 16z"/>'),
    magic: svg('<path d="M4 20L16 8M14 4l1 2 2 1-2 1-1 2-1-2-2-1 2-1zM19 11l.7 1.3L21 13l-1.3.7L19 15l-.7-1.3L17 13l1.3-.7z"/>'),
  };

  // ---- chart: heaviest set per session (+ estimated 1RM, dashed) ----
  // Colours checked with the dataviz palette validator (#285BC7 / #C7306B):
  // lightness, chroma, colour-blind separation and contrast all pass; the
  // estimate line is also dashed so identity never relies on colour alone.
  UI.SERIES = { top: '#285BC7', e1rm: '#C7306B' };
  UI.liftChart = (points) => {
    if (!points.length) return '<p class="muted">No completed sets for this exercise yet.</p>';
    const W = 340, H = 190, L = 38, R = 44, T = 12, B = 26;
    const vals = points.flatMap((p) => [p.top, p.e1rm]).filter((v) => v !== null && v !== undefined);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (lo === hi) { lo -= 5; hi += 5; }
    const step = [2.5, 5, 10, 20, 25, 50, 100].find((s) => (hi - lo) / s <= 4) || 100;
    lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
    if (hi === lo) hi = lo + step;
    const x = (i) => (points.length === 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (points.length - 1));
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const grid = Array.from({ length: Math.round((hi - lo) / step) + 1 }, (_, i) => lo + i * step);
    const line = (k, dash) => { const pts = points.map((p, i) => (p[k] == null ? null : `${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`)).filter(Boolean); return pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${UI.SERIES[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${dash ? 'stroke-dasharray="6 4"' : ''}/>` : ''; };
    const dots = (k) => points.map((p, i) => (p[k] == null ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(p[k]).toFixed(1)}" r="4.5" fill="${k === 'top' ? UI.SERIES[k] : 'var(--paper)'}" stroke="${k === 'top' ? 'var(--paper)' : UI.SERIES[k]}" stroke-width="2"/>`)).join('');
    const last = points[points.length - 1];
    const data = esc(JSON.stringify(points.map((p, i) => ({ x: x(i), d: fmtDate(p.date, { weekday: false }), top: p.top, reps: p.reps, e: p.e1rm }))));
    return `<div class="chart-wrap">
      <div class="legend"><span><i style="background:${UI.SERIES.top}"></i>Heaviest set (kg)</span><span><i style="background:repeating-linear-gradient(90deg,${UI.SERIES.e1rm} 0 5px,transparent 5px 8px);border-color:${UI.SERIES.e1rm}"></i>Estimated 1RM (kg)</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight per session, ${points.length} sessions" data-chart='${data}'>
        ${grid.map((g) => `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--ink)" stroke-opacity=".12"/><text x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${fmtKg(g)}</text>`).join('')}
        <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--ink)" stroke-width="2"/>
        ${line('e1rm', true)}${line('top')}${dots('e1rm')}${dots('top')}
        <text x="${x(points.length - 1) + 8}" y="${y(last.top) + 4}" style="fill:var(--ink);font-weight:700">${fmtKg(last.top)}</text>
        <text x="${L}" y="${H - 6}">${esc(fmtDate(points[0].date, { weekday: false }))}</text>
        ${points.length > 1 ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmtDate(last.date, { weekday: false }))}</text>` : ''}
        <line data-cross x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-dasharray="3 3" visibility="hidden"/>
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
      </svg><div class="chart-tip" data-tip hidden></div></div>`;
  };
  UI.bindCharts = (root) => {
    const move = (e) => {
      const s = e.target.closest?.('svg[data-chart]');
      if (!s) return;
      const pts = JSON.parse(s.dataset.chart);
      const box = s.getBoundingClientRect();
      const cx = ((e.clientX - box.left) / box.width) * s.viewBox.baseVal.width;
      const b = pts.reduce((a, p) => (Math.abs(p.x - cx) < Math.abs(a.x - cx) ? p : a), pts[0]);
      const c = s.querySelector('[data-cross]');
      c.setAttribute('x1', b.x); c.setAttribute('x2', b.x); c.setAttribute('visibility', 'visible');
      const tip = s.parentElement.querySelector('[data-tip]');
      tip.hidden = false;
      tip.innerHTML = `<b>${esc(b.d)}</b><br>Heaviest: ${fmtKg(b.top)} kg × ${b.reps}${b.e ? `<br>Est. 1RM: ${fmtKg(b.e)} kg` : ''}`;
      tip.style.left = `${Math.min(Math.max(0, (b.x / s.viewBox.baseVal.width) * box.width - 70), box.width - 150)}px`;
    };
    const leave = (e) => { const s = e.target.closest?.('svg[data-chart]'); if (!s) return; s.querySelector('[data-cross]').setAttribute('visibility', 'hidden'); s.parentElement.querySelector('[data-tip]').hidden = true; };
    root.addEventListener('pointermove', move);
    root.addEventListener('pointerdown', move);
    root.addEventListener('pointerleave', leave, true);
    return () => { root.removeEventListener('pointermove', move); root.removeEventListener('pointerdown', move); root.removeEventListener('pointerleave', leave, true); };
  };

  // ---- rest timer (absolute end time in localStorage: survives reloads) ----
  UI.mountTimer = (el) => {
    const read = () => P.store.pref.get('timer', { duration: 120, endsAt: null, remaining: 120, running: false, label: '' });
    const prefs = () => P.store.pref.get('timer.prefs', { auto: true, sound: true });
    let s = read(), tick = null, fired = false;
    const remaining = () => (s.running && s.endsAt ? Math.ceil((s.endsAt - Date.now()) / 1000) : s.remaining);
    const fmt = (sec) => `${Math.floor(Math.max(0, sec) / 60)}:${String(Math.max(0, sec) % 60).padStart(2, '0')}`;
    let audio = null;
    const beep = () => {
      try {
        audio ||= new (window.AudioContext || window.webkitAudioContext)();
        const t0 = audio.currentTime;
        [0, 0.22, 0.44].forEach((d, i) => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = i === 2 ? 1046 : 784; g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.25, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18); o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + 0.2); });
      } catch { /* no audio */ }
    };
    const draw = () => {
      const r = remaining();
      const over = s.running && r <= 0;
      el.innerHTML = `<div class="timer-bar" role="timer" aria-label="Rest timer">
        <div class="t-main"><span class="t-time${over ? ' ring' : ''}" data-t>${over ? 'GO!' : fmt(r)}</span><span class="t-label">${s.running ? (over ? 'Rest is over' : 'Resting') : 'Rest timer'}${s.label ? ` · ${esc(s.label)}` : ''}</span></div>
        <button class="icon-btn" data-t="-" aria-label="15 seconds less">−</button>
        <button class="icon-btn" data-t="+" aria-label="15 seconds more">+</button>
        <button class="icon-btn" data-t="go" aria-label="${s.running ? 'Pause' : 'Start'} rest timer">${s.running ? '❚❚' : '▶'}</button>
        <button class="icon-btn" data-t="reset" aria-label="Reset rest timer">↺</button>
        <button class="icon-btn" data-t="bell" aria-pressed="${prefs().sound}" aria-label="Sound when rest is over">${UI.ICONS.bell}</button></div>`;
    };
    const loop = () => {
      clearInterval(tick);
      if (!s.running) return;
      tick = setInterval(() => {
        const r = remaining();
        const t = el.querySelector('[data-t]');
        if (t && t.tagName === 'SPAN') { t.textContent = r <= 0 ? 'GO!' : fmt(r); t.classList.toggle('ring', r <= 0); }
        if (r <= 0 && !fired) { fired = true; if (prefs().sound) beep(); try { navigator.vibrate?.([200, 100, 200]); } catch { /* */ } draw(); }
        if (r < -90) { s = { ...s, running: false, endsAt: null, remaining: s.duration }; P.store.pref.set('timer', s); draw(); clearInterval(tick); }
      }, 250);
    };
    const save = () => { P.store.pref.set('timer', s); draw(); loop(); };
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-t]');
      if (!b) return;
      const a = b.dataset.t;
      if (a === 'go') {
        if (s.running) s = { ...s, running: false, remaining: Math.max(0, remaining()), endsAt: null };
        else { const r = s.remaining > 0 ? s.remaining : s.duration; s = { ...s, running: true, endsAt: Date.now() + r * 1000 }; fired = false; }
      } else if (a === 'reset') s = { ...s, running: false, endsAt: null, remaining: s.duration };
      else if (a === '+' || a === '-') {
        const d = a === '+' ? 15 : -15;
        if (s.running) s = { ...s, endsAt: Math.max(Date.now(), s.endsAt + d * 1000) };
        else s = { ...s, remaining: Math.max(0, s.remaining + d), duration: Math.max(15, s.duration + d) };
      } else if (a === 'bell') { P.store.pref.set('timer.prefs', { ...prefs(), sound: !prefs().sound }); }
      save();
    });
    draw(); loop();
    return {
      start(seconds = s.duration, label = '') { s = { duration: seconds, remaining: seconds, endsAt: Date.now() + seconds * 1000, running: true, label }; fired = false; save(); },
      destroy() { clearInterval(tick); },
      prefs,
    };
  };

  P.ui = UI;
})(window.Paulino);

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let io = null;
    if (!reduce && 'IntersectionObserver' in window) {
      io = new IntersectionObserver((ents) => ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.15 });
      steps.forEach((s) => io.observe(s));
    } else steps.forEach((s) => s.classList.add('in'));
    const rail = root.querySelector('[data-rail]');
    const onScroll = () => {
      if (!rail) return;
      const el = scroller === window ? document.documentElement : scroller;
      const h = el.scrollHeight - el.clientHeight;
      const y = scroller === window ? scrollY : scroller.scrollTop;
      rail.style.width = `${h > 0 ? Math.min(100, (y / h) * 100) : 0}%`;
    };
    scroller.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { scroller.removeEventListener('scroll', onScroll); io?.disconnect(); };
  }

  A.preview = (def) => new Promise((resolve) => {

    const esc = (e) => { if (e.key === 'Escape') close(); };

  // ---------------------------------------------------------------- library
  Paul.library = async (root, app) => {
    const list = await S.all('paul');
    let sort = S.pref.get('paul.sort', 'updated');
    const sorted = () => [...list].sort((a, b) => sort === 'name' ? a.name.localeCompare(b.name)
      : sort === 'athlete' ? (a.athlete || '~').localeCompare(b.athlete || '~') || a.name.localeCompare(b.name)
      : sort === 'created' ? String(b.createdAt).localeCompare(String(a.createdAt))
      : String(b.updatedAt).localeCompare(String(a.updatedAt)));
    const draw = () => {
      root.innerHTML = String(html`<div class="page no-nav stack">
        ${UI.topBar({ title: 'Saved programs', right: '<a class="btn btn-sm btn-ghost" href="#/settings">Settings</a>' })}
        <div class="btn-row"><button class="btn btn-lg" data-new>${raw(I.plus)} New program</button><button class="btn btn-ghost" data-import>${raw(I.file)} Import .paulino</button></div>
        ${list.length ? html`<div class="row-between"><h2 style="margin:0">${list.length} saved</h2>
          <label class="inline-label">Sort <select data-sort>${[['updated', 'Last edited'], ['name', 'Name'], ['athlete', 'Athlete'], ['created', 'Created']].map(([k, l]) => html`<option value="${k}" ${k === sort ? raw('selected') : ''}>${l}</option>`)}</select></label></div>
          <div class="stack-sm">${sorted().map((p) => html`<div class="card list-card" data-program="${p.id}">
            <a class="grow plain" href="#/paul/p/${p.id}"><h3>${p.name}</h3>
              <p>${p.athlete ? html`for <b>${p.athlete}</b> · ` : ''}${p.weeks.length} ${p.weeks.length === 1 ? 'week' : 'weeks'} · starts ${fmtDate(p.startDate, { weekday: false })}<br><span class="small">created ${fmtDate(String(p.createdAt).slice(0, 10), { weekday: false, year: true })}</span></p></a>
            <div class="tools"><button class="icon-btn sq" data-share="${p.id}" aria-label="Share ${p.name}">${raw(I.share)}</button><button class="icon-btn sq" data-menu="${p.id}" aria-label="More actions for ${p.name}">${raw(I.more)}</button></div>
          </div>`)}</div>`
        : html`<div class="card card-accent"><h2>No programs yet</h2><p>Create one: build week 1, then let <b>Repeat / Progress</b> fill in the rest.</p></div>`}
        <p class="small muted">Programs are saved in this browser only. Export a backup from Settings to keep them safe.</p>
      </div>`);
    };
    draw();
    const offs = [];
    offs.push(on(root, 'change', '[data-sort]', (e, el) => { sort = el.value; S.pref.set('paul.sort', sort); draw(); }));
    offs.push(on(root, 'click', '[data-new]', async () => { const p = await Paul.createDialog(list); if (p) app.navigate(`/paul/p/${p.id}`); }));
    offs.push(on(root, 'click', '[data-import]', async () => {
      const f = await pickFile();
      if (!f) return;
      try {
        const prog = P.share.fromFile(f.text);
        const existing = list.find((x) => x.id === prog.id);
        if (existing) { prog.id = uid('p'); prog.name = `${prog.name} (imported)`; }
        prog.createdAt = prog.updatedAt = new Date().toISOString();
        await savePaul(prog);
        toast('Imported into your programs.', { kind: 'ok' });
        app.navigate(`/paul/p/${prog.id}`);
      } catch (err) { toast(err.message, { kind: 'error', ms: 6000 }); }
    }));
    offs.push(on(root, 'click', '[data-share]', (e, el) => Paul.shareDialog(list.find((p) => p.id === el.dataset.share), app)));
    offs.push(on(root, 'click', '[data-menu]', async (e, el) => {
      const p = list.find((x) => x.id === el.dataset.menu);
      const a = await sheet({ title: p.name }, (body, close) => {
        body.innerHTML = String(html`<div class="choices">
          <button class="choice-btn" data-a="open">${raw(I.edit)} Open</button>
          <button class="choice-btn" data-a="rename">Rename</button>
          <button class="choice-btn" data-a="dup">${raw(I.dup)} Duplicate</button>
          <button class="choice-btn" data-a="share">${raw(I.share)} Share link / file</button>
          <button class="choice-btn" data-a="file">${raw(I.file)} Download .paulino file</button>
          <button class="choice-btn" data-a="print">${raw(I.print)} Print / PDF</button>
          <button class="choice-btn choice-danger" data-a="delete">${raw(I.trash)} Delete</button></div>`);
        body.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => close(b.dataset.a)));
      });
      if (a === 'open') app.navigate(`/paul/p/${p.id}`);
      if (a === 'rename') { const n = await prompt({ title: 'Rename program', label: 'Program name', value: p.name }); if (n) { p.name = n; await savePaul(p); draw(); } }
      if (a === 'dup') { const c = await Paul.duplicate(p); list.push(c); toast('Duplicated.', { kind: 'ok' }); app.navigate(`/paul/p/${c.id}`); }
      if (a === 'share') Paul.shareDialog(p, app);
