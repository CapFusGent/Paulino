        <div class="ex-meta">${x.rest ? html`<span class="chip">${raw(I.timer)} Rest ${P.paul.restText(x.rest)}</span>` : ''}${x.tempo ? html`<span class="chip">Tempo ${x.tempo}</span>` : ''}${x.sets.some((s) => s.rir !== null && s.rir !== undefined) ? html`<span class="chip">${x.sets.find((s) => s.rir !== null && s.rir !== undefined).rir} reps in reserve</span>` : ''}</div>
        ${x.notes ? html`<p class="paul-note">${x.notes}</p>` : ''}
        ${!x.removed ? html`<button type="button" class="tip" data-cue="${x.id}" aria-label="Paulino's tip, tap for another">
          <span class="tip-face" aria-hidden="true">${raw(UI.face('focused'))}</span><span><b>Paulino:</b> <span data-cue-text>${tip}</span></span></button>
          <div class="set-table"><div class="set-head"><span>Set</span><span>Reps</span><span>${g.bw ? '+kg' : 'kg'}</span><span>Done</span></div>
          ${x.sets.map((s, i) => setRow(x, s, i, entry))}</div>` : ''}
        <div class="btn-row" style="margin-top:12px">${x.mod ? html`<button class="btn btn-sm btn-ghost" data-restore="${x.id}">Restore Paul's plan</button>` : html`<button class="btn btn-sm btn-ghost" data-modify="${x.id}">${raw(I.edit)} Change</button>`}
          ${P.academy.forExercise(x.exerciseId) ? html`<a class="btn btn-sm btn-ghost learn-link" href="#/academy/${P.academy.forExercise(x.exerciseId).id}">${raw(I.program)} Learn the lift</a>` : ''}</div>
      </article>`;
    }

    function counts() {
      const live = items.filter((x) => !x.removed);
      const total = live.reduce((a, x) => a + x.sets.length, 0);
      const done = log ? log.entries.reduce((a, e) => a + e.sets.filter((s) => s.done).length, 0) : 0;
      return { total, done };
    }

    function draw() {
      const c = counts();
      const status = log?.status;
      root.innerHTML = String(html`<div class="page no-nav with-timer">
        <div class="active-top">
          <div class="row-between nowrap"><button class="icon-btn" data-action="back" data-fallback="/a/program" aria-label="Back (progress is saved)">←</button>
            <div class="grow"><h1 class="ellipsis">${day.name}</h1><p class="topbar-sub">${fmtDate(date)} · ${M.weekLabel(prog, wi)}</p></div>
            <span class="counter" data-counter>${c.done}/${c.total} sets</span></div>
          <div class="progress" style="margin-top:8px" role="progressbar" aria-label="Sets completed" aria-valuemin="0" aria-valuemax="${c.total}" aria-valuenow="${c.done}" data-progress><span style="width:${c.total ? (c.done / c.total) * 100 : 0}%"></span></div>
        </div>
        ${items.some((x) => x.sets.some((st) => st.rpe != null || st.rir != null)) ? html`<p class="small muted" style="margin:10px 0 0" data-effort-help><b>RPE</b> = how hard a set should feel (10 = max effort). <b>RIR</b> = reps you could still do.</p>` : ''}
        ${status === 'done' ? html`<p class="notice notice-ok" style="margin-top:14px">Completed. You can still correct your numbers. <a href="#/a/p/${prog.id}/d/${day.id}/done">See results</a></p>` : ''}
        ${status === 'skipped' ? html`<p class="notice" style="margin-top:14px">Skipped (${log.skipReason}). <button class="link-btn" data-unskip>Train it after all</button></p>` : ''}
        ${day.notes ? html`<p class="paul-note" style="margin-top:14px">${day.notes}</p>` : ''}
        ${status !== 'done' && !(log?.entries.some((e) => e.sets.some((s) => s.done))) ? html`<div class="card" style="margin-top:14px">${UI.mascot({ mood: 'motivated', context: 'workout', size: 'sm', still: true })}</div>` : ''}
        ${items.map((x, i) => exCard(x, i + 1))}
        ${!items.length ? html`<div class="card"><p>Rest day: nothing planned.</p></div>` : ''}
        <div class="stack-sm" style="margin-top:24px">
          ${status === 'done' ? html`<a class="btn btn-block btn-lg" href="#/a/p/${prog.id}/d/${day.id}/done">See results</a>` : status === 'skipped' ? '' : html`<button class="btn btn-block btn-lg" data-finish>Finish workout</button>`}
          <button class="btn btn-block btn-ghost" data-pain>Something hurts?</button>
          ${!status || status === 'in_progress' ? html`<button class="btn btn-block btn-ghost" data-skip>Can't train today?</button>` : ''}
        </div>
        <p class="small muted" style="margin-top:14px">Everything you enter is saved on this device as you go.</p>
      </div><div data-timer></div>`);
      timer?.destroy();
      timer = UI.mountTimer(root.querySelector('[data-timer]'));
      markNext();
    }

    function markNext() {
      root.querySelectorAll('.set-row.next').forEach((r) => r.classList.remove('next'));
      if (!log) { root.querySelector('.set-row')?.classList.add('next'); return null; }
      for (const e of log.entries) {
        const i = e.sets.findIndex((s) => !s.done);
        if (i >= 0) { root.querySelector(`[data-set="${e.exId}:${i}"]`)?.classList.add('next'); return { e, i }; }
      }
      return null;
    }
    function refreshCounter() {
      const c = counts();
      root.querySelector('[data-counter]').textContent = `${c.done}/${c.total} sets`;
      const bar = root.querySelector('[data-progress]');
      bar.setAttribute('aria-valuenow', String(c.done));
      bar.querySelector('span').style.width = `${c.total ? (c.done / c.total) * 100 : 0}%`;
    }

    const offs = [];
    const rowInfo = (el) => { const row = el.closest('.set-row'); const [id, i] = row.dataset.set.split(':'); return { row, x: items.find((y) => y.id === id), i: Number(i) }; };
    offs.push(on(root, 'input', '.set-row input', (e, el) => {
      const { row, x, i } = rowInfo(el);
      const v = num(el.value);
      const ok = v === null || (v >= 0 && (el.dataset.f === 'reps' ? Number.isInteger(v) && v <= 200 : v <= 1000));
      el.classList.toggle('invalid', !ok);
      if (!ok) return;
      ensureLog();
      const s = entryFor(x).sets[i];
      s[el.dataset.f] = v;
      persist();
      if (el.dataset.f === 'kg') {
        const target = x.sets[i];
        const heavy = target.kg !== null && target.kg !== undefined && Number(v) > Number(target.kg) + 0.001;
        const w = row.querySelector('[data-heavy]');
        if (heavy && !w) row.insertAdjacentHTML('beforeend', '<span class="inline-warn" data-heavy>Heavier than Paul\'s plan. No ego lifting, champ.</span>');
        if (!heavy && w) w.remove();
      }
    }));
    offs.push(on(root, 'click', '[data-done]', (e, el) => {
      const { row, x, i } = rowInfo(el);
      ensureLog();
      const s = entryFor(x).sets[i];
      s.reps = num(row.querySelector('[data-f=reps]').value);
      s.kg = num(row.querySelector('[data-f=kg]').value);
      s.done = !s.done;
      persist(true);
      el.setAttribute('aria-pressed', String(s.done));
      row.classList.toggle('done', s.done);
      refreshCounter();
      const nx = markNext();
      if (s.done && nx && timer.prefs().auto) timer.start(x.rest || 120, `next: ${exName(nx.e.exerciseId)} set ${nx.i + 1}`);
      if (s.done && !nx) UI.react('happy', 'All sets done! Hit Finish.');
    }));
    offs.push(on(root, 'click', '[data-cue]', (e, el) => {
      const x = items.find((y) => y.id === el.dataset.cue);
      el.querySelector('[data-cue-text]').textContent = UI.pick(`cue.${x.exerciseId}`, cuesFor(x.exerciseId, x.notes));
    }));
    const reload = async () => {
      mods = await modsFor(prog.id);
      items = A.effective(day, mods);
      if (log && log.status !== 'skipped') { log.entries = buildEntries(log.entries); persist(true); }
      draw();
    };
    offs.push(on(root, 'click', '[data-modify]', async (e, el) => {
      const x = items.find((y) => y.id === el.dataset.modify);
      if (await A.modify(prog, day, x)) reload();
    }));
    offs.push(on(root, 'click', '[data-restore]', async (e, el) => {
      const x = items.find((y) => y.id === el.dataset.restore);
      await S.put('mods', { ...x.mod, status: 'reverted', updatedAt: new Date().toISOString() });
      UI.react('happy', UI.pick('happy.restored', UI.linesFor('happy', 'restored')));
      reload();
    }));
    offs.push(on(root, 'click', '[data-pain]', () => A.painFlow(async (end) => {
      ensureLog(); log.pain = true; persist(true);
      if (end) finish(true);
    })));
    offs.push(on(root, 'click', '[data-skip]', async () => {
      const r = await A.skipDialog();
      if (!r) return;
      log = { ...(log || { key, programId: prog.id, dayId: day.id, weekIndex: wi, plannedDate: date, entries: [], startedAt: null, notes: '' }), status: 'skipped', skipReason: r, pain: r === 'pain' || log?.pain || false, completedAt: new Date().toISOString() };
      persist(true);
      UI.react(r === 'illness' || r === 'pain' ? 'concerned' : 'motivated', r === 'illness' ? 'Rest up and get well soon!' : r === 'pain' ? 'Take care. Tell Paul what happened.' : 'No stress. See you next session!');
      draw();
    }));
    offs.push(on(root, 'click', '[data-unskip]', () => { log.status = 'in_progress'; log.skipReason = null; log.completedAt = null; log.entries = buildEntries(log.entries); persist(true); draw(); }));
    offs.push(on(root, 'click', '[data-finish]', () => finish(false)));

    async function finish(pain) {
      ensureLog();
      const c = counts();
      const left = c.total - c.done;
      const res = await sheet({ title: 'Finish workout' }, (body, close) => {
        body.innerHTML = String(html`${left ? html`<p class="notice">${left} ${left === 1 ? 'set is' : 'sets are'} not marked done. That's OK: they're saved as not completed.</p>` : ''}
          <div class="field"><label for="f-notes">Training notes (optional)</label><textarea id="f-notes" rows="3" maxlength="2000" placeholder="How did it feel?">${log.notes || ''}</textarea></div>
          <label class="check"><input type="checkbox" id="f-pain" ${pain || log.pain ? raw('checked') : ''}> I felt pain during this session</label>
          <button class="btn btn-block btn-lg" data-save style="margin-top:12px">Save workout</button>`);
        body.querySelector('[data-save]').onclick = () => close({ notes: body.querySelector('#f-notes').value.trim(), pain: body.querySelector('#f-pain').checked });
      });
      if (!res) return;
      Object.assign(log, { status: 'done', completedAt: new Date().toISOString(), notes: res.notes, pain: res.pain });
      persist(true);
      await S.put('logs', log);
      app.navigate(`/a/p/${prog.id}/d/${day.id}/done`, { replace: true });
    }

    draw();
    if (log?.entries.some((e) => e.sets.some((s) => s.done))) {
      const nx = log.entries.find((e) => e.sets.some((s) => !s.done));
      if (nx) requestAnimationFrame(() => root.querySelector(`[data-item="${nx.exId}"]`)?.scrollIntoView({ block: 'start' }));
    }
    return () => { offs.forEach((f) => f()); timer?.destroy(); if (saveT) { clearTimeout(saveT); if (log) S.put('logs', log); } };
  };

  // ------------------------------------------------------------- local modification (+ Paulino's drama)
  A.REASONS = { preference: 'Just want to', equipment: 'Equipment busy / missing', fatigue: 'Feeling tired or run down', pain: 'Pain or discomfort', other: 'Other' };
  const SAFE = new Set(['fatigue', 'pain']);

  A.modify = async (prog, day, x) => {
    const g = M.gridOf(x);
    const r = await sheet({ title: 'Change this exercise' }, (body, close) => {
      let reason = 'preference';
      body.innerHTML = String(html`<p class="small muted" style="margin-top:0">Paul's plan: <b class="mono">${exName(x.original.exerciseId)} ${M.summarize(x.original.sets)}</b></p>
        <div class="field"><label for="m-ex">Exercise</label><select id="m-ex">${raw(Object.entries(CATEGORIES).map(([c, l]) => `<optgroup label="${esc(l)}">${EXERCISES.filter((e) => e.category === c).map((e) => `<option value="${e.id}"${e.id === x.exerciseId ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}</optgroup>`).join(''))}</select></div>
        <div class="ed-grid3">
          <div class="field"><label for="m-sets">Sets</label><input id="m-sets" type="number" inputmode="numeric" min="1" max="30" value="${g.sets}"></div>
          <div class="field"><label for="m-reps">Reps</label><input id="m-reps" type="number" inputmode="numeric" min="1" max="100" value="${g.reps ?? ''}" placeholder="${g.reps ? '' : 'mixed'}"></div>
          <div class="field"><label for="m-kg">kg</label><input id="m-kg" type="number" inputmode="decimal" min="0" max="1000" step="0.5" value="${g.mixedKg ? '' : g.kg ?? ''}" placeholder="${g.mixedKg ? 'mixed' : g.bw ? 'BW' : ''}"></div>
        </div>
        <fieldset class="field plain-fieldset"><legend class="label">Why?</legend><div class="choices">${Object.entries(A.REASONS).map(([k, l]) => html`<button type="button" class="choice-btn" data-reason="${k}" aria-pressed="${k === reason}">${l}</button>`)}</div></fieldset>
        <p class="field-error" data-err hidden></p>
        <div class="btn-row"><button class="btn" data-save>Save change</button><button class="btn btn-ghost" data-remove>Skip this exercise today</button></div>
        <p class="small muted">Just doing fewer reps or less weight in a set? No need to change anything: type what you did in the set rows.</p>`);
      body.querySelectorAll('[data-reason]').forEach((b) => (b.onclick = () => { reason = b.dataset.reason; body.querySelectorAll('[data-reason]').forEach((y) => y.setAttribute('aria-pressed', String(y === b))); }));
      const err = (m) => { const e = body.querySelector('[data-err]'); e.textContent = m; e.hidden = false; };
      body.querySelector('[data-save]').onclick = () => {
        const n = num(body.querySelector('#m-sets').value), reps = num(body.querySelector('#m-reps').value), kg = num(body.querySelector('#m-kg').value);
        if (!Number.isInteger(n) || n < 1 || n > 30) return err('Sets must be 1–30.');
        if (reps !== null && (!Number.isInteger(reps) || reps < 1 || reps > 100)) return err('Reps must be 1–100.');
        if (kg !== null && (kg < 0 || kg > 1000)) return err('Weight must be 0–1000 kg.');
        const sets = Array.from({ length: n }, (_, i) => {
          const b = clone(x.sets[Math.min(i, x.sets.length - 1)]);
          if (reps !== null) b.reps = reps;
          if (kg !== null) { b.kg = kg; if (!kg && b.bw) b.kg = null; }
          return b;
        });
        close({ removed: false, exerciseId: body.querySelector('#m-ex').value, sets, reason });
      };
      body.querySelector('[data-remove]').onclick = () => close({ removed: true, reason });
    });
    if (!r) return false;
    const orig = x.original;
    const modified = r.removed ? { removed: true, exerciseId: orig.exerciseId, sets: orig.sets } : { removed: false, exerciseId: r.exerciseId, sets: r.sets };
    // classify against Paul's original
    let type = null;
    if (modified.removed) type = 'remove';
    else if (modified.exerciseId !== orig.exerciseId) type = 'replace';
    else if (modified.sets.length !== orig.sets.length) type = 'sets';
    else if (modified.sets.some((s, i) => s.reps !== orig.sets[i].reps)) type = 'reps';
    else if (modified.sets.some((s, i) => (s.kg ?? 0) > (orig.sets[i].kg ?? 0))) type = 'load_up';
    else if (modified.sets.some((s, i) => (s.kg ?? 0) < (orig.sets[i].kg ?? 0))) type = 'load_down';
    if (!type) {
      if (x.mod) { await S.put('mods', { ...x.mod, status: 'reverted', updatedAt: new Date().toISOString() }); UI.react('happy', UI.pick('happy.restored', UI.linesFor('happy', 'restored'))); return true; }
      UI.react('happy', "Same as Paul's plan. Nothing to change!");
      return false;
    }
    const structural = type !== 'load_down';
    let go = true;
    if (SAFE.has(r.reason)) go = await supportive(r.reason);
    else if (structural) go = await drama(type, orig, modified);
    else UI.react('concerned', 'Lighter today is fine. Log what you actually lift.', 4000);
    if (!go) { UI.react('happy', UI.pick('happy.restored', UI.linesFor('happy', 'restored'))); return false; }
    const now = new Date().toISOString();
    await S.put('mods', { key: modKey(prog.id, x.id), programId: prog.id, dayId: day.id, exId: x.id, type, reason: r.reason, original: { exerciseId: orig.exerciseId, sets: clone(orig.sets) }, modified, status: 'active', createdAt: x.mod?.createdAt || now, updatedAt: now });
    if (!SAFE.has(r.reason) && structural) UI.react('disappointed', UI.pick('disappointed.after', UI.linesFor('disappointed', 'after')), 4200);
    else if (SAFE.has(r.reason)) UI.react('concerned', 'Saved. Tell Paul how it feels.');
    return true;
  };

  const TYPE_TEXT = { remove: 'Skipping an exercise', replace: 'Swapping the exercise', sets: 'Changing the number of sets', reps: 'Changing the target reps', load_up: "Going heavier than Paul's plan" };
  function drama(type, orig, mod) {
    const ctx = type === 'sets' ? 'sets' : type === 'replace' ? 'replace' : 'deviate';
    return sheet({ className: 'sheet-drama', label: 'Paulino is disappointed', dismissable: false }, (body, close) => {
      body.innerHTML = String(html`${UI.mascot({ mood: 'disappointed', context: ctx, size: 'lg', layout: 'stack' })}
        <div class="card" style="margin-top:14px"><p style="margin:0 0 6px"><b>${TYPE_TEXT[type]}: that's not Paul's plan.</b></p>
          <p class="small mono" style="margin:0"><span class="orig">${exName(orig.exerciseId)} ${M.summarize(orig.sets)}</span><br>→ ${mod.removed ? 'skipped today' : `${exName(mod.exerciseId)} ${M.summarize(mod.sets)}`}</p>
          <p class="small muted" style="margin:8px 0 0">Saved only on this device. Paul's original stays untouched, and you can restore it any time.</p></div>
        <div class="stack-sm" style="margin-top:16px"><button class="btn btn-block btn-lg" data-keep>Keep Paul's plan</button><button class="btn btn-block btn-ghost" data-anyway>Change anyway</button></div>`);
      body.querySelector('[data-keep]').onclick = () => close(false);
      body.querySelector('[data-anyway]').onclick = () => close(true);
    });
  }
  function supportive(reason) {
    return sheet({ title: reason === 'pain' ? 'Listen to your body' : 'Adjusting for today', label: 'Paulino checks in' }, (body, close) => {
      body.innerHTML = String(html`${UI.mascot({ mood: 'concerned', context: reason === 'pain' ? 'pain' : 'fatigue', size: 'md' })}
        ${reason === 'pain' ? html`<div class="notice notice-danger" style="margin-top:14px"><p style="margin:0 0 6px">${SAFETY.painStop}</p><p style="margin:0">${SAFETY.painContact}</p></div>` : html`<p style="margin-top:14px">Good call adjusting when you feel run down. Paul would rather you train smart than get hurt.</p>`}
        <div class="btn-row" style="margin-top:14px"><button class="btn" data-ok>Save this change</button><button class="btn btn-ghost" data-cancel>Keep Paul's plan</button></div>`);
      body.querySelector('[data-ok]').onclick = () => close(true);
      body.querySelector('[data-cancel]').onclick = () => close(false);
    });
  }

  A.painFlow = async (onSharp) => {
    const c = await sheet({ title: 'Something hurts?', label: 'Pain check' }, (body, close) => {
      body.innerHTML = String(html`${UI.mascot({ mood: 'concerned', context: 'pain', size: 'sm', still: true })}<div class="choices" style="margin-top:14px">
        <button class="choice-btn" data-c="sore">Muscle soreness or tiredness<small>Dull, general, about 3/10 or less</small></button>
        <button class="choice-btn" data-c="sharp">Sharp, strong or worsening pain<small>Or something feels wrong in a joint</small></button></div>`);
      body.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => close(b.dataset.c)));
    });
    if (c === 'sore') {
      await sheet({ title: 'Soreness' }, (body, close) => {
        body.innerHTML = String(html`<p>${SAFETY.soreness} Keep the reps clean. If it gets sharper or worse, stop.</p><p class="small muted">Lighter weight or fewer reps is fine: just log what you actually did.</p><button class="btn btn-block" data-ok>Got it</button>`);
        body.querySelector('[data-ok]').onclick = () => close();
      });
    } else if (c === 'sharp') {
      const r = await sheet({ title: 'Stop and look after it' }, (body, close) => {
        body.innerHTML = String(html`<div class="notice notice-danger"><p style="margin:0 0 8px">${SAFETY.painStop}</p><p style="margin:0">${SAFETY.painContact}</p></div>
          <div class="stack-sm" style="margin-top:12px"><button class="btn btn-block" data-end>End the workout here</button><button class="btn btn-block btn-ghost" data-cont>Stop that exercise, continue with others</button></div>`);
        body.querySelector('[data-end]').onclick = () => close('end');
        body.querySelector('[data-cont]').onclick = () => close('cont');
      });
      if (r) onSharp(r === 'end');
    }
  };

  A.skipDialog = () => sheet({ title: "Can't train today?", label: 'Skip workout' }, (body, close) => {
    body.innerHTML = String(html`${UI.mascot({ mood: 'concerned', context: 'skip', size: 'sm', still: true })}<div class="choices" style="margin-top:14px">
      <button class="choice-btn" data-s="illness">I'm sick<small>Rest and recover. That's part of training.</small></button>
      <button class="choice-btn" data-s="pain">Something hurts<small>Better safe than sorry.</small></button>
      <button class="choice-btn" data-s="schedule">No time today</button>
      <button class="choice-btn" data-s="other">Other reason</button></div>`);
    body.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => close(b.dataset.s)));
  });

  // ------------------------------------------------------------- results
  A.results = async (root, app, params) => {
    const prog = await S.get('athlete', params.id);
    const found = prog && M.findDay(prog, params.dayId);
    const log = await S.get('logs', logKey(params.id, params.dayId));
    if (!found || !log || log.status !== 'done') { app.navigate(`/a/p/${params.id}/d/${params.dayId}`, { replace: true }); return; }
    const logs = await allLogs();
    const prs = St.records(logs).events.filter((e) => e.logKey === log.key);
    const mods = (await modsFor(prog.id));
    const changed = found.day.exercises.filter((e) => mods[e.id]).length;
    const vol = St.volume(log);
    const pain = log.pain;
    const confetti = pain ? '' : Array.from({ length: 18 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${['var(--accent)', 'var(--pop-1)', 'var(--pop-2)', 'var(--pop-3)'][i % 4]};animation-delay:${(i % 6) * 0.12}s;border-radius:${i % 3 ? '2px' : '50%'}"></i>`).join('');
    root.innerHTML = String(html`<div class="page no-nav stack">
      ${UI.topBar({ title: 'Results', back: '/a/program' })}
      <section class="celebrate"><div class="burst" aria-hidden="true">${raw(confetti)}</div>
        ${UI.mascot({ mood: pain ? 'concerned' : 'celebrating', context: pain ? 'pain' : prs.length ? 'pr' : 'finish', size: 'lg', layout: 'stack' })}
        <h1 style="margin-top:14px">${pain ? 'Session logged' : 'Session done!'}</h1><p class="muted">${found.day.name} · ${M.weekLabel(prog, found.wi)}</p></section>
      ${pain ? html`<div class="notice notice-danger">You reported pain. Rest it and tell Paul what happened. If it's severe or getting worse, get it checked by a professional.</div>` : ''}
      <div class="stats">
        <div class="stat"><div class="stat-label">${raw(I.check)} Sets</div><div class="stat-value">${St.setsDone(log)}<small>/${St.setsTotal(log)}</small></div></div>
        <div class="stat"><div class="stat-label">${raw(I.program)} Exercises</div><div class="stat-value">${log.entries.filter((e) => e.sets.some((s) => s.done)).length}<small>/${log.entries.length}</small></div></div>
        <div class="stat"><div class="stat-label">${raw(I.progress)} Volume</div><div class="stat-value">${vol ? fmtKg(Math.round(vol)) : '–'} <small>${vol ? 'kg' : ''}</small></div></div>
        <div class="stat"><div class="stat-label">${raw(I.trophy)} PRs</div><div class="stat-value">${prs.length}</div></div>
      </div>
      ${prs.length ? html`<div class="card"><h2>New personal records</h2><ul class="pr-list">${prs.map((p) => html`<li class="pr-item">${raw(I.trophy)}<span class="grow"><b>${exName(p.exerciseId)}</b><br><span class="mono small">${p.kind === 'reps' ? `${p.reps} reps` : `${fmtKg(p.kg)} kg × ${p.reps}`}${p.kind === 'e1rm' ? ` · est. 1RM ${fmtKg(p.value)} kg` : ''}</span></span></li>`)}</ul></div>` : ''}
      <div class="card"><h2>What you did</h2>
        ${log.entries.map((e) => html`<div class="res-ex"><b>${exName(e.exerciseId)}</b>
          <table class="cmp"><thead><tr><th>Set</th><th>Paul</th><th>You</th></tr></thead><tbody>
          ${e.sets.map((s, i) => { const t = e.target[i] || {}; const diff = s.done && (s.reps !== t.reps || (t.kg !== null && t.kg !== undefined && Number(s.kg) !== Number(t.kg))); return html`<tr class="${!s.done ? 'miss' : diff ? 'diff' : ''}"><td>${i + 1}</td><td>${t.reps} × ${M.loadText(t)}</td><td>${s.done ? `${s.reps ?? '?'} × ${t.bw && !s.kg ? 'BW' : `${fmtKg(s.kg)} kg`}` : 'not done'}</td></tr>`; })}
          </tbody></table></div>`)}
        ${changed ? html`<p class="small muted">You changed ${changed} ${changed === 1 ? 'exercise' : 'exercises'} from Paul's plan.</p>` : ''}
        ${log.notes ? html`<p class="small">Notes: ${log.notes}</p>` : ''}</div>
      <a class="btn btn-block btn-lg" href="#/a/program">Back to program</a>
    </div>`);
  };

  // ------------------------------------------------------------- history
  A.history = async (root, app, params, query) => {
    const logs = await allLogs();
    const progs = await S.all('athlete');
    const pname = (id) => progs.find((p) => p.id === id)?.name || 'Old program';
    const dname = (l) => { const p = progs.find((x) => x.id === l.programId); return (p && M.findDay(p, l.dayId)?.day.name) || 'Workout'; };
    const done = logs.filter((l) => l.status === 'done').sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
    const { events, best } = St.records(logs);
    const lifts = Object.keys(best).filter((id) => St.history(logs, id).length);
    let lift = query.get('ex') && lifts.includes(query.get('ex')) ? query.get('ex') : lifts.includes('squat') ? 'squat' : lifts[0];
    const liftHtml = () => {
      if (!lift) return '<p class="muted">Complete a workout to see your lifts here.</p>';
      const pts = St.history(logs, lift);
      const bwOnly = pts.every((p) => !p.top);
      return String(html`<div class="lift-tabs" role="group" aria-label="Choose exercise">${lifts.map((id) => html`<button type="button" data-lift="${id}" aria-pressed="${id === lift}">${exName(id)}</button>`)}</div>
        ${bwOnly ? html`<p>Bodyweight: best set <b>${best[lift].bwReps} reps</b>.</p>` : raw(UI.liftChart(pts))}
        ${bwOnly ? '' : html`<p class="small muted">Estimated 1RM uses the Epley formula on sets of 10 reps or fewer. It's an <b>estimate</b>, not a tested max.</p>`}
        <table class="table"><thead><tr><th>Date</th><th>Heaviest</th><th>Reps per set</th></tr></thead><tbody>
        ${pts.slice().reverse().map((p) => html`<tr><td>${fmtDate(p.date, { weekday: false })}</td><td class="mono">${p.top ? `${fmtKg(p.top)} kg` : 'BW'} × ${p.reps}</td><td class="mono">${p.repsList.join(', ')}</td></tr>`)}</tbody></table>`);
    };
    root.innerHTML = String(html`<div class="page stack">${UI.topBar({ title: 'Progress' })}
      <div class="stats"><div class="stat"><div class="stat-label">${raw(I.check)} Workouts</div><div class="stat-value">${done.length}</div></div>
        <div class="stat"><div class="stat-label">${raw(I.trophy)} PRs</div><div class="stat-value">${events.length}</div></div></div>
      <div class="card"><h2>Lifts</h2><div data-lift-body>${raw(liftHtml())}</div></div>
      <div class="card"><h2>Personal records</h2>${events.length ? html`<ul class="pr-list">${events.slice().reverse().map((e) => html`<li class="pr-item">${raw(I.trophy)}<span class="grow"><b>${exName(e.exerciseId)}</b> · <span class="mono small">${e.kind === 'reps' ? `${e.reps} reps` : `${fmtKg(e.kg)} kg × ${e.reps}`}${e.kind === 'e1rm' ? ` (est. 1RM ${fmtKg(e.value)})` : ''}</span></span><span class="chip">${fmtDate(e.date, { weekday: false })}</span></li>`)}</ul>` : html`<p class="muted">No PRs yet. Your first session sets the baseline.</p>`}</div>
      <div class="card"><h2>Completed workouts</h2>${done.length ? html`<table class="table"><tbody>${done.map((l) => html`<tr><td>${fmtDate(St.logDate(l), { weekday: false })}</td><td><a href="#/a/p/${l.programId}/d/${l.dayId}/done">${dname(l)}</a><br><span class="small muted">${pname(l.programId)}</span></td><td class="num">${P.util.plural(St.setsDone(l), 'set')}${l.pain ? ' · pain' : ''}</td></tr>`)}</tbody></table>` : html`<p class="muted">Nothing completed yet.</p>`}</div>
    </div>`);
    const offs = [UI.bindCharts(root), on(root, 'click', '[data-lift]', (e, el) => { lift = el.dataset.lift; root.querySelector('[data-lift-body]').innerHTML = liftHtml(); })];
    return () => offs.forEach((f) => f());
  };

  // ------------------------------------------------------------- library
  A.library = async (root, app) => {
    const list = (await S.all('athlete')).sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
    const logs = await allLogs();
    const cur = (await A.current())?.id;
    root.innerHTML = String(html`<div class="page stack">${UI.topBar({ title: 'My programs' })}
      <div class="btn-row"><button class="btn" data-import>${raw(I.file)} Import a .paulino file</button></div>
      <p class="small muted">Got a link from Paul? Just open it on this device: the program is added here.</p>
      ${list.length ? list.map((p) => { const pr = St.progress(p, logs); return html`<div class="card list-card">
        <div class="grow"><h3>${p.name} ${p.id === cur ? html`<span class="chip chip-accent">Current</span>` : ''}</h3>
          <p>${p.athlete ? `${p.athlete} · ` : ''}${P.util.plural(p.weeks.length, 'week')} · from ${fmtDate(p.startDate, { weekday: false, year: true })} · ${pr.done}/${pr.total} done</p>
          <div class="progress progress-sm" style="margin-top:6px" role="progressbar" aria-label="${p.name} progress" aria-valuenow="${pr.pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pr.pct}%"></span></div>
          <div class="btn-row" style="margin-top:10px"><button class="btn btn-sm" data-open="${p.id}">${p.id === cur ? 'Open' : 'Switch to this'}</button><a class="btn btn-sm btn-ghost" href="#/a/p/${p.id}/print">${raw(I.print)} Print</a><button class="btn btn-sm btn-ghost" data-del="${p.id}">${raw(I.trash)} Delete</button></div></div></div>`; })
        : html`<div class="card"><p>No programs saved on this device yet.</p></div>`}
      <div class="card"><h2>Keep your data safe</h2><p class="small">Programs and progress are stored <b>only in this browser</b>. Clearing browser data, using private mode or changing phone loses them. Export a backup now and then.</p>
        <div class="btn-row"><button class="btn btn-ghost" data-backup>Export backup</button><button class="btn btn-ghost" data-restore>Restore backup</button></div></div>
    </div>`);
    const offs = [];
    offs.push(on(root, 'click', '[data-import]', () => A.importFile(app)));
    offs.push(on(root, 'click', '[data-open]', (e, el) => { setCurrent(el.dataset.open); app.navigate(`/a/p/${el.dataset.open}`); }));
    offs.push(on(root, 'click', '[data-del]', async (e, el) => {
      const p = list.find((x) => x.id === el.dataset.del);
      if (!(await confirm({ title: 'Delete program?', text: `"${p.name}" and your logged workouts for it will be deleted from this device.`, ok: 'Delete', danger: true }))) return;
      await S.del('athlete', p.id); await S.delProgramData(p.id);
      if (cur === p.id) S.pref.set('athlete.current', null);
      app.refresh();
    }));
    offs.push(on(root, 'click', '[data-backup]', () => A.exportBackup()));
    offs.push(on(root, 'click', '[data-restore]', () => A.restoreBackup(app)));
    return () => offs.forEach((f) => f());
  };

  A.exportBackup = async () => {
    download(`paulino-backup-${isoDate()}.json`, await S.exportBackup());
    toast('Backup downloaded.', { kind: 'ok' });
  };
  A.restoreBackup = async (app) => {
    const f = await pickFile();
    if (!f) return;
    try {
      const c = await S.importBackup(f.text);
      toast(`Restored: ${c.paul} of Paul's programs, ${c.athlete} programs, ${c.logs} workouts.`, { kind: 'ok', ms: 5000 });
      app.refresh();
    } catch (e) { toast(e.message, { kind: 'error', ms: 6000 }); }
  };

  P.athlete = A;
})(window.Paulino);
</script>
<script>
/* ===== 12. app: routing & boot ============================================= */
(function (P) {
  const { html, raw, on, toast, confirm } = P.util;
  const S = P.store, UI = P.ui, A = P.athlete, Paul = P.paul;
  const root = document.getElementById('app');
  const app = { version: '2.1.0' };
  P.app = app;

  // ---- coach home: three actions, no pep talk ----
  async function coachHome(el) {
    const list = await S.all('paul');
    const own = P.data.customExercises().length;
    el.innerHTML = String(html`<div class="page stack coach-home">
      <header class="coach-head"><div class="coach-face">${raw(P.art.paulino('focused', { size: 'sm' }))}</div>
        <div><span class="mag-kicker">Coach</span><h1>Paul's desk</h1></div>
        <a class="btn btn-sm btn-ghost" href="#/settings">Settings</a></header>
      <button class="card door-card door-btn" data-new><span class="door-kicker">01</span><h2>Create Program</h2><p>Start with week 1.</p></button>
      <a class="card door-card plain" href="#/paul/library"><span class="door-kicker">02</span><h2>Saved Programs</h2><p>${list.length ? P.util.plural(list.length, 'program') : 'None yet'} in this browser.</p></a>
      <a class="card door-card plain" href="#/paul/exercises"><span class="door-kicker">03</span><h2>Manage Exercises</h2><p>${own ? `${P.util.plural(own, 'exercise')} of your own.` : 'Add your own exercises and lessons.'}</p></a>
      <p class="small muted">This page is a separate address, not a login: anyone with this link can open it. Programs stay in this browser until you share them.</p>
    </div>`);
    el.querySelector('[data-new]').onclick = async () => { const p = await Paul.createDialog(list); if (p) { history.replaceState(history.state, '', '#/paul/library'); app.navigate(`/paul/p/${p.id}`); } };
  }

  async function settings(el) {
    const prefs = P.store.pref.get('timer.prefs', { auto: true, sound: true });
    const modeText = { indexeddb: 'Saved in this browser (IndexedDB).', localstorage: 'Saved in this browser (basic storage: IndexedDB is unavailable).', memory: "This browser blocks storage: data is kept only until you close the tab." }[S.mode];
    el.innerHTML = String(html`<div class="page stack">${UI.topBar({ title: 'Settings', back: mode() === 'coach' ? '/coach' : '/' })}
      ${UI.paletteCard()}
      <div class="card"><h2>Rest timer</h2>
        <label class="check"><input type="checkbox" data-pref="auto" ${prefs.auto ? raw('checked') : ''}> Start the rest timer when I tick off a set</label>
        <label class="check"><input type="checkbox" data-pref="sound" ${prefs.sound ? raw('checked') : ''}> Beep and vibrate when rest is over</label></div>
      <div class="card"><h2>Your data</h2><p>${modeText}</p>
        <p class="small">Nothing is sent anywhere. Clearing browser data, private windows or a new phone means starting empty, so <b>export a backup</b> now and then. A backup contains Paul's programs, received programs, workout logs and changes.</p>
        <div class="btn-row"><button class="btn btn-ghost" data-backup>Export backup</button><button class="btn btn-ghost" data-restore>Restore backup</button></div></div>
      <p class="small muted">${P.data.SAFETY.disclaimer}</p>
      <p class="small muted center">Paulino ${app.version}</p>
    </div>`);
    const offs = [];
    offs.push(on(el, 'click', '[data-pal]', (e, b) => { S.pref.set('palette', b.dataset.pal); UI.applyPalette(); app.refresh(); }));
    offs.push(on(el, 'change', '[data-pref]', (e, c) => S.pref.set('timer.prefs', { ...S.pref.get('timer.prefs', { auto: true, sound: true }), [c.dataset.pref]: c.checked })));
    offs.push(on(el, 'click', '[data-backup]', () => A.exportBackup()));
    offs.push(on(el, 'click', '[data-restore]', () => A.restoreBackup(app)));
    return () => offs.forEach((f) => f());
  }

  // ---- router: hash routes driven by pushState/popstate ----
  const routes = [
    ['/', (el) => A.home(el, app)],
    ['/settings', settings],
    ['/coach', coachHome],
    ['/athlete', () => app.navigate('/', { replace: true })],
    ['/academy', (el) => P.academy.index(el, app)],
    ['/academy/:id', (el, p) => P.academy.lesson(el, app, p)],
    ['/paul', () => app.navigate('/coach', { replace: true })],
    ['/paul/library', (el) => Paul.library(el, app)],
    ['/paul/exercises', (el) => Paul.exercises(el, app)],
    ['/paul/exercises/:id', (el, p) => Paul.exerciseEditor(el, app, p)],
    ['/paul/p/:id', (el, p, q) => Paul.editor(el, app, p, q)],
    ['/paul/p/:id/print', async (el, p) => { const prog = await S.get('paul', p.id); if (!prog) return app.navigate('/paul/library', { replace: true }); Paul.printView(el, app, prog, `/paul/p/${p.id}`); }],
    ['/a', () => app.navigate('/', { replace: true })],
    ['/a/program', (el, p) => A.program(el, app, p)],
    ['/a/history', (el, p, q) => A.history(el, app, p, q)],
    ['/a/library', (el) => A.library(el, app)],
    ['/a/import', (el) => { const x = app.pendingImport; if (!x) return app.navigate('/a', { replace: true }); return A.receive(x.program, el, app, x.source); }],
    ['/a/p/:id', (el, p) => A.program(el, app, p)],
    ['/a/p/:id/print', async (el, p) => { const prog = await S.get('athlete', p.id); if (!prog) return app.navigate('/a', { replace: true }); Paul.printView(el, app, prog, `/a/p/${p.id}`); }],
    ['/a/p/:id/d/:dayId', (el, p) => A.workout(el, app, p)],
    ['/a/p/:id/d/:dayId/done', (el, p) => A.results(el, app, p)],
  ].map(([pattern, fn]) => {
    const keys = [];
    const re = new RegExp(`^${pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/?#]+)'; })}/?$`);
    return { re, keys, fn };
  });

  let cleanup = null, seq = 0, depth = history.state?.depth ?? 0, keepScroll = false;

  // ---- which interface: coach (Paul) or athlete; decided by the address, not by a login ----
  const COACH_RE = /^\/(coach|paul)(\/|$)/;
  const mode = () => S.pref.get('mode', 'athlete');
  const NAV = {
    athlete: [['home', '/', 'home', 'Home', /^\/(a)?$/], ['program', '/a/program', 'program', 'My Program', /^\/a\/(program|p\/|library|import)/], ['academy', '/academy', 'academy', 'Academy', /^\/academy/], ['history', '/a/history', 'progress', 'History', /^\/a\/history/]],
    coach: [['home', '/coach', 'home', 'Home', /^\/coach$/], ['programs', '/paul/library', 'library', 'Programs', /^\/paul\/(library|p\/)/], ['exercises', '/paul/exercises', 'academy', 'Exercises', /^\/paul\/exercises/]],
  };
  const navRoot = document.getElementById('nav-root');
  function renderNav(path) {
    if (COACH_RE.test(path)) S.pref.set('mode', 'coach');
    else if (path !== '/settings') S.pref.set('mode', 'athlete');
    const m = /\/print$/.test(path) ? null : mode();
    document.body.classList.toggle('has-nav', Boolean(m));
    if (!m) { navRoot.innerHTML = ''; return; }
    const items = NAV[m];
    navRoot.innerHTML = String(html`<nav class="bottom-nav" style="--n:${items.length}" aria-label="${m === 'coach' ? 'Coach' : 'Athlete'}" data-nav="${m}">${items.map(([key, href, icon, label, re]) => {
      const active = re.test(path);
      return html`<a href="#${href}" class="nav-item${active ? ' active' : ''}" data-nav-item="${key}" ${active ? raw('aria-current="page"') : ''}><span class="nav-icon">${raw(UI.ICONS[icon])}</span><span>${label}</span></a>`;
    })}</nav>`);
  }

  // ---- unsaved changes: a screen registers a check; leaving asks first ----
  let guard = null;
  app.setGuard = (fn) => { guard = fn; };
  const pendingLeave = () => { try { return guard?.() || null; } catch { return null; } };
  async function okToLeave() {
    const msg = pendingLeave();
    if (!msg) return true;
    const leave = await confirm({ title: 'Leave without saving?', text: msg, ok: 'Leave', cancel: 'Stay here', danger: true });
    if (leave) guard = null;
    return leave;
  }
  window.addEventListener('beforeunload', (e) => { if (pendingLeave()) { e.preventDefault(); e.returnValue = ''; } });
  const current = () => { const h = location.hash.replace(/^#/, '') || '/'; const [path, q = ''] = h.split('?'); return { path, query: new URLSearchParams(q) }; };

  async function resolve() {
    const my = ++seq;
    // Shared program link: #program=<data>
    if (location.hash.startsWith('#program=')) {
      const token = location.hash.slice('#program='.length);
      try {
        const program = await P.share.decode(token);
        app.pendingImport = { program, source: 'link' };
        history.replaceState({ depth }, '', '#/a/import');
      } catch (e) {
        history.replaceState({ depth }, '', '#/');
        teardown();
        return A.badLink(root, e.message);
      }
    }
    const { path, query } = current();
    const y = window.scrollY;
    teardown();
    guard = null;
    renderNav(path);
    let r = null, params = {};
    for (const x of routes) { const m = path.match(x.re); if (m) { r = x; params = Object.fromEntries(x.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])); break; } }
    // Each navigation draws into its own container. A view that finishes late (it
    // awaited storage while the user already moved on) draws into a container that
    // is no longer shown, so it can never cover the current page. The previous page
    // stays visible until the new one draws, so there is no blank flash.
    const stage = document.createElement('div');
    stage.className = 'view';
    root.append(stage);
    const swap = new MutationObserver(() => {
      swap.disconnect();
      if (my === seq) for (const c of [...root.children]) if (c !== stage) c.remove();
    });
    swap.observe(stage, { childList: true });
    try {
      const out = await (r ? r.fn(stage, params, query) : notFound(stage));
      if (my !== seq) { if (typeof out === 'function') out(); stage.remove(); return; }
      cleanup = typeof out === 'function' ? out : null;
    } catch (e) {
      console.error(e);
      if (my !== seq) return;
      stage.innerHTML = String(html`<div class="page no-nav"><div class="card error-card"><h2>Something went wrong</h2><p>${e.message}</p><a class="btn" href="#/">Home</a></div></div>`);
    }
    const h1 = stage.querySelector('h1');
    document.title = h1 && h1.textContent.trim() ? `${h1.textContent.trim()} · Paulino` : 'Paulino';
    window.scrollTo(0, keepScroll ? y : 0);
    keepScroll = false;
    here = location.href; hereState = history.state;
  }
  function teardown() { if (cleanup) { try { cleanup(); } catch { /* ignore */ } cleanup = null; } }
  const notFound = (el) => { el.innerHTML = '<div class="page no-nav"><div class="card"><h1>Page not found</h1><a class="btn" href="#/">Home</a></div></div>'; };

  app.navigate = async (path, { replace = false, force = false } = {}) => {
    if (!force && !replace && !(await okToLeave())) return;
    const url = `#${path}`;
    if (replace) history.replaceState({ depth }, '', url);
    else history.pushState({ depth: ++depth }, '', url);
    return resolve();
  };
  app.back = (fallback = '/') => ((history.state?.depth ?? 0) > 0 ? history.back() : app.navigate(fallback, { replace: true }));
  app.refresh = () => { keepScroll = true; return resolve(); };
  /** Update query params of the current route without re-rendering. */
  app.replaceQuery = (obj) => {
    const { path, query } = current();
    for (const [k, v] of Object.entries(obj)) query.set(k, v);
    history.replaceState(history.state, '', `#${path}?${query}`);
  };

  let here = location.href, hereState = history.state;
  window.addEventListener('popstate', async (e) => {
    if (pendingLeave()) {
      const target = location.href, targetState = e.state;
      history.pushState(hereState, '', here);          // stay put while asking
      if (!(await okToLeave())) return;
      history.replaceState(targetState, '', target);
      e = { state: targetState };
    }
    depth = e.state?.depth ?? 0; resolve();
  });
  window.addEventListener('hashchange', () => { if (location.hash.startsWith('#program=')) resolve(); });
  on(document, 'click', '[data-action=back]', async (e, el) => { e.preventDefault(); if (await okToLeave()) app.back(el.dataset.fallback || '/'); });
  on(document, 'click', 'a[href^="#/"]', (e, el) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    app.navigate(el.getAttribute('href').slice(1));
  });
  UI.bindMascots(document);
  // the on-screen keyboard shrinks the visual viewport: hide the bottom bar while it is open
  if (window.visualViewport) {
    const fullH = () => Math.max(innerHeight, document.documentElement.clientHeight);
    visualViewport.addEventListener('resize', () => document.body.classList.toggle('kb-open', visualViewport.height < fullH() * 0.72));
  }

  // The previous Paulino version installed a service worker. Remove it so this
  // version always loads fresh from the host.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
    if (window.caches) caches.keys().then((ks) => ks.filter((k) => k.startsWith('paulino')).forEach((k) => caches.delete(k))).catch(() => {});
  }

  (async () => {
    UI.applyPalette();
    await S.init();
    await P.art.loadManifest();
    try {
      P.data.registerCustom(await S.all('exercises'));
      for (const prog of [...await S.all('athlete'), ...await S.all('paul')]) P.data.registerCustom(prog.custom || [], { onlyMissing: true });
    } catch { /* storage unavailable */ }
    if (!history.state) history.replaceState({ depth: 0 }, '', location.href);
    if (!location.hash) history.replaceState({ depth: 0 }, '', '#/');
    await resolve();
  })();
})(window.Paulino);
</script>
</body>
</html>
